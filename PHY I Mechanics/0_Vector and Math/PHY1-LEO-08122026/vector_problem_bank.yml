bank_info:
    title: Vector Addition and Subtraction with Three Vectors.
    bank_id: PHY1-VECGEN-20260811T203554Z
    description: |-
      The problem bank asks students to calculate the vector operation of three vectors, given their magnitude and direction. One of those vectors has an angle defined with respect to the y-axis. There are three distractors each problem: Direct addition of magnitude with two randomly chosen angles, and ignoring the angle with the y-axis (swapped components of one of the vectors.)
    date_created: 2026-08-11
    status: ready

questions:
  - multiple_choice:
      id: q1
      title: Resultant Vector from Mixed-Axis Angles 1
      points: 1
      text: |
        You are given three vectors:
        <ul>
        <li>Vector <latex>\vec{A}</latex> has a magnitude of 8.0 units at <b><latex>36^\circ</latex> from the positive y-axis</b>.</li>
        <li>Vector <latex>\vec{B}</latex> has a magnitude of 11.0 units at <b><latex>-108^\circ</latex> from the negative x-axis</b>.</li>
        <li>Vector <latex>\vec{C}</latex> has a magnitude of 18.0 units at <b><latex>59^\circ</latex> from the negative y-axis</b>.</li>
        </ul>
        Calculate the resultant vector <latex>\vec{R}</latex> from the operation <latex>\vec{R} = \vec{C} - \vec{B} - \vec{A}</latex>. Choose the option that has the correct magnitude and angle.
      figure: figures/q-1.png
      answers:
        - answer:
            text: 'Magnitude = 31.1 units, Angle = <latex>302.6^\circ</latex>'
            correct: true
        - answer:
            text: 'Magnitude = 1.0 units, Angle = <latex>268.2^\circ</latex>'
            correct: false
        - answer:
            text: 'Magnitude = 16.0 units, Angle = <latex>91.6^\circ</latex>'
            correct: false
        - answer:
            text: 'Magnitude = 1.0 units, Angle = <latex>36.4^\circ</latex>'
            correct: false

