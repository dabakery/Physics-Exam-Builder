bank_info:
    title: Reading Maxwell-Boltzmann Speed Distributions
    bank_id: APP2-THM-MBDIST-081426
    description: |-
      Isomorphic conceptual problems for AP Physics 2, College Board Unit 9
      Topic 9.1. Every question in this bank shows a Maxwell-Boltzmann speed
      distribution and asks the student to read something off it: which sample
      is hottest, what happened to the temperature during a process, what an
      area under the curve counts, or which gas is the most massive.

      The target idea is that the graph describes a spread of speeds rather
      than one speed shared by every molecule, and that the shape of that
      spread is set by temperature and molar mass. Where the TRMS bank works
      the algebra of <latex>K_{avg} \propto T</latex> and
      <latex>v_{rms} \propto \sqrt{T}</latex>, this bank stays with the graph.

      Three misconceptions are targeted repeatedly. The first is reading the
      height of a curve as the temperature, when a taller curve is the colder
      one. The second is treating equal areas as a sign of equal temperature,
      when equal areas only mean the samples hold the same number of
      molecules. The third is treating a shift of the distribution as a
      statement about every individual molecule, when the curves overlap and a
      molecule drawn from the colder sample can easily be the faster of the
      two.
    date created: 08-14-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-KTTP-1 # Relate average translational kinetic energy to absolute temperature
        - THM-KTTP-2 # Relate molecular speed distribution to temperature and molar mass
    generation prompts:
        - prompt 1: |
            (q1, q2 and q3 specified by Michael Baker. q1: three sealed
            containers of one gas brought to three temperatures, asking which
            is hottest. q2: two samples of one gas at two temperatures, asking
            how the speeds of one randomly chosen molecule from each compare,
            with the answer set distinguishing "always" from "more likely".
            q3: one sample taken from state 1 to state 2 by some process,
            asking what happened to the temperature, with a correct conclusion
            reached by bad reasoning offered as a distractor.)
        - prompt 2: |
            (q4-q7 authored as isomorphs. Each keeps the same figure type and
            changes what the student has to extract from it: q4 asks why the
            hotter curve peaks lower, which forces the equal-area argument to
            be stated outright rather than only used; q5 asks what the area of
            a shaded speed band counts; q6 asks how the average speed compares
            to the most probable speed, which is the asymmetry of the curve;
            q7 turns the comparison from temperature to molar mass by holding
            temperature fixed across three gases. Figures are generated by
            Scripts/make_figures.py.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-14-2026) Bank created with q1-q7 and Scripts/make_figures.py.
        - update 2: (08-14-2026) Relabelled the curves in q1-q4 away from A/B/C, which collided with the shuffled answer letters. Samples and gases are now X/Y/Z and q3's process states are numbered. Figures regenerated.
    generation details:
            model:
            version:
            last updated: 08-14-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Comparing Three Temperatures from a Speed Distribution
    points: 2
    text: |
      Three sealed containers hold samples of the same ideal gas. Each sample
      contains the same number of molecules, and each container is brought to a
      different temperature and allowed to settle. The figure shows the
      distribution of molecular speeds in the three containers, labeled X, Y
      and Z. Which container holds the gas at the greatest temperature?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          Container Z, because its molecules are moving at the greatest speeds.
        correct: true
    - answer:
        text: |
          Container Y, because its curve reaches the greatest height, so it has
          the largest number of fast-moving molecules.
        correct: false
    - answer:
        text: |
          Container Y, because its speeds are grouped most tightly around a
          single value, and a narrow distribution means the molecules share
          their energy most efficiently.
        correct: false
    - answer:
        text: |
          All three containers are at the same temperature, because they hold
          the same gas and the same number of molecules, so the areas under the
          three curves are equal.
        correct: false
    feedback:
        general: |
          Temperature is set by how fast the molecules are moving, so look
          along the horizontal axis rather than the vertical one. Curve Y peaks
          near <latex>300</latex> m/s, curve X near <latex>500</latex> m/s and
          curve Z near <latex>800</latex> m/s, so the molecules in Z are the
          fastest and Z is the hottest.

          The height of a curve is worth thinking about carefully, because it
          is the most common thing to misread here. All three samples hold the
          same number of molecules, so all three curves enclose the same area.
          A hotter sample spreads its molecules over a wider range of speeds,
          and to keep the area the same that wider curve has to be lower. The
          tallest curve is therefore the coldest one, which is the opposite of
          what the height seems to suggest at first.

          Equal areas are real, and the last choice notices something true
          about the graph. Equal areas tell you the samples contain equal
          numbers of molecules, which the problem already said. They say
          nothing about temperature.
        on_correct: |
          Correct. You read the speeds off the horizontal axis instead of
          comparing the heights of the curves.
        on_incorrect: |
          Find the speed at which each curve peaks and compare those speeds.
          The height of a curve is not the temperature. Since all three samples
          have the same number of molecules, the widest and lowest curve is the
          hottest one.

- multiple_choice:
    id: q2
    title: Speeds of Two Randomly Chosen Molecules
    points: 2
    text: |
      Two samples of the same ideal gas are held at two different temperatures.
      The figure shows the distribution of molecular speeds in each sample,
      labeled X and Y. You reach into each sample and pick one molecule at
      random. How does the speed of the molecule from sample X compare to the
      speed of the molecule from sample Y?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          The molecule from X is more likely to be the slower of the two, but
          it may turn out to be the faster one.
        correct: true
    - answer:
        text: |
          The molecule from X is always slower than the molecule from Y.
        correct: false
    - answer:
        text: |
          The molecule from X is always faster than the molecule from Y.
        correct: false
    - answer:
        text: |
          The molecule from X is more likely to be the faster of the two, but
          it may turn out to be the slower one.
        correct: false
    feedback:
        general: |
          Sample X peaks near <latex>400</latex> m/s and sample Y peaks near
          <latex>700</latex> m/s, so Y is the hotter sample and its molecules
          are faster on average. A molecule drawn at random from X is therefore
          more likely to be the slower of the two.

          The word "always" is what makes the other choices fail. Look at where
          the two curves overlap. Sample X still has molecules out past
          <latex>800</latex> m/s, and sample Y still has molecules down near
          <latex>200</latex> m/s. If you happen to draw a fast molecule from X
          and a slow one from Y, the molecule from the colder sample is the
          faster one. That is not a rare accident, it is a normal outcome.

          This is the most important habit to build with these graphs. The
          curve describes a whole population, not a single molecule. Raising
          the temperature shifts the odds, and it does not hand every molecule
          in the sample a larger speed.
        on_correct: |
          Correct. The distributions overlap, so the comparison is about which
          outcome is more likely and not about what is certain.
        on_incorrect: |
          Check whether the two curves overlap. Wherever both curves are above
          the axis, both samples contain molecules at that speed, so no
          statement using the word "always" can hold.

- multiple_choice:
    id: q3
    title: Temperature Change During a Thermodynamic Process
    points: 2
    text: |
      A sample of an ideal gas starts in state 1. It is taken through a
      thermodynamic process and ends in state 2. The figure shows the
      distribution of molecular speeds in the two states. Which of the
      following statements about the temperature of the gas is correct, along
      with correct reasoning?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          The temperature increased, because the distribution shifted toward
          higher speeds and so the average translational kinetic energy of the
          molecules increased.
        correct: true
    - answer:
        text: |
          The temperature increased, because in state 2 every molecule in the
          sample is moving faster than it was in state 1.
        correct: false
    - answer:
        text: |
          The temperature decreased, because the curve for state 2 is lower
          than the curve for state 1.
        correct: false
    - answer:
        text: |
          The temperature stayed the same, because the number of molecules did
          not change, so the area under the curve is unchanged.
        correct: false
    feedback:
        general: |
          The distribution moved to the right, from a peak near
          <latex>350</latex> m/s to a peak near <latex>600</latex> m/s. Faster
          molecules carry more kinetic energy, and average translational
          kinetic energy is directly proportional to absolute temperature
          through
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          so the temperature went up.

          The second choice reaches the right conclusion for a reason that does
          not hold, which is worth just as much attention as a wrong answer.
          The two curves overlap, so state 2 still contains slow molecules and
          state 1 still contained fast ones. An individual molecule can easily
          have ended up slower than it started. Temperature is a statement
          about the average over the whole sample.

          The third choice reads the height of the curve as the temperature.
          The curve for state 2 is lower because it is wider, and it has to be
          wider and lower together so that the area stays the same. The fourth
          choice notices that unchanged area correctly, then draws the wrong
          conclusion from it. Equal areas mean the molecules are all still
          there, which is true of any sealed sample, whatever its temperature.
        on_correct: |
          Correct, and you picked the version with the reasoning that actually
          holds up.
        on_incorrect: |
          Two of these choices say the temperature increased, so getting the
          direction right is not enough here. Check the reasoning against the
          graph, and in particular check whether the curves overlap before
          accepting a claim about every molecule.

- multiple_choice:
    id: q4
    title: Why the Hotter Distribution Peaks Lower
    points: 2
    text: |
      The figure shows the distribution of molecular speeds for a sealed sample
      of an ideal gas at two temperatures, labeled X and Y. The sample is
      hotter in Y. Notice that the curve for Y is not only shifted to the right
      but also peaks lower than the curve for X. What is the reason the peak is
      lower?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          The two curves enclose the same area, because the sample still
          contains the same molecules, so a distribution spread over a wider
          range of speeds has to be lower.
        correct: true
    - answer:
        text: |
          Some of the molecules escaped from the sample while it was being
          heated.
        correct: false
    - answer:
        text: |
          The hotter sample contains fewer fast-moving molecules than the
          colder one.
        correct: false
    - answer:
        text: |
          The container expanded as the gas was heated, so the same molecules
          are spread through a larger volume.
        correct: false
    feedback:
        general: |
          The area under one of these curves counts molecules. The sample is
          sealed, so the same molecules are present at both temperatures and
          the two curves have to enclose the same total area.

          Heating the gas widens the distribution, since the molecules end up
          spread across a much larger range of speeds. Curve X is bunched
          between roughly <latex>0</latex> and <latex>1000</latex> m/s, while
          curve Y stretches past <latex>2000</latex> m/s. If a curve gets wider
          and has to keep the same area, the only thing it can do is get
          shorter. That is the whole explanation, and it is a geometric
          argument rather than a physical one about the gas.

          The third choice contradicts the graph directly, since curve Y is the
          one with molecules out at the highest speeds. The last choice
          describes a real effect on the gas, but the horizontal axis is speed
          and not position, so the volume of the container does not change what
          this graph shows.
        on_correct: |
          Correct. Fixed area plus greater width leaves the curve no choice but
          to come down.
        on_incorrect: |
          Ask yourself what the area under the whole curve represents. Since
          the sample is sealed, that area cannot change, so compare the widths
          of the two curves and see what that forces the heights to do.

- multiple_choice:
    id: q5
    title: Meaning of an Area Under the Speed Distribution
    points: 2
    text: |
      The figure shows the distribution of molecular speeds for a sample of an
      ideal gas. The region under the curve between <latex>600</latex> m/s and
      <latex>800</latex> m/s has been shaded. What does the area of the shaded
      region represent?
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          The fraction of the molecules in the sample whose speeds lie between
          <latex>600</latex> and <latex>800</latex> m/s.
        correct: true
    - answer:
        text: |
          The average speed of the molecules in the sample.
        correct: false
    - answer:
        text: |
          The total kinetic energy carried by the molecules whose speeds lie
          between <latex>600</latex> and <latex>800</latex> m/s.
        correct: false
    - answer:
        text: |
          The number of molecules whose speed is exactly
          <latex>700</latex> m/s, which is the middle of the shaded band.
        correct: false
    feedback:
        general: |
          The vertical axis tells you how many molecules are found near a given
          speed, so an area under this curve counts molecules across a range of
          speeds. The shaded area therefore gives the share of the sample whose
          speeds fall between <latex>600</latex> and <latex>800</latex> m/s,
          and the area under the entire curve accounts for all of them.

          The last choice is the interesting one to rule out. Asking for the
          number of molecules moving at exactly <latex>700</latex> m/s is
          asking for the area of a region with no width, which is zero. Speed
          is continuous, so a question about a single exact speed has no useful
          answer. You always have to ask about a range, which is exactly what
          the shaded band gives you.

          Kinetic energy never enters this graph. Reading energy off it would
          mean weighting each molecule by <latex>v^2</latex>, and nothing in
          the area does that for you.
        on_correct: |
          Correct. An area under this curve is a count of molecules over a
          range of speeds.
        on_incorrect: |
          Start from what the vertical axis measures, then ask what multiplying
          it by a width along the horizontal axis would give you. Also consider
          what the area of a region with zero width would have to be.

- multiple_choice:
    id: q6
    title: Average Speed Compared to the Most Probable Speed
    points: 2
    text: |
      The figure shows the distribution of molecular speeds for a sample of an
      ideal gas. The peak of the curve is marked. It sits at
      <latex>400</latex> m/s, which makes that the most probable speed, the
      speed you are most likely to find if you pick one molecule at random. How
      does the average speed of the molecules in this sample compare to the
      most probable speed?
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          The average speed is greater than <latex>400</latex> m/s, because the
          curve has a long tail reaching toward high speeds and no matching
          tail on the low-speed side.
        correct: true
    - answer:
        text: |
          The average speed is exactly <latex>400</latex> m/s, because the peak
          of the curve is where the average always lies.
        correct: false
    - answer:
        text: |
          The average speed is less than <latex>400</latex> m/s, because most
          of the molecules in the sample are slower than the peak.
        correct: false
    - answer:
        text: |
          The average speed cannot be determined without knowing the
          temperature of the gas and the molar mass of the molecules.
        correct: false
    feedback:
        general: |
          Look at the shape of the curve rather than at any one point on it.
          The distribution is not symmetric, and the reason is that the two
          sides of the peak have very different amounts of room. A molecule
          cannot move slower than a standstill, so the curve has only
          <latex>400</latex> m/s of space between the peak and the origin. On
          the fast side there is no such limit, and the curve still has
          molecules out past <latex>800</latex> m/s, which is twice the most
          probable speed. Those fast molecules sit far from the peak and pull
          the average up, and there is nothing correspondingly far away on the
          slow side to pull it back down.

          For a Maxwell-Boltzmann distribution the average speed works out to
          about <latex>1.13</latex> times the most probable speed, so here it
          is roughly <latex>450</latex> m/s. The root-mean-square speed is
          higher still at about <latex>1.22</latex> times the peak speed, near
          <latex>490</latex> m/s, because squaring the speeds gives the fast
          molecules even more weight. The ordering runs most probable, then
          average, then rms, and it comes from the asymmetry every time.

          The last choice is tempting, since the temperature and the molar mass
          do set where the curve sits. They are already baked into the curve
          you were given, so you do not need their values to compare two
          features of the same graph.
        on_correct: |
          Correct. The high-speed tail has no counterpart on the slow side, so
          it drags the average above the peak.
        on_incorrect: |
          Compare how much room the curve has on each side of the peak. It runs
          out of space quickly on the slow side, because speed stops at zero,
          and it trails a long way on the fast side. An average is pulled
          toward the side with the longer tail.

- multiple_choice:
    id: q7
    title: Comparing Three Gases at the Same Temperature
    points: 2
    text: |
      Three samples, each of a different ideal gas, are held at the same
      temperature. Each sample contains the same number of molecules. The
      figure shows the distribution of molecular speeds in the three samples,
      labeled X, Y and Z. Which of the following statements is correct?
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          Gas X has the greatest molar mass, and all three gases have the same
          average translational kinetic energy.
        correct: true
    - answer:
        text: |
          Gas Z has the greatest molar mass, and all three gases have the same
          average translational kinetic energy.
        correct: false
    - answer:
        text: |
          Gas X has the greatest molar mass, and gas Z has the greatest average
          translational kinetic energy, because its molecules are the fastest.
        correct: false
    - answer:
        text: |
          Gas Z has the greatest molar mass, and gas Z has the greatest average
          translational kinetic energy, because heavier molecules carry more
          energy.
        correct: false
    feedback:
        general: |
          Temperature is the same for all three samples, so start there.
          Average translational kinetic energy depends only on absolute
          temperature through
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          There is no mass term in that relationship at all, so all three gases
          have the same average translational kinetic energy even though their
          curves look nothing alike.

          Mass shows up in the speed instead. Rearranging
          <latex>
          v_{rms} = \sqrt{\frac{3 k_B T}{m}}
          </latex>
          shows that at a fixed temperature the more massive molecules are the
          slower ones. Gas X peaks lowest on the speed axis, near
          <latex>350</latex> m/s, so X is the heaviest. Gas Z peaks near
          <latex>1100</latex> m/s and is the lightest.

          It is worth seeing why this is consistent. A heavy, slow molecule and
          a light, fast one can carry the same
          <latex>\frac{1}{2} m v^2</latex>, since the larger mass makes up for
          the smaller speed. That balance is what equal temperature means at
          the molecular level.
        on_correct: |
          Correct. At a fixed temperature the slowest gas is the heaviest, and
          all three still share the same average kinetic energy.
        on_incorrect: |
          Ask first which quantity actually depends on mass. Average kinetic
          energy is fixed by temperature alone, and mass only affects the
          speed, where a heavier molecule must move more slowly to carry the
          same energy.

# ── Notes for the next pass (delete once resolved) ────────────────────────────
#
# Isomorph design, for reference when extending the bank. Every question shows
#   the same kind of graph and changes only what has to be pulled out of it:
#     q1  three samples, one gas, three T   — which is hottest; height is a trap
#     q2  two samples, one gas, two T       — one random molecule from each
#     q3  one sample, state 1 to state 2    — direction of T, plus reasoning
#     q4  two temperatures, wide separation — WHY the hotter curve peaks lower
#     q5  one curve, shaded speed band      — what an area counts
#     q6  one curve, peak marked            — average vs most probable speed
#     q7  three gases, one T                — molar mass, and equal K_avg
#   q1/q2/q3/q4 all show one gas at two or three temperatures and are close
#   relatives, which is intended: the figure is the constant and the question
#   asked is the variable. q7 is the only one that exercises the molar-mass
#   half of THM-KTTP-2, matching TRMS q5.
#
# The equal-area idea appears three times and is deliberately layered. q1 and
#   q3 each carry a distractor that reasons FROM equal areas to equal
#   temperature, which is wrong. q4 then asks for the equal-area argument
#   directly and rewards stating it. A student who meets q4 first has an easier
#   time with q1, which is fine, since the exam builder draws one question per
#   bank per version and they will not appear together.
#
# Curve labels deliberately avoid A/B/C. The exporters letter the answer
#   choices A/B/C/D and then shuffle them (seededShuffle in exam-export.js keyed
#   on version and exam position), so a curve labelled B sits next to an option
#   labelled B that is almost never about it. Samples and gases are X/Y/Z, and
#   q3's process states are numbered. Keep any question added here to that
#   convention.
#
# Figures come from Scripts/make_figures.py, which draws the real normalised
#   Maxwell-Boltzmann distribution. Equal areas are load-bearing here in a way
#   they are not in most banks: q4 asks about the peak height outright, and the
#   q1/q3 distractors depend on the areas genuinely matching. Do not replace
#   these with sketched curves of equal height.
#
# q6 marks the most probable speed on the figure but deliberately does NOT mark
#   the mean, since locating the mean relative to the peak is the question.
