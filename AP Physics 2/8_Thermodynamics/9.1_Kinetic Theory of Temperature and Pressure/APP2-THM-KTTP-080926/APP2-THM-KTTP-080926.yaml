# ── Authoring reminders (delete this block once the bank is written) ──────────
#
# These are the conventions the Markdown → Google Docs exporter depends on.
# Breaking them fails silently: the file downloads fine and the damage only
# shows up after import. Full list in the repo README under "Authoring rules".
#
#   • Math goes in <latex>...</latex> tags. NEVER raw $...$ — only tagged
#     content gets escaped for the Google Docs import, so a backslash command
#     in a raw $...$ span is corrupted (\, arrives as a bare comma).
#   • NEVER put a literal $ in question text. One stray $ inverts every
#     equation in the exported document.
#   • Units go OUTSIDE the tag as plain text — the exporter folds them into the
#     math:  <latex>9.81</latex> m/s²  →  $9.81\ \mathrm{m}/\mathrm{s}^{2}$
#     Recognised: kg mol rad min Hz Pa km cm mm nm ms °C °F Ω N J W A V C K T
#     L m s g °, with · * / and exponents as m/s² or m/s^2.
#   • Do NOT leave a bare single letter right after </latex> — the unit
#     absorber cannot tell a unit from a variable there:
#         <latex>x</latex> L away    ✗  L is read as litres
#         (<latex>x</latex>) L away  ✓  punctuation stops the absorber
#   • Figures: flat filenames, no subfolders, matching the YAML exactly. They
#     are not embedded in the .md export — it emits a placeholder and the image
#     files come from the Bundle .zip.
#   • status: draft hides this bank from the app but does NOT keep it out of
#     the published page — the text still ships inside standalone*.html.
# ─────────────────────────────────────────────────────────────────────────────

questions:

# ── EXAMPLE — replace with real questions ────────────────────────────────────
# Kept as a syntax reference for the two types this bank is likely to use.

- numerical:
    id: q1
    title: Average Kinetic Energy from Temperature
    points: 3
    text: |
      A sealed rigid container holds helium gas at a temperature of
      <latex>320</latex> K. Treat the helium as an ideal gas. The Boltzmann
      constant is <latex>1.38 \times 10^{-23}</latex> J/K.

      Find the average translational kinetic energy of one helium atom, in
      joules. Round your answer to two significant figures.
    answer:
        value: 6.6e-21
        margin_type: percent
        tolerance: 3
    feedback:
        general: |
          The average translational kinetic energy of a gas molecule depends
          only on absolute temperature:
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          Substituting <latex>k_B = 1.38 \times 10^{-23}</latex> J/K and
          <latex>T = 320</latex> K gives
          <latex>K_{avg} = 6.6 \times 10^{-21}</latex> J. Note the result is
          independent of the identity of the gas.
        on_correct: Correct.
        on_incorrect: Check whether you used absolute temperature in kelvin.

- multiple_choice:
    id: q2
    title: Effect of Doubling Absolute Temperature
    points: 2
    text: |
      An ideal gas is sealed in a rigid container. The absolute temperature of
      the gas is doubled. What happens to the average translational kinetic
      energy of the molecules, and to their root-mean-square speed?
    answers:
    - answer:
        text: |
          The average kinetic energy doubles and the rms speed increases by a
          factor of <latex>\sqrt{2}</latex>.
        correct: true
    - answer:
        text: Both the average kinetic energy and the rms speed double.
        correct: false
    - answer:
        text: |
          The average kinetic energy increases by a factor of
          <latex>\sqrt{2}</latex> and the rms speed doubles.
        correct: false
    - answer:
        text: |
          The average kinetic energy doubles and the rms speed is unchanged,
          because the container is rigid.
        correct: false
