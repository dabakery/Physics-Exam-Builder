bank_info:
    title: Identifying a Pressure Volume Graph from a Described Change of State
    bank_id: APP2-THM-PVGRPH-081726
    description: |-
      Isomorphic graph-identification problems for AP Physics 2, College Board
      Unit 9 Topic 9.2.

      A sealed sample of ideal gas is taken from state A to state B, and you are told
      what happens to its volume and its temperature along the way. Four pressure
      volume graphs are drawn on identical numbered axes, each one a straight line
      from the same state A to a different state B. Your job is to decide which graph
      could show the change described. The axes carry numbers because you will need to
      read coordinates off them, and no isotherms are drawn.

      Teaching notes: the target idea is that for a fixed amount of ideal gas the
      product <latex>PV</latex> is proportional to the absolute temperature, so
      comparing the product at the two endpoints tells you which way the temperature
      went. The direction of the line alone is not enough to decide. The common errors
      are reading a falling pressure as a falling temperature, assuming an expansion
      always warms or always cools a gas, treating a straight line whose endpoints
      share a temperature as an isothermal process, and comparing slopes instead of
      comparing products. APP2-THM-PVT-081626 works the same relationship as a ratio
      calculation with no graph, and APP2-THM-CGL-081626 covers the combined gas law
      algebraically.
    date created: 08-17-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-IGL-1 # Apply the ideal gas law to relate pressure, volume, temperature and amount of gas
        - THM-IGL-2 # Predict how one state variable responds to a change in another when the rest are held fixed
        - THM-IGL-3 # Read a pressure volume diagram and compare states using PV proportional to absolute temperature
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted from the owner's outline: an ideal gas in a closed container
            with a moveable piston goes from state A to state B by a process in which
            the gas expands and the temperature decreases. Four P-V graphs are offered,
            all showing increasing volume. One shows increasing pressure, one shows
            constant pressure, and two show decreasing pressure. Of the last two, one
            is wrong because states A and B lie on the same isotherm, so the temperature
            is unchanged. Isotherms are not shown, and the path from A to B is a straight
            line, so the axes must carry numbers and the student compares the product PV
            at the endpoints. q2-q7 are isomorphs that each change the solution rather
            than only the numbers: q2 expands with a falling pressure but a RISING
            temperature, so the correct line is shallower than the equal-temperature
            line instead of steeper, q3 compresses the gas with a rising temperature,
            q4 compresses with a rising pressure and a falling temperature so the
            constant-pressure decoy is removed and the product has to be computed,
            q5 asks for the same temperature at A and B, which makes the decoy from q1
            the correct answer and separates a straight path from an isothermal one,
            and q6 and q7 make the requirement quantitative by naming the final
            temperature as half and then twice the initial temperature.)
        - prompt 2: |
            (All four choices live in one composite figure because the bank schema
            allows one `figure:` per question and has no per-option image field. The
            panels are numbered I to IV rather than lettered so they do not collide
            with the answer letters the exam renderer adds, and every option carries
            `lock: true` so the option order cannot shuffle out of step with the
            panels. Figures are generated by Scripts/make_figures.py.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-17-2026) Bank created with q1-q7. Third bank in Topic 9.2, and the first in this course to use a figure as the answer choices.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-17-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Expansion With a Falling Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas expands and its temperature decreases.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          Graph I
        correct: false
        lock: true
    - answer:
        text: |
          Graph II
        correct: false
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: true
        lock: true
    feedback:
        general: |
          Start with the relationship that connects all three state variables. For a
          fixed amount of ideal gas,
          <latex>
          PV = nRT
          </latex>
          and since <latex>n</latex> and <latex>R</latex> do not change here, the
          product of pressure and volume is proportional to the absolute temperature.
          Read the coordinates of A and B off the axes, multiply, and compare. A
          product that gets smaller means a temperature that gets smaller.

          Every graph starts at <latex>A = (2, 4)</latex>, so the initial product is
          <latex>
          P_A V_A = (4)(2) = 8
          </latex>
          in the units of the axes. Now take the four endpoints in turn.

          Graph I ends at <latex>(4, 6)</latex>, giving a product of 24. Both the
          pressure and the volume increased, so the temperature has to rise. Graph II
          ends at <latex>(4, 4)</latex>, giving 16. The pressure held constant while
          the volume doubled, which also raises the temperature. Graph III ends at
          <latex>(4, 2)</latex>, giving 8 again. The pressure fell, but it fell by
          exactly the factor the volume grew by, so states A and B sit on the same
          isotherm and the temperature at B matches the temperature at A. Graph IV ends
          at <latex>(4, 1)</latex>, giving 4. The product has halved, so the
          temperature at B is half what it was at A.

          Graph IV is the only one that expands and cools, so it is the answer. Notice
          what Graph III is doing, because that is the one worth remembering. A falling
          pressure by itself does not mean a falling temperature. The pressure has to
          fall faster than the volume grows.
        on_correct: |
          Correct. You compared the product <latex>PV</latex> at the two endpoints
          rather than trusting the direction of the line, which is what separates
          Graph IV from Graph III.
        on_incorrect: |
          A falling pressure is not enough on its own. Read the coordinates of A and B
          off the axes, multiply pressure by volume at each end, and find the graph
          where that product gets smaller.

- multiple_choice:
    id: q2
    title: Expansion With a Falling Pressure and a Rising Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas expands, its pressure decreases, and its temperature increases.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          Graph I
        correct: false
        lock: true
    - answer:
        text: |
          Graph II
        correct: true
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: false
        lock: true
    feedback:
        general: |
          All four graphs already do what the first part of the question describes. The
          volume grows and the pressure drops in every one of them, so the picture alone
          will not sort this out. The temperature is what decides it.

          For a fixed amount of ideal gas the product of pressure and volume is
          proportional to the absolute temperature,
          <latex>
          PV = nRT
          </latex>
          so a temperature that rises needs a product that rises.

          Every graph starts at <latex>A = (2, 6)</latex>, so
          <latex>
          P_A V_A = (6)(2) = 12
          </latex>
          Graph I ends at <latex>(6, 2)</latex> for a product of 12, unchanged, so A
          and B are at the same temperature. Graph II ends at <latex>(6, 3)</latex> for
          18, which is larger. Graph III ends at <latex>(6, 1)</latex> for 6, and
          Graph IV ends at <latex>(4, 1)</latex> for 4, both smaller.

          Graph II is the only one where the product grows, so the answer is Graph II.
          Compare it with the previous question. There the correct line was steeper than
          the one that keeps the temperature fixed, and here it is shallower. The rule
          that survives both cases is the product, not the slope.
        on_correct: |
          Correct. Since all four graphs expand with a falling pressure, the product
          <latex>PV</latex> was the only thing that could separate them, and Graph II
          is the one where it grows.
        on_incorrect: |
          Every graph here shows an expansion with a falling pressure, so that part
          cannot help you choose. Multiply pressure by volume at A and at B, and look
          for the graph where the product ends up larger than it started.

- multiple_choice:
    id: q3
    title: Compression With a Rising Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas is compressed and its temperature increases.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          Graph I
        correct: false
        lock: true
    - answer:
        text: |
          Graph II
        correct: false
        lock: true
    - answer:
        text: |
          Graph III
        correct: true
        lock: true
    - answer:
        text: |
          Graph IV
        correct: false
        lock: true
    feedback:
        general: |
          The gas is compressed, so the volume has to end up smaller than it started,
          and all four graphs do that. Use the product to settle the temperature. For a
          fixed amount of ideal gas,
          <latex>
          PV = nRT
          </latex>
          so a rising temperature needs a rising product.

          Every graph starts at <latex>A = (5, 2)</latex>, so
          <latex>
          P_A V_A = (2)(5) = 10
          </latex>
          Graph I ends at <latex>(2, 2)</latex> for a product of 4. The pressure held
          constant while the volume shrank, which cools the gas. Graph II ends at
          <latex>(2, 5)</latex> for 10, so A and B are at the same temperature.
          Graph III ends at <latex>(2, 6)</latex> for 12, which is larger. Graph IV ends
          at <latex>(2, 1)</latex> for 2, the coldest of the four.

          Graph III is the answer. When you squeeze a gas the pressure has to climb by
          more than the volume shrinks before the temperature goes up, and Graph III is
          the only line steep enough to manage it.
        on_correct: |
          Correct. Compressing a gas does not warm it by itself, and you checked that
          the product <latex>PV</latex> actually grew.
        on_incorrect: |
          Compressing a gas does not guarantee that it warms up. Look at Graph I, where
          the pressure stays put and the volume shrinks, and the product drops. Multiply
          pressure by volume at both ends of each line and find the one that grows.

- multiple_choice:
    id: q4
    title: Compression With a Rising Pressure and a Falling Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas is compressed, its pressure increases, and its temperature decreases.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          Graph I
        correct: true
        lock: true
    - answer:
        text: |
          Graph II
        correct: false
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: false
        lock: true
    feedback:
        general: |
          Every graph here compresses the gas and raises its pressure, so once again the
          shape of the line will not choose for you. Go to the product. For a fixed
          amount of ideal gas,
          <latex>
          PV = nRT
          </latex>
          and a falling temperature needs a falling product.

          Every graph starts at <latex>A = (6, 2)</latex>, so
          <latex>
          P_A V_A = (2)(6) = 12
          </latex>
          Graph I ends at <latex>(3, 3)</latex> for a product of 9, which is smaller.
          Graph II ends at <latex>(3, 4)</latex> for 12, unchanged. Graph III ends at
          <latex>(3, 5)</latex> for 15, and Graph IV ends at <latex>(4, 4)</latex> for
          16, both larger.

          Graph I is the answer. This is a good case to keep in mind, because a gas
          being squeezed into a smaller space at a higher pressure looks like it should
          be heating up. It only heats up if the pressure rises by a larger factor than
          the volume falls, and in Graph I the volume halves while the pressure grows by
          only half again.
        on_correct: |
          Correct. Both the pressure and the volume were working against each other
          here, and the product <latex>PV</latex> is what tells you which one won.
        on_incorrect: |
          All four graphs compress the gas and raise the pressure, so neither of those
          can pick the answer. Multiply pressure by volume at each end and find the
          graph where the product ends up smaller.

- multiple_choice:
    id: q5
    title: Expansion Ending at the Same Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas expands, and the temperature at state B turns out to be the same as the
      temperature at state A.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          Graph I
        correct: false
        lock: true
    - answer:
        text: |
          Graph II
        correct: true
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: false
        lock: true
    feedback:
        general: |
          Equal temperatures at the two ends means equal products at the two ends, since
          for a fixed amount of ideal gas
          <latex>
          PV = nRT
          </latex>

          Every graph starts at <latex>A = (1, 6)</latex>, so
          <latex>
          P_A V_A = (6)(1) = 6
          </latex>
          Graph I ends at <latex>(6, 2)</latex> for a product of 12, so B is hotter.
          Graph II ends at <latex>(6, 1)</latex> for 6, which matches. Graph III ends at
          <latex>(4, 1)</latex> for 4, so B is colder. Graph IV holds the pressure
          constant out to <latex>(6, 6)</latex> for 36, much hotter.

          Graph II is the answer. There is one more thing worth saying about it. States
          A and B lie on the same isotherm, but the straight line joining them is not an
          isothermal process. Pick any point in the middle of that line, say
          <latex>(3.5, 3.5)</latex>, and its product is 12.25, well above 6. The gas
          warms up on the way out and cools back down again, ending where it began. An
          isothermal process would follow the curve <latex>P = nRT/V</latex> instead,
          which bows in toward the origin. Since the isotherms are not drawn on these
          axes, comparing the products at the endpoints is how you tell.
        on_correct: |
          Correct, and notice how much this question just gave you. The graph you ruled
          out in the first question of this bank is the one you needed here. Reading the
          same picture differently depending on what is being asked is Physics!
        on_incorrect: |
          Equal temperatures mean equal products. Multiply pressure by volume at A, then
          look for the graph whose state B gives you the same number back.

- multiple_choice:
    id: q6
    title: Expansion to Half the Initial Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas expands, and the absolute temperature at state B is half the absolute
      temperature at state A.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          Graph I
        correct: true
        lock: true
    - answer:
        text: |
          Graph II
        correct: false
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: false
        lock: true
    feedback:
        general: |
          This question asks for a specific number rather than a direction, which
          actually makes it easier. The product is proportional to the absolute
          temperature,
          <latex>
          PV = nRT
          </latex>
          so halving the temperature means halving the product.

          Every graph starts at <latex>A = (2, 6)</latex>, so
          <latex>
          P_A V_A = (6)(2) = 12
          </latex>
          and you are looking for a state B whose product is 6.

          Graph I ends at <latex>(6, 1)</latex> for a product of 6, which is the target.
          Graph II ends at <latex>(6, 2)</latex> for 12, the same temperature it started
          at. Graph III ends at <latex>(6, 3)</latex> for 18, warmer. Graph IV ends at
          <latex>(4, 2)</latex> for 8, which is cooler but not by enough, since 8 is two
          thirds of 12 rather than half.

          Graph I is the answer. Graph IV is the one to watch out for. It does cool the
          gas, so it passes the test from the first question in this bank, and it takes
          the actual arithmetic to rule it out.
        on_correct: |
          Correct. You halved the product rather than settling for any line that cools
          the gas, which is what ruled out Graph IV.
        on_incorrect: |
          Find the product at A first, then halve it, and only then look at the four
          endpoints. Two of these graphs cool the gas, so checking the direction alone
          will not get you there.

- multiple_choice:
    id: q7
    title: Compression to Twice the Initial Temperature
    points: 2
    text: |
      A fixed amount of ideal gas is sealed inside a container closed by a piston that
      is free to move. The gas is taken from state A to state B by a process in which
      the gas is compressed, and the absolute temperature at state B is twice the
      absolute temperature at state A.

      The four graphs below show pressure against volume on identical axes, with
      pressure in units of <latex>10^5</latex> Pa and volume in liters. Each graph
      begins at the same state A and follows a straight line to a different state B.
      Which graph could show this change of state?
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          Graph I
        correct: false
        lock: true
    - answer:
        text: |
          Graph II
        correct: false
        lock: true
    - answer:
        text: |
          Graph III
        correct: false
        lock: true
    - answer:
        text: |
          Graph IV
        correct: true
        lock: true
    feedback:
        general: |
          Doubling the absolute temperature means doubling the product, since
          <latex>
          PV = nRT
          </latex>
          for a fixed amount of ideal gas.

          Every graph starts at <latex>A = (6, 1)</latex>, so
          <latex>
          P_A V_A = (1)(6) = 6
          </latex>
          and you are looking for a state B whose product is 12.

          Graph I ends at <latex>(3, 2)</latex> for a product of 6, the same temperature
          it started at. Graph II ends at <latex>(3, 3)</latex> for 9, warmer but not
          doubled. Graph III ends at <latex>(2, 5)</latex> for 10, closer but still
          short. Graph IV ends at <latex>(3, 4)</latex> for 12, exactly double.

          Graph IV is the answer. Three of these four warm the gas up, so this is
          another question where the direction gets you nowhere and the arithmetic
          decides it. When the numbers are close together like 9, 10 and 12, take the
          time to read the coordinates carefully off the grid before you multiply.
        on_correct: |
          Correct. Three of the four graphs warmed the gas, and doubling the product is
          what picked out the right one.
        on_incorrect: |
          Work out the product at A, double it, and then check each endpoint against
          that target. Most of these graphs do warm the gas, so you have to compare the
          actual numbers rather than the direction.
