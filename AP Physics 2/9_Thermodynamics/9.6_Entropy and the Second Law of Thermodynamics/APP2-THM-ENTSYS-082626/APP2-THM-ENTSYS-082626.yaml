bank_info:
    title: Entropy Change of a System in Open and Closed Situations
    bank_id: APP2-THM-ENTSYS-082626
    description: |-
      Isomorphic reasoning problems for AP Physics 2, College Board Unit 9 Topic 9.6.

      Something is sealed up and left alone, or else it is left open to its surroundings,
      and you are asked what happens to the entropy of the system over time. Every choice
      pairs an answer with a reason, so an answer that is right for the wrong reason is
      still wrong. Before you decide, be clear about where the boundary of the system has
      been drawn, because a quantity that is forbidden to decrease inside one boundary is
      free to decrease inside another.

      Teaching notes: the target idea is that the entropy of an isolated system never
      decreases and increases whenever an irreversible process runs inside it, while the
      entropy of a part of that system, or of a system that exchanges energy with its
      surroundings, is free to fall. The common errors are treating entropy as a conserved
      quantity like energy, reading a uniform final temperature as a more orderly state,
      assuming an isolated system's entropy must always increase even when nothing is
      happening, applying the entropy of an isolated system to a system that is plainly
      open, and pairing equal energy transfers with equal entropy changes when the two
      objects are at different temperatures. APP2-THM-ETDIR-081826 establishes the
      direction of thermal energy transfer and what thermal equilibrium is a statement
      about, and APP2-THM-FLPV-081826 covers the first law, which several distractors here
      quietly borrow from.
    date created: 08-26-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-ENT-1 # Predict whether the entropy of a system increases, decreases, or stays the same as a process runs
        - THM-ENT-2 # Distinguish an isolated system from one that exchanges energy with its surroundings, and apply the second law to the correct boundary
        - THM-ENT-3 # Recognize that entropy is not conserved, and that a decrease in one part of a system is permitted when a larger increase happens elsewhere
        - THM-ENT-4 # Identify a spontaneous process as irreversible, and explain why the reverse process does not happen even though it would conserve energy
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted from the owner's outline: two metal blocks at different
            temperatures, in thermal contact inside a sealed insulated container. The
            student picks what happens to the entropy of the system together with a
            reason. The correct choice attributes the increase to the irreversibility of
            the approach to thermal equilibrium. The distractors attribute an increase to
            the whole system cooling toward its surroundings, which an isolated system
            has none of; hold entropy constant on the grounds that a closed system
            conserves it, which conflates entropy with energy; and call for a decrease on
            the grounds that a uniform temperature is a more orderly state.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution
            rather than the nouns: q2 is a free expansion of an ideal gas into a vacuum,
            so the entropy rises with no energy crossing the boundary and no change in
            temperature; q3 starts the two blocks at the same temperature, so the answer
            becomes no change and the distractor that an isolated system's entropy always
            increases is the one that fails; q4 moves the boundary around a tray of water
            in a freezer, so the system is open and its entropy falls; q5 redraws the
            boundary around the water, the freezer and the room together, so the total
            rises, with a distractor that the room gains exactly what the water loses;
            q6 asks about the two blocks separately rather than the system, so one
            entropy falls, the other rises, and the equal energy transfer produces
            unequal entropy changes because the temperatures differ; q7 starts from
            equilibrium and asks whether the blocks can separate again on their own,
            which energy conservation permits and the second law forbids.)
        - prompt 3: |
            (Figures for q2, q4 and q5 generated by Scripts/make_figures.py. q2 shows the
            container before and after, with the same number of particles in both panels so
            the picture does not settle the question. q4 and q5 are one scene drawn twice by
            a single function, with only the dashed system boundary moved, since the pair of
            questions exists to contrast those two boundaries.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-26-2026) Bank created with q1-q7. First bank in Topic 9.6.
        - update 2: (08-26-2026) Added figures for q2, q4 and q5, and Scripts/make_figures.py that generates them. Reworded the q5 setup so the electrical energy crossing the boundary in the figure is stated in the question rather than idealised away, and extended its solution to say why work crossing a boundary does not lift the second law's floor.
        - update 3: (09-04-2026) Balanced the multiple choice option lengths in q3 and q5. No claim changed.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-26-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Two Metal Blocks Sealed in an Insulated Container
    points: 2
    text: |
      A block of copper at <latex>500</latex> K and a block of iron at <latex>300</latex>
      K are placed in contact with each other, sealed inside a rigid insulated container,
      and left alone. No energy and no matter can cross the wall of the container. The
      blocks are left long enough to reach thermal equilibrium.

      Which of the following describes what happens to the entropy of the system inside
      the container, along with a correct justification?
    answers:
    - answer:
        text: |
          It increases, because the transfer of energy from the hotter block to the
          cooler block is an irreversible process.
        correct: true
    - answer:
        text: |
          It increases, because the two blocks go on cooling as a whole and give up more
          and more energy over time.
        correct: false
    - answer:
        text: |
          It stays constant, because nothing enters or leaves a sealed insulated
          container, so the entropy of the system is conserved.
        correct: false
    - answer:
        text: |
          It decreases, because the blocks end up at a single uniform temperature, which
          is a more orderly state than the one they started in.
        correct: false
    feedback:
        general: |
          The entropy of the system increases. Energy moves on its own from the copper to
          the iron until the two share one temperature, and a process that runs on its own
          in one direction and never on its own in the other is irreversible. The second
          law says the entropy of an isolated system never decreases, and that it increases
          whenever an irreversible process runs inside it.

          Start with the boundary, because that is what decides which rule applies. The
          container is rigid, sealed and insulated, so no energy and no matter cross it.
          Everything that happens, happens inside. Whatever leaves the copper arrives at
          the iron, so the total energy of the system does not change at all while its
          entropy climbs. That pair of facts is the whole point of the question, and it is
          worth holding onto: energy is conserved here and entropy is not.

          Each of the other choices is a real line of thinking, so take them one at a time.

          The blocks cannot cool as a whole. Cooling means giving energy up to something,
          and an insulated sealed container has nothing to give it up to. Whatever
          temperature the two blocks settle at, they stay there. If you found yourself
          picturing the blocks slowly returning to room temperature, notice that the
          problem removed the room from the situation entirely.

          Entropy is not conserved, and this is the idea most worth separating out. A
          sealed insulated container does conserve the energy inside it, and it is natural
          to expect that a quantity written with a delta and tracked through a process
          behaves the same way. Entropy has no conservation law. It has an inequality
          instead: for an isolated system,
          <latex>
          \Delta S \ge 0
          </latex>
          with the equality holding only for a reversible process. Real processes that run
          on their own are not reversible, so the entropy goes up.

          The last choice reads a uniform temperature as an orderly state, which is the
          most interesting mistake here. Order in the everyday sense is about where things
          are, and entropy counts how many microscopic arrangements of the particles look
          the same from the outside. Splitting the energy evenly between the two blocks
          gives it far more ways to be spread around than piling most of it into the copper
          did. The temperature reading is uniform, and the arrangement of energy underneath
          it is less constrained than before, not more.
        on_correct: |
          Correct, and you did it while the total energy inside the container stayed fixed.
          Keeping entropy and energy apart is most of this topic.
        on_incorrect: |
          Before deciding what a quantity does, check where the boundary of the system has
          been drawn and what is allowed to cross it. What can this container exchange with
          the room around it, and which of the quantities in your reasoning is the one with
          a conservation law?

- multiple_choice:
    id: q2
    title: A Gas Expanding into an Empty Half
    points: 2
    figure: figure_folder/q-2.png
    text: |
      A rigid insulated container is divided into two equal halves by a thin partition.
      One half holds an ideal gas and the other half is evacuated (empty). The partition is
      removed and the gas fills the whole container. No energy crosses the wall of the
      container, no work is done on the surroundings, and the temperature of the gas is
      the same after the expansion as it was before. The figure shows the container
      before the partition is removed and after the gas has filled it.

      Which of the following describes what happens to the entropy of the gas, along with
      a correct justification?
    answers:
    - answer:
        text: |
          It stays the same, because no energy was transferred into or out of the gas and
          its temperature did not change.
        correct: false
    - answer:
        text: |
          It increases, because the gas now has far more ways to arrange its particles
          among the positions available to them.
        correct: true
    - answer:
        text: |
          It increases, because the gas does work pushing itself into the empty half, and
          that work raises the entropy.
        correct: false
    - answer:
        text: |
          It decreases, because the same amount of gas is now spread thinly through twice
          the volume instead of being concentrated.
        correct: false
    feedback:
        general: |
          The entropy of the gas increases. Nothing entered the gas and nothing left it,
          and its entropy went up anyway, which makes this the cleanest demonstration in
          the topic that entropy is not an accounting of energy.

          Follow the energy first, since the problem hands it to you. The container is
          insulated, so no energy is transferred by heating. The gas expands into a vacuum,
          so there is nothing on the other side of the boundary to push against and no work
          is done. The first law then gives
          <latex>
          \Delta U = Q - W = 0
          </latex>
          and for an ideal gas an unchanged internal energy means an unchanged temperature,
          which is why the problem could tell you the temperature stayed put.

          Now follow the entropy, which is a different question with a different answer.
          Entropy counts the number of microscopic arrangements that produce the same
          large scale state. Doubling the volume doubles the space each particle could be
          found in, and with something like <latex>10^{23}</latex> particles the number of
          arrangements is multiplied by an almost unimaginable factor. The gas is in a far
          more likely state after the partition is removed than before.

          You can also test it by asking whether the process runs backward on its own. Put
          the partition back and wait. The gas never collects itself into one half and
          leaves the other empty, even though doing so would conserve energy perfectly.
          That one way street is the signature of a process that raises entropy.

          The choice that credits the work is worth a careful look, because the reasoning
          is sound right up to the setup. A gas expanding against a piston does work, and
          in the usual isothermal expansion that work is real and the entropy of the gas
          does rise. Here there is no piston and no gas on the other side, so there is
          nothing to push on and the gas does no work at all. The entropy rises for the
          other reason.

          The last choice treats a thin, spread out gas as the more ordered arrangement,
          which is backwards. Concentrating the gas in one half is the constrained
          situation, since every particle has to be in a particular region. Letting it fill
          the container removes that constraint.
        on_correct: |
          Correct. No energy crossed the boundary and the entropy still changed, which is
          the sharpest way to see that the two are not the same quantity.
        on_incorrect: |
          The problem tells you outright that the temperature and the energy of the gas did
          not change, so a reason built on either of those cannot separate the choices. What
          else about the gas is different after the partition is removed, and how would you
          count it?

- multiple_choice:
    id: q3
    title: Two Blocks Already at the Same Temperature
    points: 2
    text: |
      Two aluminum blocks, both at <latex>350</latex> K, are placed in contact with each
      other and sealed inside a rigid insulated container. No energy and no matter can
      cross the wall of the container. The blocks are left alone for several hours.

      Which of the following describes what happens to the entropy of the system inside
      the container, along with a correct justification?
    answers:
    - answer:
        text: |
          It increases, because the entropy of an isolated system always
          increases as time passes, whatever is inside it.
        correct: false
    - answer:
        text: |
          It stays essentially the same, because the blocks are already in
          thermal equilibrium and no net energy transfer takes place.
        correct: true
    - answer:
        text: |
          It increases, because energy still crosses the boundary between the two blocks in
          both directions.
        correct: false
    - answer:
        text: |
          It decreases, because two blocks at a single shared temperature are already in the
          most orderly arrangement available to them.
        correct: false
    feedback:
        general: |
          The entropy of the system stays essentially the same. The blocks start at the same
          temperature, so they are already in thermal equilibrium, and there is no net
          transfer of energy for an irreversible process to ride on.

          This is where the wording of the second law earns its keep. It says the entropy of
          an isolated system never decreases,
          <latex>
          \Delta S \ge 0
          </latex>
          and that is not the same claim as saying it always increases. The equality is the
          case where nothing irreversible happens, which is exactly the situation here.
          Compare this with the copper and iron version of the problem, where a real
          temperature difference drove a real net transfer and the entropy climbed. Nothing
          about the container changed between the two. What changed is whether a process was
          running inside it.

          The choice about energy crossing the boundary between the blocks gets the physics
          of equilibrium right and then draws the wrong conclusion from it. Energy really is
          exchanged in both directions all the time, one collision at a time along the
          surface where the blocks touch. Because the two are at the same temperature, each
          block gives up as much as it receives on average, so nothing accumulates on either
          side and no large scale change occurs. Equilibrium is not stillness at the particle
          level, it is a balance.

          The last choice runs into the same idea as before from the other direction. A
          shared temperature is not a statement about order. It is a statement about the
          average energy per particle matching on both sides, which is the arrangement the
          energy is most likely to be found in, not the least.

          To be fair to the very careful reader, tiny fluctuations do happen, and for a
          moment one block can hold a hair more energy than its share. Those fluctuations are
          far too small to measure for objects of this size and they average to nothing, which
          is why the answer says essentially the same rather than exactly.
        on_correct: |
          Correct. The second law sets a floor on the entropy change of an isolated system, and
          you noticed that the floor is where this one sits.
        on_incorrect: |
          Read the second law back to yourself in its exact words and compare them with the
          reason you chose. Is there anything actually happening between these two blocks that
          was not happening between the hot and cold pair?

- multiple_choice:
    id: q4
    title: A Tray of Water Left in a Freezer
    points: 2
    figure: figure_folder/q-4.png
    text: |
      A tray of liquid water at <latex>0</latex> °C is placed in a freezer and left there
      until all of it has frozen into ice at <latex>0</latex> °C. The freezer is running the
      whole time, and the tray is in contact with the cold air inside it. The dashed line
      in the figure shows the boundary of the system this question asks about.

      Which of the following describes what happens to the entropy of the water in the tray,
      along with a correct justification?
    answers:
    - answer:
        text: |
          It decreases, and this is permitted because the water is not isolated from its
          surroundings.
        correct: true
    - answer:
        text: |
          It cannot decrease, because the second law of thermodynamics forbids the entropy of
          anything from going down.
        correct: false
    - answer:
        text: |
          It increases, because freezing is an irreversible process and irreversible processes
          raise entropy.
        correct: false
    - answer:
        text: |
          It does not change, because the water stays at <latex>0</latex> °C from the moment
          it starts freezing to the moment it finishes.
        correct: false
    feedback:
        general: |
          The entropy of the water decreases, and there is nothing wrong with that, because
          the water is not an isolated system.

          Check the boundary first, the same way you would in the sealed container problems.
          Draw it around the water alone and energy crosses it freely, leaving the water and
          entering the cold air of the freezer. The second law puts its floor of
          <latex>
          \Delta S \ge 0
          </latex>
          on an isolated system, and this water is not one. Once energy is allowed to leave,
          entropy can leave with it. Every refrigerator you have ever used depends on this
          being possible.

          The molecules make the direction easy to believe. In liquid water they slide past
          one another and can be found in an enormous variety of arrangements. In ice they
          are locked into a lattice, each one held near a particular site. Far fewer
          arrangements produce the ice than produce the liquid, so the entropy of the water
          falls as it freezes.

          The choice that freezing must raise entropy because it is irreversible mixes two
          different statements together. Irreversibility does guarantee an entropy increase,
          but for the isolated system as a whole, not for whichever piece of it you happen to
          be looking at. Freezing the water is indeed irreversible in the sense that the room
          will not spontaneously undo it, and the entropy that goes up in the process belongs
          to the freezer and the kitchen, not to the water.

          The last choice notices something true and asks it to do the wrong job. The
          temperature really does hold at <latex>0</latex> °C throughout, because the energy
          leaving during freezing is latent heat and it goes into rearranging the molecules
          rather than slowing them down. A constant temperature does not mean a constant
          entropy. Energy is still leaving the water the entire time, and the entropy leaves
          with it,
          <latex>
          \Delta S = \frac{Q}{T}
          </latex>
          with <latex>Q</latex> negative for the water. Notice that this expression has a
          temperature in it and would be useless if it did not.
        on_correct: |
          Correct. You checked the boundary before you applied the rule, which is the habit
          this whole topic is built on.
        on_incorrect: |
          The second law places its restriction on one particular kind of system. Which kind
          is that, and can the water in this tray exchange anything with the air around it?

- multiple_choice:
    id: q5
    title: The Freezer, the Water, and the Kitchen Together
    points: 2
    figure: figure_folder/q-5.png
    text: |
      A tray of liquid water at <latex>0</latex> °C is placed in a freezer and left until it
      has frozen into ice at <latex>0</latex> °C. Now consider the water, the freezer, and
      the kitchen the freezer sits in, all taken together as one system. Nothing crosses
      the boundary of that combined system except the electrical energy the freezer draws
      through its cord. The dashed line in the figure shows where that boundary has been
      drawn, and it is the only thing about this situation that has changed.

      Which of the following describes what happens to the total entropy of that combined
      system, along with a correct justification?
    answers:
    - answer:
        text: |
          It stays the same, because the entropy lost by the water is exactly the entropy
          gained by the kitchen.
        correct: false
    - answer:
        text: |
          It increases, because the freezer releases energy into the kitchen and
          raises its entropy by more than the water's falls.
        correct: true
    - answer:
        text: |
          It stays the same, because energy is conserved and the energy that leaves the water
          all ends up somewhere else.
        correct: false
    - answer:
        text: |
          It decreases, because ice is a more ordered arrangement of molecules
          than the liquid water it came from.
        correct: false
    feedback:
        general: |
          The total entropy increases. Redrawing the boundary to enclose the freezer and the
          kitchen puts everything the water's energy is handed to inside the system. The only
          thing still crossing that boundary is the electrical energy carried in along the
          cord, and energy transferred as work brings no entropy with it, so the floor the
          second law sets,
          <latex>
          \Delta S \ge 0
          </latex>
          applies to the whole of it again.

          Follow the energy through the appliance. The freezer pulls energy out of the water,
          its motor draws electrical energy from the wall, and the coils on the back dump the
          sum of the two into the kitchen air. The room gains more energy than the water lost,
          and it gains it at a higher temperature than the water gave it up at. Both of those
          push the same way, so the entropy the kitchen gains outweighs the entropy the water
          lost.

          Set this beside the version of the problem that looked at the water alone. The
          physical situation is identical and the answers are opposite, because the boundary
          moved. That is the skill this topic is really asking for. Before you decide whether
          an entropy is allowed to fall, decide what you have drawn your boundary around.

          The first choice describes something that could very nearly happen, which is what
          makes it worth thinking about. A perfectly reversible refrigerator, run
          infinitesimally slowly with no friction and no temperature gap anywhere it transfers
          energy, would move entropy from the water to the room and break even. No real
          appliance is anywhere close. Friction in the compressor, resistance in the wiring
          and the temperature difference the coils need in order to shed energy into the room
          at all are each irreversible, and each one adds entropy that no one takes away.

          The choice that argues from conservation of energy is the same conflation that runs
          through this whole bank. The energy is conserved, and every joule really does end up
          somewhere. Entropy has no such law, so knowing where the energy went tells you
          nothing on its own about the total entropy.

          The last choice is correct about the ice and stops one step early. Ice is more
          ordered than liquid water and the entropy of the water does fall. That fall is one
          term in the total, and the question asks for the total.
        on_correct: |
          Correct, and notice you gave the opposite answer to the same freezer a moment ago.
          The boundary changed, not the physics.
        on_incorrect: |
          The water is only one part of the system this question asks about. What else is
          inside the boundary this time, and what is the freezer doing to it while it runs?

- multiple_choice:
    id: q6
    title: Comparing the Two Blocks Separately
    points: 2
    text: |
      A block of lead at <latex>600</latex> K and a block of brass at <latex>300</latex> K are
      placed in contact with each other, sealed inside a rigid insulated container, and left
      to reach thermal equilibrium. Consider the entropy of each block on its own rather than
      the entropy of the system as a whole.

      Which of the following is correct?
    answers:
    - answer:
        text: |
          The entropy of the lead decreases and the entropy of the brass increases, and the
          increase is larger than the decrease.
        correct: true
    - answer:
        text: |
          The entropy of the lead decreases and the entropy of the brass increases by exactly
          the same amount, because the energy that leaves one is the energy that enters the
          other.
        correct: false
    - answer:
        text: |
          The entropy of both blocks increases, because every part of an isolated system must
          gain entropy as the system moves toward equilibrium.
        correct: false
    - answer:
        text: |
          The entropy of the lead increases and the entropy of the brass decreases, because
          entropy travels in the same direction as the energy.
        correct: false
    feedback:
        general: |
          The lead loses entropy, the brass gains it, and the gain is larger. Add the two
          together and the entropy of the system goes up, which is what the second law requires
          of the sealed container.

          The first thing to be comfortable with is that one block's entropy is allowed to
          fall. The lead is not isolated, since it is in contact with the brass and energy
          leaves it freely. Only the pair of them together is isolated, and only the pair of
          them together is bound by the floor the second law sets.

          The choice that makes the two changes equal is the one to spend time on, because its
          starting point is right. The same energy really does leave the lead and enter the
          brass. Entropy change depends on the temperature at which the energy is transferred
          as well as on the energy,
          <latex>
          \Delta S = \frac{Q}{T}
          </latex>
          and the two blocks are at different temperatures the whole time. The same energy
          divided by the larger temperature gives a smaller number than the same energy divided
          by the smaller temperature, so the brass gains more than the lead gives up.

          There is a physical picture underneath the arithmetic that is worth carrying with
          you. A joule delivered to something cold makes a bigger difference to it than a joule
          taken from something hot takes away, in the same way that a dollar means more to
          someone who has very little than to someone who has a great deal. That asymmetry is
          the reason the total climbs, and it is the reason energy flowing from hot to cold is
          irreversible in the first place.

          The choice that has both blocks gaining entropy overreaches with a rule that applies
          to systems and not to their parts. If it were true for every part, nothing could ever
          be cooled or frozen or organized at all.

          The choice that sends the entropy in the same direction as the energy has it exactly
          backwards for the lead. The lead is losing energy, and losing energy at a
          temperature is losing entropy.
        on_correct: |
          Correct, and the piece most people miss is why the two changes are unequal. You had
          both the direction and the size right.
        on_incorrect: |
          The same energy leaves one block and enters the other, but the two blocks are not
          alike in every respect while that happens. What else does an entropy change depend on
          besides the amount of energy transferred?

- multiple_choice:
    id: q7
    title: Can the Blocks Separate Again on Their Own
    points: 2
    text: |
      Two metal blocks that started at different temperatures have been sealed in a rigid
      insulated container and have now reached thermal equilibrium at a single temperature.
      The container is left undisturbed. A student suggests that if you waited long enough,
      one block might grow hot again while the other grows cold, returning the pair to the
      state they started in.

      Which of the following is the best response, along with a correct justification?
    answers:
    - answer:
        text: |
          It will not happen, because it would require the entropy of an isolated system to
          decrease, even though the total energy would be unchanged.
        correct: true
    - answer:
        text: |
          It will not happen, because energy cannot move from a cooler object to a hotter one
          without violating conservation of energy.
        correct: false
    - answer:
        text: |
          It will happen eventually, because the process that brought the blocks to equilibrium
          is reversible and every process runs backward given enough time.
        correct: false
    - answer:
        text: |
          It will happen eventually, because the total energy inside the container would be the
          same either way and nothing in Physics forbids it.
        correct: false
    feedback:
        general: |
          It will not happen. Separating back into a hot block and a cold block would lower the
          entropy of an isolated system, and the second law rules that out.

          The reason this question is worth asking is that the student's suggestion survives
          every other test you could put to it. Count the energy before and after and the
          totals match, so conservation of energy has no objection at all. The first law would
          be perfectly happy. If the first law were the only law, warm water would sometimes
          separate into a hot layer and a cold one on its own, and it does not. Something else
          is doing the forbidding, and the second law is the only law we have that tells the
          difference between a process and the same process run backward.

          Look at what would have to happen underneath. Energy is currently shared between the
          two blocks in the overwhelming majority of the ways it could be arranged. Piling most
          of it back into one block means landing in one of a vanishingly small number of
          arrangements, and nothing steers the particles toward those. Nobody has forbidden any
          individual collision, they are all perfectly legal in both directions. The forward
          direction is simply where almost all of the possibilities lie.

          The choice that reaches for conservation of energy is the most common answer to this
          question and it is the one to get straight. Energy conservation is silent here,
          because both states hold the same energy. Reaching for it is a habit worth noticing,
          since the first law answered most of the questions in the previous topic and it
          cannot answer this one.

          Calling the original process reversible undoes the whole idea. A reversible process
          is one that can be run backward with no other change left behind anywhere, and energy
          spreading from hot to cold is the standard example of a process that cannot. That is
          exactly why its entropy went up.

          To be honest about the fine print, since a sharp student will ask: the statistics do
          not forbid a fluctuation outright, they make a measurable one so unlikely that you
          could wait far longer than the age of the universe and never see it. For any pair of
          objects you could hold, treating it as impossible is the right call.
        on_correct: |
          Correct. Noticing that energy conservation has nothing to say here is what makes the
          second law feel necessary rather than decorative.
        on_incorrect: |
          Add up the energy in the two blocks before and after the change the student is
          describing. Does the first law object to it, and if it does not, which of the laws you
          have met in this unit is the one that does?
