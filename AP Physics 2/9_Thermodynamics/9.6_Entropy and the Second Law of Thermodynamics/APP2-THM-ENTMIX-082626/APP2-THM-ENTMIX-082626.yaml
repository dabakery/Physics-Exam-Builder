bank_info:
    title: Comparing Initial and Final Entropy When Substances Are Mixed
    bank_id: APP2-THM-ENTMIX-082626
    description: |-
      Isomorphic reasoning problems for AP Physics 2, College Board Unit 9 Topic 9.6.

      Two things that were kept apart are allowed to come together, and you are asked how
      the entropy at the end compares with the entropy at the start. Sometimes what is
      spreading is energy, sometimes it is the substance itself, and in one of these nothing
      spreads at all. Every choice pairs an answer with a reason, so an answer that is right
      for the wrong reason is still wrong. Work out what is actually different about the
      final state before you decide, because in one of these questions the answer is that
      nothing is.

      Teaching notes: the target idea is that mixing raises entropy whenever it leaves the
      system in a state that could not be undone by putting the barrier back, and that this
      covers the spreading of energy and the spreading of the substance separately. The
      common errors are reading a uniform final state as a more orderly one, treating a
      sealed insulated container as one whose entropy cannot change, assuming that no energy
      transfer means no entropy change, expecting the maximum to arrive at the moment the
      temperature difference is largest, and stopping at a partial equilibrium while one part
      of the system is still out of step with the rest. The pair to teach together is q3 and
      q4, identical apparatus with the same gas and then with two different gases, where
      putting the barrier back undoes the first and cannot undo the second.
      APP2-THM-ENTSYS-082626 establishes where the system boundary goes, and
      APP2-THM-ENTPHS-082626 establishes that a constant temperature does not mean a
      constant entropy, which several questions here rely on.
    date created: 08-26-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-ENT-9 # Compare the entropy of a system before and after two substances are brought together and allowed to mix
        - THM-ENT-10 # Identify the state of maximum entropy as the one in which every part of the system shares one temperature and one composition
        - THM-ENT-11 # Recognize that spreading a substance through a larger volume raises entropy even when no energy is transferred and the temperature never changes
        - THM-ENT-12 # Distinguish the entropy of a chosen part of a system from the entropy of the whole, including cases where the two move in opposite directions
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted from the owner's outline: a bike tire left outside overnight, brought
            into a warm house, and then pumped up with warm air while the tire itself is
            still cold. The student picks the moment at which the entropy of the tire, the
            air in it and the room reaches its maximum. The correct choice is the final state
            in which all three sit at one temperature. The distractors put the maximum at the
            instant the temperature differences are largest, stop at the partial equilibrium
            between the air and the tire while the room is still warmer, and deny that a
            maximum exists at all on the grounds that entropy increases forever.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution rather
            than the nouns: q2 is the owner's riff on APP2-THM-ENTSYS-082626 q2, with two
            different gases at different temperatures either side of an insulating barrier
            that is then removed; q3 puts the same gas at the same temperature and pressure
            on both sides, so the answer becomes no change and the barrier could be replaced
            with nothing altered; q4 keeps the equal temperatures but makes the two gases
            different, so the entropy rises with no energy transferred anywhere; q5 removes
            temperature from the problem completely with a drop of dye spreading through
            water; q6 leaves the container open, so the entropy of the liquid rises while it
            mixes and then falls while it cools to room temperature; q7 compares two mixings
            that end in identical final states, so the whole difference sits in the initial
            entropy rather than the final one.)
        - prompt 3: |
            (Figures for q2, q3 and q4 generated by Scripts/make_figures.py, in the
            Before/After panel style of APP2-THM-ENTSYS-082626 q-2. All three come out of
            one function with the same container and the same sixty particles, because q3
            and q4 are the same apparatus with only the identity of the gases changed. The
            species are told apart by glyph rather than by colour, and after mixing each gas
            is drawn spread over the whole container at half its original number density, so
            the total density is unchanged. q3 is drawn so the two panels differ only in
            whether the barrier is present, which is the point of the question.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-26-2026) Bank created with q1-q7. Third bank in Topic 9.6.
        - update 2: (08-26-2026) Added figures for q2, q3 and q4, and Scripts/make_figures.py that generates them. The three share one drawing function so the q3 and q4 apparatus cannot drift apart.
        - update 3: (09-04-2026) Balanced the multiple choice option lengths in q3 and q6. No claim changed.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-26-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: A Cold Bike Tire Brought Inside and Pumped Up
    points: 2
    text: |
      A bicycle is left outside overnight, so the tire and the air inside it both end up
      cold. In the morning the bicycle is brought into a warm house. Before the tire has had
      any time to warm up, more air is pumped into it, and the air that goes in is warmer
      than the tire. The bicycle is then left alone in the house. Treat the tire, all of the
      air inside it, and the room as one system that exchanges nothing with the world
      outside.

      At what point does the entropy of that system reach its maximum value?
    answers:
    - answer:
        text: |
          At the moment the warm air is pumped in, because that is when the temperature
          differences within the system are largest.
        correct: false
    - answer:
        text: |
          Once the tire, all of the air inside it, and the room have all reached one
          temperature.
        correct: true
    - answer:
        text: |
          When the air inside the tire has reached the temperature of the tire itself, since
          those two can no longer exchange anything after that.
        correct: false
    - answer:
        text: |
          It never reaches a maximum, because the entropy of a system goes on increasing for
          as long as time keeps passing.
        correct: false
    feedback:
        general: |
          The entropy of the system is at its maximum once everything inside it sits at one
          temperature, with the tire, the air in it and the room all agreeing.

          The reasoning is the same at every stage of this problem, so it is worth stating
          once. Wherever a temperature difference remains inside an isolated system, energy
          will keep moving across it on its own, and every one of those transfers is
          irreversible and raises the entropy. The entropy therefore keeps climbing for as
          long as any temperature difference is left. It stops climbing when there is nothing
          left to even out, and that is the state we call thermal equilibrium.

          The choice that puts the maximum at the moment the warm air goes in has the
          relationship exactly backwards, and it is the most useful one to think through. A
          large temperature difference is not a lot of entropy, it is a lot of entropy still
          waiting to be produced. The instant the warm air arrives is the point in this whole
          story when the system is furthest from equilibrium, so it is the point where the
          entropy is lowest, not highest. If you find that surprising, think about what you
          could still get out of the system at that moment. A large temperature difference
          could run an engine, and a system at one uniform temperature cannot run anything.

          The choice that stops when the air matches the tire is the trap worth slowing down
          for, because it is right about one thing. Once the air inside the tire and the
          rubber are at the same temperature, those two really have nothing more to exchange
          with each other. They are still colder than the room. Energy keeps crossing from
          the room into the tire, and the entropy keeps rising, until the room is included in
          the agreement. A partial equilibrium is not the maximum. Check every part of the
          system you drew a boundary around, not just the two parts you were watching.

          The last choice takes the second law a step further than it goes. The law says the
          entropy of an isolated system never decreases, which allows it to sit still, and
          sitting still is exactly what it does once equilibrium arrives. There is a largest
          value available to a system with a fixed amount of energy in a fixed volume, and
          equilibrium is the state that has it.
        on_correct: |
          Correct, and you kept the room in the picture right to the end. It is easy to stop
          at the first pair of things that agree with each other.
        on_incorrect: |
          The boundary of this system was drawn around three things, not two. Which parts of
          it still differ in temperature at the moment you chose, and what happens for as
          long as any difference is left?

- multiple_choice:
    id: q2
    title: Two Gases at Different Temperatures with the Barrier Removed
    points: 2
    figure: figure_folder/q-2.png
    text: |
      A rigid container with insulated walls is divided down the middle by a thin insulating
      barrier. The left side holds helium at temperature <latex>T_1</latex> and the right
      side holds neon at a different temperature <latex>T_2</latex>. Nothing enters or leaves
      the container. The barrier is removed, and the two gases are left until the contents of
      the container are uniform throughout. The figure shows the container before the
      barrier is removed and after.

      How does the entropy of the contents at the end compare with the entropy at the start?
    answers:
    - answer:
        text: |
          It is greater, because energy spreads out from the hotter gas to the cooler one and
          each gas spreads through the whole container.
        correct: true
    - answer:
        text: |
          It is smaller, because the contents end up uniform throughout instead of separated
          into two distinct regions.
        correct: false
    - answer:
        text: |
          It is the same, because the container is sealed and insulated, so nothing was added
          to the contents and nothing was taken away.
        correct: false
    - answer:
        text: |
          It cannot be determined without knowing which gas started at the higher temperature
          and how much of each gas is present.
        correct: false
    feedback:
        general: |
          The entropy at the end is greater. Two separate things spread out when the barrier
          comes away, and each of them raises the entropy on its own.

          The first is the energy. The two gases start at different temperatures, so once
          they are in contact energy moves from the hotter to the cooler until they agree.
          That transfer is irreversible, and it raises the entropy of the contents.

          The second is the gases themselves. Before the barrier is removed, every helium
          atom is somewhere in the left half and every neon atom is somewhere in the right
          half. Afterwards either kind of atom can be found anywhere in the container. Each
          gas has twice the volume available to it, so the number of arrangements that
          produce what you see goes up by an enormous factor, and the entropy goes up with
          it.

          There is a test you can apply to any mixing question, and it settles this one
          immediately. Ask whether sliding the barrier back in would restore the original
          situation. It would not. You would get a mixture of helium and neon on both sides,
          at one shared temperature, which is not what you started with. A process that
          cannot be undone by reversing the thing you did is irreversible, and irreversible
          processes inside an isolated system raise its entropy.

          Now the other choices, because each is a real line of thinking.

          The choice that calls the uniform state more orderly is reading order the way we
          use the word about a tidy room. Order in this context means constrained, with the
          particles restricted to a small set of arrangements, and the separated state is the
          constrained one. Removing the barrier removes a restriction rather than adding one.

          The choice that holds the entropy fixed because the container is sealed conflates
          entropy with energy. The energy in this container really is fixed, and the entropy
          is not, because entropy has no conservation law. That pairing, constant energy and
          rising entropy, is the whole reason we need a second law in addition to the first.

          The last choice asks for information that would not change the answer. It does not
          matter which gas is hotter, because energy spreading from the hotter to the cooler
          is irreversible whichever side is which. It does not matter how much of each gas is
          present either. Those details would be needed to work out the final temperature and
          the size of the entropy increase, and the question asks only for its direction.
        on_correct: |
          Correct, and there were two separate reasons pulling the same way here. Naming both
          is worth more than naming either one.
        on_incorrect: |
          Picture sliding the barrier back into place at the end. Would the container be back
          in the situation it started in, and what does your answer to that tell you about
          the process?

- multiple_choice:
    id: q3
    title: The Same Gas on Both Sides of the Barrier
    points: 2
    figure: figure_folder/q-3.png
    text: |
      A rigid container with insulated walls is divided down the middle by a thin barrier.
      Both sides hold argon gas, at the same temperature and the same pressure as each other.
      Nothing enters or leaves the container. The barrier is removed. The figure shows the
      container before the barrier is removed and after.

      How does the entropy of the gas after the barrier is removed compare with the entropy
      before?
    answers:
    - answer:
        text: |
          It is greater, because each half of the gas now has the whole
          container available to it instead of only half of it to move in.
        correct: false
    - answer:
        text: |
          It is greater, because removing a barrier is an irreversible act and irreversible
          processes raise entropy.
        correct: false
    - answer:
        text: |
          It is the same, because the gas is in the condition it was in before
          and the barrier could be put back with nothing else altered.
        correct: true
    - answer:
        text: |
          It is smaller, because the gas now fills the container as a single body rather than
          as two separate samples.
        correct: false
    feedback:
        general: |
          The entropy does not change. Nothing about the gas is different after the barrier
          comes out, and that is a harder thing to accept than it sounds.

          Start by asking what you could measure. Before the barrier is removed, the argon
          has the same temperature, the same pressure and the same number of atoms per cubic
          metre on both sides. Afterwards it has the same temperature, the same pressure and
          the same number of atoms per cubic metre everywhere. There is no measurement you
          could make on the contents of that container that would tell you whether the
          barrier is in or out. Nothing spreads, because the gas was already spread evenly.
          Nothing moves on average, because there is no difference of any kind to drive it.

          Apply the same test as before and slide the barrier back in. This time it works
          perfectly. You are returned to two halves of argon at the same temperature and
          pressure, which is exactly where you began, and nothing anywhere else has been
          changed to make it happen. Removing the barrier here is reversible, and a
          reversible process leaves the entropy where it was.

          The first choice is the one to think hardest about, because the reasoning behind it
          is right in a different problem. When two different gases are on the two sides,
          each one really does gain the whole container and the entropy really does rise. It
          fails here because the atoms are all argon and one argon atom is
          indistinguishable from another. Swapping an atom that started on the left with an
          identical atom that started on the right produces the same gas, not a new
          arrangement, so there is nothing extra to count. Compare this question with the two
          different gases at the same temperature, since the apparatus is the same and only
          the labels on the atoms have changed.

          The second choice appeals to irreversibility, which is a good instinct in general
          and is simply not true of this particular act. Sliding the barrier out and sliding
          it back in leaves no trace anywhere, which is precisely what a reversible process
          means.

          The last choice treats one body of gas as tidier than two, which is the same
          reading of order that this whole topic works against. In any case nothing physical
          distinguishes the two descriptions here. The barrier was a line we drew, not a
          property of the argon.
        on_correct: |
          Correct, and this is the hardest question in the set. Noticing that the argon is
          already spread out is what most people walk straight past.
        on_incorrect: |
          Imagine you walked in and found this container without being told whether the
          barrier was in place. What measurement could you make on the gas that would tell
          you the answer?

- multiple_choice:
    id: q4
    title: Two Different Gases Already at the Same Temperature
    points: 2
    figure: figure_folder/q-4.png
    text: |
      A rigid container with insulated walls is divided down the middle by a thin barrier.
      The left side holds helium and the right side holds argon, at the same temperature and
      the same pressure as each other. Nothing enters or leaves the container. The barrier is
      removed, and the two gases are left until the mixture is uniform throughout. The
      figure shows the container before the barrier is removed and after.

      How does the entropy of the contents at the end compare with the entropy at the start?
    answers:
    - answer:
        text: |
          It is the same, because both gases are at the same temperature, so no energy is
          transferred between them at any point.
        correct: false
    - answer:
        text: |
          It is greater, because each gas ends up spread through the whole container instead
          of through half of it.
        correct: true
    - answer:
        text: |
          It is the same, because the container holds the same total number of atoms in the
          same total volume before and after.
        correct: false
    - answer:
        text: |
          It is smaller, because a uniform mixture is a more organized arrangement than two
          gases kept apart.
        correct: false
    feedback:
        general: |
          The entropy at the end is greater, and no energy was transferred anywhere to make
          it happen.

          The temperatures are equal from start to finish, so nothing about the energy
          changes. What changes is where each kind of atom can be found. Before the barrier
          is removed, every helium atom is in the left half and every argon atom is in the
          right half. Afterwards a helium atom could be anywhere in the container, and so
          could an argon atom. Each gas has doubled the volume available to it, and with
          something like <latex>10^{23}</latex> atoms of each, the number of arrangements
          that produce what you see is multiplied by a factor too large to write down
          comfortably. Entropy counts those arrangements, so it goes up.

          Put this question directly beside the one where both sides held argon, because the
          apparatus is identical and the answers are not. There, replacing the barrier
          restored the original situation exactly. Here, replacing the barrier gives you a
          fifty fifty mixture of helium and argon on both sides, which is not what you
          started with and cannot be turned back into it without a great deal of work from
          outside. Separating two mixed gases is genuinely difficult, and that difficulty is
          the entropy increase making itself felt.

          The choice that argues from the equal temperatures is the one this bank keeps
          circling back to. No energy transfer does not mean no entropy change. The same
          lesson turned up in the gas expanding into a vacuum, where the temperature was
          unchanged and the entropy rose, and it turns up again here.

          The choice about the total number of atoms and the total volume is counting the
          right things at the wrong level. The totals are conserved, and entropy is not about
          totals. It is about how many microscopic arrangements are consistent with what you
          observe, and that count went up even though nothing was added or removed.

          The last choice calls the mixture organized. Consider what it would take to
          maintain the separated state and to restore it once it is gone, and it becomes hard
          to argue that the mixture is the arranged one. The separated state is the one
          somebody had to set up.
        on_correct: |
          Correct. No energy moved, no temperature changed, and the entropy still rose, which
          is exactly what makes this pair of questions worth doing together.
        on_incorrect: |
          The equal temperatures rule out one kind of change and not every kind. What is
          different about where a single helium atom could be found, before the barrier came
          out and after?

- multiple_choice:
    id: q5
    title: A Drop of Dye Spreading Through Water
    points: 2
    text: |
      A single drop of dye is released into a tall glass of still water. The dye and the
      water start at the same temperature, and the glass is covered and left undisturbed on a
      bench at that same temperature. Over several hours the dye spreads until the colour is
      the same everywhere in the glass.

      How does the entropy of the water and dye together at the end compare with the entropy
      at the start?
    answers:
    - answer:
        text: |
          It is smaller, because the final state has the same colour everywhere, which is
          more uniform and therefore more orderly.
        correct: false
    - answer:
        text: |
          It is the same, because nothing was heated or cooled and the temperature is the
          same at the end as it was at the start.
        correct: false
    - answer:
        text: |
          It is greater, because a dye molecule can end up anywhere in the glass instead of
          only within the original drop.
        correct: true
    - answer:
        text: |
          It rises while the dye is spreading and then falls again once the colour has
          evened out, so it ends where it began.
        correct: false
    feedback:
        general: |
          The entropy at the end is greater. There is no temperature difference anywhere in
          this problem, which is what makes it a clean look at the other way a system can
          spread out.

          At the start, every dye molecule is inside one small drop. That is a very
          restrictive condition, and only a tiny fraction of the possible arrangements of
          those molecules satisfy it. At the end, each dye molecule could be anywhere in the
          glass, and an enormous number of arrangements produce the uniform colour you see.
          The molecules got there by ordinary random motion, bumping into water molecules and
          wandering, with nothing pushing them outward. They spread because there are
          overwhelmingly more ways to be spread than to be gathered.

          That last sentence is the real content of the second law, and this is the cleanest
          example of it in the topic. Nothing forbids the dye from gathering itself back into
          a drop. Every individual collision would run backwards quite happily. It does not
          happen because the gathered arrangements are such a vanishingly small fraction of
          the total that you could watch the glass for longer than the universe has existed
          and never see it.

          The choice that calls the even colour orderly is the standard trap in this topic
          and is worth a firm answer. The tidy looking state is the spread out one, and the
          arranged state is the one where somebody had to place a drop. Ask which of the two
          you could produce by doing nothing.

          The choice that holds the entropy fixed because nothing was heated makes the
          assumption this bank keeps testing. Energy transfer is one way to change the
          entropy of a system, and it is not the only one. Spreading a substance through a
          larger volume does it too, with no energy transfer required.

          The last choice imagines the entropy peaking partway through and coming back down.
          It only rises. Every stage of the spreading opens up more arrangements than the
          stage before, and the uniform state is the one with the most of all. Nothing in the
          glass ever runs the other way.
        on_correct: |
          Correct, and you did it with no temperature difference anywhere in the problem. The
          substance can spread out just as the energy can.
        on_incorrect: |
          Nothing in this problem is hotter than anything else, so the answer cannot be about
          energy moving. What was true of every dye molecule at the start that is no longer
          true at the end?

- multiple_choice:
    id: q6
    title: Cold Milk Poured Into Hot Coffee in an Open Mug
    points: 2
    text: |
      A mug of hot black coffee sits on a table in a room at <latex>20</latex> °C. Cold milk
      is poured in and stirred, and within a few seconds the drink is uniform and warm. The
      mug is then left on the table for an hour, by which time the drink has cooled to
      <latex>20</latex> °C.

      Which of the following describes the entropy of the liquid in the mug over that hour?
    answers:
    - answer:
        text: |
          It rises while the milk and the coffee come to one temperature, and then falls
          while the drink cools toward room temperature.
        correct: true
    - answer:
        text: |
          It rises throughout, because the entropy of a system is never allowed
          to decrease as time passes.
        correct: false
    - answer:
        text: |
          It falls throughout, because the drink ends up cooler than the coffee
          was at the start, and cooler means less entropy.
        correct: false
    - answer:
        text: |
          It rises while the milk mixes in and then holds steady once the drink
          has become uniform throughout.
        correct: false
    feedback:
        general: |
          The entropy of the liquid rises during the mixing and then falls during the
          cooling. It is one of the few quantities in this unit that does not move in one
          direction the whole way through, and the reason is that the mug is open.

          Take the two stages separately. During the first few seconds the hot coffee and the
          cold milk exchange energy with each other and come to one temperature. That is a
          spontaneous transfer across a temperature difference, so it is irreversible and the
          entropy of the liquid rises, exactly as it did for the two gases either side of the
          barrier.

          Over the following hour the drink is warmer than the room, so energy leaves it
          continuously through the walls of the mug and the open top. Energy leaving at a
          temperature takes entropy with it,
          <latex>
          \Delta S = \frac{Q}{T}
          </latex>
          and the entropy of the liquid falls the whole time it is cooling.

          Nothing about that violates the second law, and this is where the boundary work
          from the earlier bank pays off. The second law sets its floor for an isolated
          system, and a mug of coffee on a table is about as far from isolated as anything in
          this unit. Draw the boundary around the drink and the room together and the total
          rises throughout, during the mixing and during the cooling, because the energy
          leaves the drink at a higher temperature than it arrives in the room at.

          The choice that has the entropy rising throughout applies the second law to the
          wrong system. It is the statement students remember most confidently and quote most
          often in situations it does not cover. Check what the system is before you reach
          for it.

          The choice that has it falling throughout misses the mixing. The milk goes in cold
          and the coffee is hot, and bringing those two to a shared temperature raises the
          entropy of the liquid before any of the cooling matters. It is also worth noticing
          that the final entropy of the liquid could be higher or lower than the coffee had
          on its own at the start, depending on how much milk went in and how hot the coffee
          was, so the ending alone would not settle it.

          The last choice stops the story at the moment the drink looks finished. Uniform is
          not the same as unchanging. The drink is uniform within seconds and is still much
          warmer than the room, so energy keeps leaving it for an hour afterwards.
        on_correct: |
          Correct, and tracking a quantity that goes up and then down is harder than tracking
          one that only climbs. The open mug is what makes the difference.
        on_incorrect: |
          Two quite different things happen to this drink, one in a few seconds and one over
          an hour. What is the mug exchanging with the room during the second of them, and
          which system does the second law actually restrict?

- multiple_choice:
    id: q7
    title: Two Mixings That End in the Same Place
    points: 2
    text: |
      Two insulated cups are prepared. In cup A, <latex>400</latex> g of water at
      <latex>80</latex> °C is poured together with <latex>400</latex> g of water at
      <latex>20</latex> °C. In cup B, <latex>400</latex> g of water at <latex>55</latex> °C
      is poured together with <latex>400</latex> g of water at <latex>45</latex> °C. Both
      cups settle at <latex>50</latex> °C and neither cup exchanges anything with its
      surroundings.

      Which mixing produces the larger increase in entropy?
    answers:
    - answer:
        text: |
          Cup A, because it starts further from equilibrium, so its initial entropy is lower
          while both cups end in the same final state.
        correct: true
    - answer:
        text: |
          They produce the same increase, because both cups end up holding the same mass of
          water at the same final temperature.
        correct: false
    - answer:
        text: |
          Cup B, because its two samples start closer together and reach equilibrium sooner.
        correct: false
    - answer:
        text: |
          Cup A, because it starts with more total energy than cup B does.
        correct: false
    feedback:
        general: |
          Cup A produces much the larger increase, and the reason is worth stating carefully,
          because the two cups agree about more than you might expect.

          Look at the final states first. Cup A ends with <latex>800</latex> g of water at
          <latex>50</latex> °C, and so does cup B. The final states are identical, which
          means the final entropies are identical too. Whatever difference there is between
          these two mixings has to live entirely in where they started.

          Now the starting states. Cup A begins with its energy piled up on one side, a hot
          <latex>80</latex> °C sample beside a cold <latex>20</latex> °C one. That is a
          strongly constrained arrangement of the energy and a low entropy one. Cup B begins
          with almost the same energy in both halves, which is already close to the way it
          will end up, so its initial entropy is only a little below the final value. Both
          cups climb to the same ceiling, and cup A starts from much further down. If you
          carry the calculation out, cup A gains about <latex>15</latex> J/K and cup B only
          about <latex>0.4</latex> J/K.

          There is a general lesson here that goes beyond this question. The entropy produced
          by letting something equalize depends on how far out of balance it was to begin
          with. It is also why cup A could have done something useful on the way and cup B
          essentially could not. A large temperature difference can drive an engine, and a
          <latex>10</latex> °C difference has very little to offer.

          The choice that calls them equal notices the identical final states and stops one
          step short. Both cups do end in the same place. The question asks for a change,
          which needs the start as well as the end.

          The choice that favours cup B is answering a different question. How quickly a
          system reaches equilibrium is a matter of stirring, of surface area and of how the
          water moves, and none of it enters the entropy change. Entropy compares the initial
          and final states and does not care how long the trip took.

          The last choice reaches the right cup with a claim you can check and disprove. Add
          the energies up. Cup A holds <latex>400</latex> g at <latex>80</latex> °C plus
          <latex>400</latex> g at <latex>20</latex> °C, and cup B holds <latex>400</latex> g
          at <latex>55</latex> °C plus <latex>400</latex> g at <latex>45</latex> °C. Both
          come to the same total, which is why both settle at the same final temperature. The
          cups hold identical energy and very different entropy, and keeping those two apart
          is what this whole topic asks of you.
        on_correct: |
          Correct, and you found the difference in the starting states rather than the ending
          ones. Same energy, same final state, and a very different entropy change.
        on_incorrect: |
          Do these two cups actually end up in different conditions, or in the same one?
          If they finish identically, where is the only place a difference between them
          could still be hiding?
