bank_info:
    title: Comparing Isothermal and Adiabatic Processes
    bank_id: APP2-THM-ISOAD-081826
    description: |-
      Isomorphic reasoning problems for AP Physics 2, College Board Unit 9 Topic 9.4.

      Two processes are drawn on the same pressure volume diagram, starting from the
      same state, and you are asked which one changes a given quantity more and why.
      Every choice pairs a claim with a justification, so a claim that is right for the
      wrong reason is still wrong. There is no arithmetic to do. What settles these is
      the first law together with which curve lies above the other.

      Teaching notes: the target idea is that an isothermal process has no change in
      internal energy while an adiabatic process transfers no energy by heating, and
      that these are two different statements about two different terms in the first
      law. The common errors are reading no heating as no change in internal energy,
      reading a temperature drop as evidence of energy leaving by heating, deciding the
      work comparison from the steepness of a curve rather than from the area beneath
      it, and treating two processes that share a final volume as though they must share
      an internal energy change. APP2-THM-FLPV-081826 does the same first law accounting
      with numbers on straight line paths, and is the bank to send a student back to if
      the sign conventions are what is going wrong.
    date created: 08-18-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-FLT-1 # Apply the first law of thermodynamics to relate energy transferred by heating, work done, and change in internal energy
        - THM-FLT-2 # Find the work done during a process from the area under a pressure volume diagram, including its sign
        - THM-FLT-4 # Distinguish isothermal from adiabatic processes on a pressure volume diagram and apply the first law to each
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted as a worked reference example from the owner's outline: a
            pressure volume diagram showing an isothermal expansion and an adiabatic
            expansion from the same starting state out to the same final volume, with
            the student asked which produces the greater change in internal energy and
            which justification is the correct one. Answers are claim and justification
            pairs, so one distractor carries the right claim with a reason that does not
            support it. The key distractor is the reading of an adiabatic process as one
            in which nothing can change the internal energy because no energy is
            transferred by heating.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution
            rather than the nouns: q2 asks the same pair which does more work, answered
            by which curve lies above the other rather than by the first law; q3 mirrors
            q1 into a pair of compressions, so every sign turns around and the adiabatic
            gas heats up; q4 replaces the pair with two paths between the same two
            states, so the correct answer is that neither is greater and both are zero,
            which is the state function question; q5 asks the q1 pair which transfers
            more energy by heating, with the trap being that the adiabatic gas gets
            colder without transferring any; q6 swaps the isotherm for an isobar so
            neither process has a zero to lean on and the comparison has to be bounded,
            with the adiabatic work bounded by the isobaric work; q7 drops the second
            process and asks directly what the work does to an insulated gas, which is
            the statement the whole bank rests on.)
        - figure prompt: |
            (Every question in this bank takes a pressure volume diagram generated by
            Scripts/make_figures.py. Curves are drawn here rather than the straight
            segments used in APP2-THM-FLPV-081826, because no question in this bank asks
            for the value of an area, only for which curve lies above the other.
            Isotherms are PV constant and adiabats are PV^(5/3) constant, the monatomic
            value. The curves carry no names. Telling one from the other by its shape is
            expected knowledge at this level, and every stem says in words which process
            is which.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-18-2026) Bank created with q1. Second bank in Topic 9.4.
        - update 2: (08-18-2026) Added isomorphs q2-q7 (work comparison, mirrored pair of compressions, two paths between the same states, heating comparison, isobaric against adiabatic, the adiabatic first law on its own).
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-18-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Which Expansion Changes the Internal Energy More
    points: 3
    text: |
      The figure shows two processes for a fixed amount of monatomic ideal gas, both
      starting from state A at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>. In the first, the gas is held in contact with a reservoir that
      keeps its temperature constant while it expands to state B at
      <latex>3V_0</latex>. In the second, the gas is thermally insulated, so no energy
      is transferred to or from it by heating, while it expands to state C at
      <latex>3V_0</latex>.

      Which process produces the greater change in the internal energy of the gas, in
      magnitude, and what is the correct justification?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          The isothermal expansion, because energy is transferred into the gas by heating
          throughout it, while no energy at all is transferred during the adiabatic
          expansion.
        correct: false
    - answer:
        text: |
          The adiabatic expansion, because the gas does work on its surroundings with no
          energy transferred in by heating to replace it, so its internal energy has to
          fall, while the isothermal expansion has no change in internal energy at all.
        correct: true
    - answer:
        text: |
          The adiabatic expansion, because the adiabatic curve is steeper, so the gas
          does more work along it than along the isothermal curve.
        correct: false
    - answer:
        text: |
          Neither, because both processes start at the same state and end at the same
          volume.
        correct: false
    feedback:
        general: |
          Take the two processes one at a time and ask what each name actually tells you.

          Isothermal means the temperature does not change. The internal energy of an
          ideal gas is set by its temperature, so
          <latex>
          \Delta U = 0
          </latex>
          for the expansion from A to B. Not small, exactly zero. The gas does work on
          its surroundings the whole way, and energy is transferred in by heating at
          exactly the rate needed to replace it, which is what holding the temperature
          steady requires.

          Adiabatic means no energy is transferred by heating, so
          <latex>
          Q = 0
          </latex>
          for the expansion from A to C. The gas still expands, so it still does work on
          its surroundings, and now there is nothing coming in to replace what it spends.
          The first law leaves only one place for that energy to come from:
          <latex>
          \Delta U = -W_{by}
          </latex>
          The internal energy falls, the gas cools, and the change is not zero. So the
          adiabatic process is the one with the greater change in magnitude, and it wins
          by default, because its rival has no change at all.

          The figure agrees. State C sits below state B, so the product of pressure and
          volume is smaller at C than at B, and for an ideal gas that product is
          proportional to the absolute temperature. B is at the same temperature as A by
          construction, and C is colder than both.

          Now the reasons that fail. The first choice contains a true statement, that
          energy is transferred into the gas by heating during the isothermal expansion,
          and then draws the wrong conclusion from it. Energy going in does not mean the
          internal energy rises. It goes straight back out again as work, which is
          exactly why the temperature holds still.

          The third choice picks the right process for a reason that is not true. The
          adiabatic curve falls away more steeply, and that means the pressure drops
          faster as the gas expands, so the area under it is smaller and the gas does
          less work along it, not more. Being steeper here means doing less.

          The last choice would be correct if the question asked about a quantity that
          depends only on the endpoints, and it does not follow from a shared final
          volume. B and C have the same volume and different pressures, so they are not
          the same state and their temperatures are not the same.
        on_correct: |
          Correct. Isothermal and adiabatic name two different terms in the first law,
          and knowing which term each one sets to zero is what this whole topic runs on.
        on_incorrect: |
          Each of these two words tells you that one quantity in the first law is zero,
          and they are not the same quantity. Which one does each process pin down, and
          what does that leave free to change?

- multiple_choice:
    id: q2
    title: Which Expansion Does More Work on the Surroundings
    points: 3
    text: |
      The figure shows two processes for a fixed amount of monatomic ideal gas, both
      starting from state A at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>. In the first, the gas is held at a constant temperature while
      it expands to state B at <latex>3V_0</latex>. In the second, the gas is thermally
      insulated while it expands to state C at <latex>3V_0</latex>.

      Which process does more work on the surroundings, and what is the correct
      justification?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          The isothermal expansion, because its curve lies above the adiabatic curve the
          whole way, so the area beneath it is greater.
        correct: true
    - answer:
        text: |
          The adiabatic expansion, because no energy leaves the gas by heating, so more
          of its energy is available to be spent as work.
        correct: false
    - answer:
        text: |
          The adiabatic expansion, because its curve is steeper, so the gas pushes
          through a larger pressure change while it expands.
        correct: false
    - answer:
        text: |
          They do the same amount of work, because both expand from <latex>V_0</latex> to
          <latex>3V_0</latex>.
        correct: false
    feedback:
        general: |
          The work a gas does on its surroundings is the area under its path on a
          pressure volume diagram. Both processes sweep the same range of volumes, from
          <latex>V_0</latex> out to <latex>3V_0</latex>, so the comparison comes down to
          which curve is higher over that range. The isotherm is above the adiabat
          everywhere except at A, where they meet, so the isothermal expansion does more
          work.

          It is worth knowing why the adiabat drops away faster, because that is the
          physical content behind the picture. In the isothermal expansion, energy flows
          in by heating as fast as the gas spends it, so the gas stays at its original
          temperature and keeps pushing hard. In the adiabatic expansion nothing flows
          in, the gas pays for its own expansion out of its internal energy, and it cools
          as it goes. A cooler gas at a given volume exerts less pressure, so the
          adiabatic curve falls below the isothermal one and keeps falling further behind.

          The second choice sounds like conservation of energy and is worth taking
          seriously before rejecting it. Nothing leaves the adiabatic gas by heating,
          which is true, and the problem is that nothing enters it either. The isothermal
          gas is not spending a fixed supply, it is being resupplied continuously, so it
          can do more work than an insulated gas can.

          The third choice reads the steepness the wrong way round. Steeper here means
          the pressure collapses faster during the expansion, so less area is left under
          the curve.

          The last choice is the one to watch for, because equal volume changes really do
          feel like they should mean equal work. Work is a pressure times a volume
          change, so how hard the gas is pushing while it expands matters as much as how
          far it expands. Two processes covering the same volume range at different
          pressures do different amounts of work.
        on_correct: |
          Correct, and you read it off the areas rather than off the slopes, which is the
          habit that keeps this kind of comparison from going wrong.
        on_incorrect: |
          Both processes cover the same range of volumes, so that is not what separates
          them. What does the work correspond to on this diagram, and which curve has
          more of it?

- multiple_choice:
    id: q3
    title: Which Compression Changes the Internal Energy More
    points: 3
    text: |
      The figure shows two processes for a fixed amount of monatomic ideal gas, both
      starting from state A at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>. In the first, the gas is held at a constant temperature while
      it is compressed to state B at <latex>V_0</latex>. In the second, the gas is
      thermally insulated while it is compressed to state C at <latex>V_0</latex>.

      Which process produces the greater change in the internal energy of the gas, in
      magnitude, and what is the correct justification?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          The isothermal compression, because the gas has to be cooled continuously to
          hold its temperature down, and all of that energy leaving means a large drop in
          internal energy.
        correct: false
    - answer:
        text: |
          The adiabatic compression, because the surroundings do work on the gas and none
          of that energy can leave by heating, so the internal energy rises, while the
          isothermal compression has no change in internal energy at all.
        correct: true
    - answer:
        text: |
          The adiabatic compression, because it ends at a much higher pressure, and the
          internal energy of a gas is set by its pressure.
        correct: false
    - answer:
        text: |
          Neither, because both processes start at the same state and end at the same
          volume.
        correct: false
    feedback:
        general: |
          The reasoning is the same as for the pair of expansions, and every sign is
          turned around, so this is a good place to check that you are reasoning rather
          than remembering an answer.

          The isothermal compression ends at the temperature it started at, so
          <latex>
          \Delta U = 0
          </latex>
          again. Work is done on the gas the whole way, and an equal amount of energy is
          transferred out of it by heating, which is what keeps the temperature from
          rising.

          The adiabatic compression has <latex>Q = 0</latex>, so the work the surroundings
          do on the gas has nowhere to go except into the internal energy:
          <latex>
          \Delta U = W_{on}
          </latex>
          The gas heats up. The figure shows it, since state C sits far above state B at
          the same volume, and a larger product of pressure and volume means a higher
          temperature.

          The first choice is the same trap as before, wearing different clothes. Energy
          really is transferred out of the isothermally compressed gas by heating, and
          that does not lower its internal energy, because an equal amount is being
          pushed in as work at the same time. Energy passing through a system is not the
          same as energy accumulating in it.

          The third choice picks the right process and justifies it with a rule that is
          not true. The internal energy of an ideal gas is set by its temperature, and
          for a monatomic gas it is three halves of the product of pressure and volume,
          not of the pressure alone. A gas can be at a very high pressure in a very small
          volume and be no hotter than it was.

          This is not a laboratory curiosity. A bicycle pump gets hot near the nozzle
          when you pump quickly, because a fast compression leaves no time for energy to
          leak out through the walls, which makes it nearly adiabatic. Pump slowly and
          the barrel stays cool, because that is closer to the isothermal case.
        on_correct: |
          Correct. Every sign flipped from the expansion version of this question and the
          reasoning did not have to change at all.
        on_incorrect: |
          Work is being done on the gas in both of these. In which one does that energy
          stay in the gas, and what tells you where it goes in the other?

- multiple_choice:
    id: q4
    title: Two Paths Between the Same Two States
    points: 3
    text: |
      The figure shows two ways of taking a fixed amount of monatomic ideal gas from
      state A, at pressure <latex>3P_0</latex> and volume <latex>V_0</latex>, to state B,
      at pressure <latex>P_0</latex> and volume <latex>3V_0</latex>. Along the first the
      gas is held at a constant temperature. Along the second the gas expands at the
      constant pressure <latex>3P_0</latex> to state D at <latex>3V_0</latex>, and is
      then cooled at constant volume until its pressure falls to <latex>P_0</latex> at
      state B.

      Which path produces the greater change in the internal energy of the gas, in
      magnitude, and what is the correct justification?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          The two step path, because the gas does more work along it.
        correct: false
    - answer:
        text: |
          The two step path, because the gas is heated at constant pressure on the way,
          so it reaches a much higher temperature.
        correct: false
    - answer:
        text: |
          Neither, because the internal energy of a gas depends only on the state it is
          in, and both paths run from state A to state B.
        correct: true
    - answer:
        text: |
          The isothermal path, because energy is transferred into the gas by heating
          along the whole of it.
        correct: false
    feedback:
        general: |
          Check the two endpoints before looking at anything else. At state A the product
          of pressure and volume is
          <latex>
          (3P_0)(V_0) = 3 P_0 V_0
          </latex>
          and at state B it is
          <latex>
          (P_0)(3V_0) = 3 P_0 V_0
          </latex>
          The same product means the same temperature, so A and B are at the same
          temperature and the internal energy is the same at both. Every path from A to B
          therefore has
          <latex>
          \Delta U = 0
          </latex>
          including these two. Neither is greater, and both are zero.

          Internal energy is a property of the state the gas is in. Once you know the
          pressure and the volume you know the temperature, and once you know the
          temperature you know the internal energy, whatever the gas did to get there.
          Quantities like this are worth spotting quickly, because they turn a hard
          question into a two line one.

          The first two choices are true statements that answer a different question. The
          gas really does do more work along the two step path, since the whole of its
          expansion happens at the higher pressure <latex>3P_0</latex> and the area under
          that path is larger than the area under the isotherm. It really does reach a
          higher temperature along the way, at state D, where the product of pressure and
          volume is
          <latex>
          (3P_0)(3V_0) = 9 P_0 V_0
          </latex>
          three times its value at A. Neither statement changes where the gas ends up.
          The temperature climbs at constant pressure and then falls back at constant
          volume, arriving at exactly the temperature the isothermal path never left.

          The last choice describes the isothermal path correctly and then draws the same
          wrong conclusion this bank keeps returning to. Energy transferred in by heating
          is not a change in internal energy. Along the isotherm every bit of it leaves
          again as work.

          The work and the heating are different along the two paths, and only the change
          in internal energy is forced to match. That is the distinction between a
          quantity that describes a state and a quantity that describes a journey.
        on_correct: |
          Correct, and you got there by comparing the endpoints rather than by following
          either path. That is the fastest route through any question about internal
          energy.
        on_incorrect: |
          Work out the product of pressure and volume at state A and at state B. What
          does comparing those two numbers tell you, and does anything that happens in
          between change it?

- multiple_choice:
    id: q5
    title: Which Expansion Transfers More Energy by Heating
    points: 3
    text: |
      The figure shows two processes for a fixed amount of monatomic ideal gas, both
      starting from state A at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>. In the first, the gas is held at a constant temperature while
      it expands to state B at <latex>3V_0</latex>. In the second, the gas is thermally
      insulated while it expands to state C at <latex>3V_0</latex>.

      Which process transfers more energy by heating, in magnitude, and what is the
      correct justification?
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          The adiabatic expansion, because the gas ends up colder, and a gas can only get
          colder by transferring energy out of itself by heating.
        correct: false
    - answer:
        text: |
          The isothermal expansion, because no energy at all is transferred by heating
          during an adiabatic process, while the isothermal gas must be supplied with as
          much energy as it spends doing work.
        correct: true
    - answer:
        text: |
          The isothermal expansion, because its constant temperature means the gas holds
          on to all of the energy transferred into it.
        correct: false
    - answer:
        text: |
          They transfer the same amount, because the same total energy is involved in
          both, only in different forms.
        correct: false
    feedback:
        general: |
          One of these two processes has no energy transferred by heating at all. That is
          what adiabatic means, so
          <latex>
          Q = 0
          </latex>
          from A to C, and any process with a nonzero transfer beats it. The isothermal
          expansion is such a process. Its internal energy does not change, so the first
          law reads
          <latex>
          Q = \Delta U + W_{by} = 0 + W_{by}
          </latex>
          and the energy transferred in by heating is exactly equal to the work the gas
          does on its surroundings, which is not zero, since the gas expands to three
          times its volume.

          The first choice is the most valuable mistake in this bank, so it is worth
          being clear about. The adiabatic gas does end up colder, and it gets there
          without transferring any energy by heating whatsoever. It cools because it
          spends its own internal energy doing work on its surroundings. Cooling and
          heat transfer are not the same thing. Heat is energy moving because of a
          temperature difference, and a gas can lose internal energy without any of it
          leaving that way.

          You have seen this outside a Physics classroom. Spray a can of compressed air
          for a few seconds and the can turns cold in your hand. Nothing has taken energy
          out of it by heating, and it is cold because the gas inside expanded and paid
          for that expansion out of its own internal energy.

          The third choice reaches the right process by describing the isothermal
          expansion backwards. The gas does not hold on to the energy transferred into
          it. It passes every bit of it straight back out as work, which is precisely why
          the temperature does not move.

          The last choice is appealing and is not true. The two processes do different
          amounts of work and end at different temperatures, so there is no shared total
          being divided up between them differently.
        on_correct: |
          Correct. Keeping cooling and heat transfer apart is the whole of this question,
          and most of this topic.
        on_incorrect: |
          One of these two processes is defined by having no energy transferred by
          heating. Which one, and does that stop the gas in it from getting colder?

- multiple_choice:
    id: q6
    title: An Expansion at Constant Pressure Against an Insulated One
    points: 3
    text: |
      The figure shows two processes for a fixed amount of monatomic ideal gas, both
      starting from state A at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>. In the first, the gas expands at the constant pressure
      <latex>3P_0</latex> to state B at <latex>3V_0</latex>. In the second, the gas is
      thermally insulated while it expands to state C at <latex>3V_0</latex>.

      Which process produces the greater change in the internal energy of the gas, in
      magnitude, and what is the correct justification?
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          The adiabatic expansion, because it is the only one of the two in which no
          energy is transferred by heating, so nothing hides the change in internal
          energy.
        correct: false
    - answer:
        text: |
          The isobaric expansion, because the gas is heated as it expands, so its
          temperature rises, while the adiabatic gas only loses the energy it spends as
          work, and it spends less of it.
        correct: true
    - answer:
        text: |
          The isobaric expansion, because the gas does more work along it, and the change
          in internal energy is equal to the work done.
        correct: false
    - answer:
        text: |
          Neither, because both processes start at state A and expand to the same final
          volume.
        correct: false
    feedback:
        general: |
          Neither of these processes has a zero anywhere convenient, so both changes have
          to be sized up.

          The isobaric expansion is the easy one, since the pressure holds at
          <latex>3P_0</latex> while the volume triples, so the product of pressure and
          volume triples too:
          <latex>
          \Delta U = \frac{3}{2}(9 P_0 V_0 - 3 P_0 V_0) = 9 P_0 V_0
          </latex>
          The temperature triples, and it takes a lot of heating to do that while the gas
          is also pushing its surroundings back.

          For the adiabatic expansion, <latex>Q = 0</latex>, so the internal energy falls
          by exactly the work the gas does:
          <latex>
          |\Delta U| = W_{by}
          </latex>
          and you can bound that without computing it. The adiabatic curve lies below the
          constant pressure line the whole way, so the adiabatic gas does less work than
          the isobaric gas does. Call the isobaric work
          <latex>
          W_{iso} = 3P_0(3V_0 - V_0) = 6 P_0 V_0
          </latex>
          Then the adiabatic change in internal energy is smaller than
          <latex>6 P_0 V_0</latex>, while the isobaric change is
          <latex>9 P_0 V_0</latex>. The isobaric process wins, and the figure agrees:
          state C sits a little below half of <latex>P_0</latex>, so its product of
          pressure and volume is well under half the value at A, while state B is at
          three times that value.

          The first choice mistakes a clean measurement for a large one. It is true that
          the adiabatic change in internal energy is easy to identify, since it is the
          whole story of that process, and being easy to identify does not make it big.

          The third choice picks the right process with a rule borrowed from the wrong
          one. The change in internal energy equals the work only when no energy is
          transferred by heating, which is the adiabatic case, not the isobaric one. In
          the isobaric expansion the gas gains
          <latex>15 P_0 V_0</latex> by heating, spends <latex>6 P_0 V_0</latex> of it as
          work, and keeps the remaining <latex>9 P_0 V_0</latex> as internal energy.

          The last choice repeats the assumption that a shared final volume means a
          shared final state. B and C sit at the same volume and at very different
          pressures, so they are very different temperatures.
        on_correct: |
          Correct, and you sized the adiabatic change by bounding it rather than
          computing it. That is usually all an AP question needs from you.
        on_incorrect: |
          There is no zero to lean on in this pair, so both changes have to be compared
          on size. What can you say about the internal energy change of an insulated gas,
          and how does the work it does compare with the work done at constant pressure?

- multiple_choice:
    id: q7
    title: What the Work Does to an Insulated Gas
    points: 3
    text: |
      The figure shows a fixed amount of monatomic ideal gas expanding from state A, at
      pressure <latex>3P_0</latex> and volume <latex>V_0</latex>, to state B at
      <latex>3V_0</latex>. The gas is thermally insulated throughout, so no energy is
      transferred to or from it by heating.

      Which of the following correctly relates the work the gas does on its surroundings
      to the change in its internal energy?
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          The internal energy does not change, because no energy is transferred by
          heating.
        correct: false
    - answer:
        text: |
          The internal energy falls by exactly the amount of work the gas does on its
          surroundings, because there is no other supply of energy available to it.
        correct: true
    - answer:
        text: |
          The internal energy falls by less than the work the gas does, because part of
          what it spends is replaced by heating.
        correct: false
    - answer:
        text: |
          The internal energy rises by the amount of work the gas does, because the work
          the gas does on the surroundings comes back to it.
        correct: false
    feedback:
        general: |
          Write the first law down and put the zero where it belongs:
          <latex>
          Q = \Delta U + W_{by}
          \quad \Rightarrow \quad
          0 = \Delta U + W_{by}
          \quad \Rightarrow \quad
          \Delta U = -W_{by}
          </latex>
          The gas expands, so <latex>W_{by}</latex> is positive, and the internal energy
          falls by exactly that amount. Every joule the gas spends pushing its
          surroundings back comes out of its own internal energy, because an insulated
          gas has nowhere else to get it from. The gas cools, which is why state B sits so
          much lower on the diagram than an isothermal expansion would have left it.

          The first choice puts the zero in the wrong place. Adiabatic sets
          <latex>Q = 0</latex>, not <latex>\Delta U = 0</latex>. Setting the change in
          internal energy to zero is what isothermal does, and the two words describe
          different terms in the same equation. If you can only remember one thing from
          this bank, make it that.

          The third choice contradicts the setup. Insulated means no energy is
          transferred by heating at any point, so there is nothing to replace what the
          gas spends.

          The fourth choice has energy going in a circle. Work done by the gas on its
          surroundings is energy that has left the gas, whether it went into lifting a
          piston, pushing the atmosphere back, or turning something. It does not return.

          This is the process behind a great deal of weather. A parcel of air pushed
          upward moves into thinner surroundings and expands, and it does so quickly
          enough that very little energy passes into it from the air around it, so the
          expansion is close to adiabatic and the parcel cools. That cooling is what
          brings the air to the temperature at which its water vapour condenses, which is
          why clouds have flat bottoms at a height rather than starting at the ground.
        on_correct: |
          Correct. With no heating available, the work the gas does and the internal
          energy it loses are the same quantity counted twice.
        on_incorrect: |
          The word insulated tells you one term in the first law is zero. Write the law
          out with that term removed and see what the equation says about the other two.
