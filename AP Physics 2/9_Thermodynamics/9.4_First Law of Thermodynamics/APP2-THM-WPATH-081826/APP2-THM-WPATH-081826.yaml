bank_info:
    title: Comparing the Work Done Along Different Paths
    bank_id: APP2-THM-WPATH-081826
    description: |-
      Isomorphic reasoning problems for AP Physics 2, College Board Unit 9 Topic 9.4.

      Two or three processes are drawn on separate pressure volume diagrams, and every
      one of them starts at the same state and ends at the same state. Only the path
      between them is different. You are asked to compare or rank the work, which means
      comparing areas rather than endpoints. Watch for the choices that offer you
      equality on the grounds that the states match, because that is true of a different
      quantity than the one being asked about.

      Teaching notes: the target idea is that work is path dependent while the change in
      internal energy is not, so two processes between the same pair of states can move
      very different amounts of energy. States A and B in every question are chosen with
      the same product of pressure and volume, so the internal energy change is zero for
      every path and the heating question in this bank tracks the work exactly. The
      common errors are ranking by pressure change rather than by area, treating a path
      of the same volume range as the same work, forgetting that a constant volume leg
      contributes no area at all, and carrying the path independence of internal energy
      over to work and heating. APP2-THM-FLPV-081826 sets up the area and first law
      accounting these questions assume.
    date created: 08-18-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-FLT-1 # Apply the first law of thermodynamics to relate energy transferred by heating, work done, and change in internal energy
        - THM-FLT-2 # Find the work done during a process from the area under a pressure volume diagram, including its sign
        - THM-FLT-5 # Recognize work and energy transferred by heating as path dependent while the change in internal energy is not
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted as a worked reference example from the owner's outline: two
            pressure volume diagrams side by side showing the same gas taken from the
            same initial state to the same final state by different processes, with the
            student comparing the work. Process 1 is an isothermal compression and
            Process 2 is a constant pressure compression followed by a constant volume
            rise. Answers pair a comparison with a justification, and two of the
            distractors offer equality, one on the grounds that the endpoints match and
            one on the grounds that the volume change matches.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution
            rather than the nouns: q2 puts the two cornered paths against each other so
            the answer is an exact ratio of three with no curve involved; q3 runs the
            comparison as expansions and pits a straight line against the isotherm it
            lies above, with path length offered as a distractor; q4 ranks three paths
            worth 2, 4 and 6 P_0 V_0; q5 ranks three where a staircase and a straight
            line tie at 4, so the ranking contains an equality; q6 keeps q1's pair and
            asks about heating instead, which tracks the work exactly because the two
            states share a temperature, with a distractor whose premise about the
            constant volume leg is correct; q7 closes the two paths of q2 into a cycle,
            so the net work is the enclosed area and equals the amount by which the two
            paths differed.)
        - figure prompt: |
            (Every question in this bank takes a figure generated by
            Scripts/make_figures.py, with one panel per process on identical axes and
            the same two states drawn in the same place, so nothing varies between
            panels except the path. Comparison questions title their panels Process 1
            and Process 2; ranking questions use I, II and III, because the exam
            renderer letters the answer options itself. Corner dots mark the joints of a
            multi-leg path. The processes are not named on the figure.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-18-2026) Bank created with q1. Third bank in Topic 9.4.
        - update 2: (08-18-2026) Added isomorphs q2-q7 (two cornered paths, straight line against an isotherm, three way ranking, ranking with a tie, heating along two paths, the two paths closed into a cycle).
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-18-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: A Curved Compression Against a Cornered One
    points: 3
    text: |
      The figure shows two processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>.

      In Process 1 the gas is held at a constant temperature throughout the compression.
      In Process 2 the gas is first compressed at the constant pressure
      <latex>P_0</latex> until its volume reaches <latex>V_0</latex>, and its pressure is
      then raised to <latex>3P_0</latex> while the volume is held fixed.

      How does the work done on the gas in Process 1 compare with the work done on the
      gas in Process 2?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          More work is done on the gas in Process 1, because its curve lies above the
          constant pressure leg of Process 2 across the whole range of volumes, so the
          area beneath it is greater.
        correct: true
    - answer:
        text: |
          More work is done on the gas in Process 2, because the gas reaches a pressure
          of <latex>3P_0</latex> along it, and a higher pressure means more work.
        correct: false
    - answer:
        text: |
          The same work is done in both, because both processes start at state A and end
          at state B.
        correct: false
    - answer:
        text: |
          The same work is done in both, because both processes compress the gas from
          <latex>3V_0</latex> down to <latex>V_0</latex>.
        correct: false
    feedback:
        general: |
          The work is the area under the path, so put the two areas side by side.

          Process 2 is the easy one. Its constant pressure leg is a rectangle of height
          <latex>P_0</latex> and width <latex>2V_0</latex>, so
          <latex>
          W_{on} = P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          Its second leg is vertical. The volume does not change, so nothing sweeps out
          any area and no work is done during it at all. That leg carries the pressure
          from <latex>P_0</latex> up to <latex>3P_0</latex> and contributes nothing to
          the answer.

          Process 1 covers the same range of volumes, and it does so at a pressure that
          is above <latex>P_0</latex> everywhere except at state A itself, since the
          curve climbs steadily as the gas is squeezed. A larger height over the same
          width means a larger area, so more work is done on the gas in Process 1. You do
          not need the value of that area to answer the question, and comparing the two
          curves is enough.

          Now the choices that fail. Reaching a pressure of <latex>3P_0</latex> is not by
          itself work, and Process 2 reaches it during the leg where the volume is frozen.
          A gas at high pressure that is not moving anything is not doing work and is not
          having work done on it.

          The two equality choices are the ones worth slowing down for. Both of them are
          true statements that answer a different question. Both processes really do run
          between the same two states, and that forces the change in internal energy to
          match, since internal energy depends only on the state the gas is in. It does
          not force the work to match. Both processes really do cover the same range of
          volumes, and work depends on the pressure the gas is at while that volume
          changes, not only on how much the volume changed.

          Work is a property of the journey and not of the destination. That is what this
          whole bank is about, and it is the difference between the two paths on this
          page.
        on_correct: |
          Correct, and you settled it by comparing areas rather than endpoints, which is
          the move these questions are built to reward.
        on_incorrect: |
          Both of these paths really do run between the same two states, and one quantity
          in the first law is forced to be the same because of that. Is the work that
          quantity, and what would you have to compare on the diagram to find out?

- multiple_choice:
    id: q2
    title: Compressing First Against Raising the Pressure First
    points: 3
    text: |
      The figure shows two processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>.

      In Process 1 the gas is compressed at the constant pressure <latex>P_0</latex> and
      its pressure is then raised at constant volume. In Process 2 the pressure is raised
      first, at the constant volume <latex>3V_0</latex>, and the gas is then compressed
      at the constant pressure <latex>3P_0</latex>.

      How does the work done on the gas in Process 2 compare with the work done on the
      gas in Process 1?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          The same amount of work is done in both, because each path is one constant
          pressure leg and one constant volume leg between the same two states.
        correct: false
    - answer:
        text: |
          Twice as much work is done on the gas in Process 2.
        correct: false
    - answer:
        text: |
          Three times as much work is done on the gas in Process 2.
        correct: true
    - answer:
        text: |
          One third as much work is done on the gas in Process 2.
        correct: false
    feedback:
        general: |
          Each path has exactly one leg that does any work, since a constant volume leg
          sweeps out no area.

          In Process 1 the compression happens at <latex>P_0</latex>:
          <latex>
          W_{on} = P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          In Process 2 the pressure is raised first, so the same compression happens at
          <latex>3P_0</latex>:
          <latex>
          W_{on} = 3P_0 (3V_0 - V_0) = 6 P_0 V_0
          </latex>
          Three times as much, and the ratio is just the ratio of the two pressures,
          because the gas is squeezed through the same change in volume in both cases.

          The order of the legs is the whole difference. Squeezing a gas is harder when it
          is already at a high pressure, because the gas pushes back harder the whole way.
          If you have ever tried to pump up a tyre that is nearly full, you have felt this
          directly. The last few strokes take far more effort than the first few, and the
          volume you push in with each stroke has not changed.

          The first choice describes the two paths accurately and concludes something
          that does not follow. Having the same kinds of legs between the same two states
          does not make the areas equal, and here it does not come close.

          One more thing worth noticing. Both paths have the same change in internal
          energy, because states A and B have the same product of pressure and volume:
          <latex>
          (P_0)(3V_0) = (3P_0)(V_0) = 3 P_0 V_0
          </latex>
          so both start and finish at the same temperature and
          <latex>\Delta U = 0</latex> either way. Four extra units of energy went into
          the gas as work along Process 2, and since the gas ends up in the same state,
          those four units had to leave again by heating.
        on_correct: |
          Correct. Same two states, same change in volume, three times the work, decided
          entirely by which leg came first.
        on_incorrect: |
          One leg of each path does no work at all. Which leg is that in each process,
          and at what pressure does the volume actually change in each one?

- multiple_choice:
    id: q3
    title: A Straight Expansion Against an Isothermal One
    points: 3
    text: |
      The figure shows two processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>, to state B, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>.

      Process 1 follows the straight line shown. In Process 2 the gas is held at a
      constant temperature while it expands.

      How does the work done by the gas on its surroundings in Process 1 compare with
      the work done by the gas in Process 2?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          More work is done by the gas in Process 2, because a constant temperature keeps
          the gas pushing at full strength the whole way.
        correct: false
    - answer:
        text: |
          More work is done by the gas in Process 2, because its path is curved and
          therefore longer than the straight line of Process 1.
        correct: false
    - answer:
        text: |
          More work is done by the gas in Process 1, because the straight line lies above
          the curve between the two states, so the area beneath it is greater.
        correct: true
    - answer:
        text: |
          The same work is done in both, because both expand the gas from
          <latex>V_0</latex> to <latex>3V_0</latex> between the same two states.
        correct: false
    feedback:
        general: |
          Both paths leave state A and arrive at state B, and between those points the
          straight line sits above the isotherm. The isotherm sags away from the line and
          comes back to meet it at each end, which is what a constant temperature curve
          does on these axes. More height over the same range of volumes means more area,
          so the gas does more work along the straight line.

          The margin here is smaller than in the other comparisons in this bank, and it
          is real. Trust the picture. The curve is below the line at every volume between
          <latex>V_0</latex> and <latex>3V_0</latex>, so the areas cannot be equal.

          For the straight line you can put a number to it, since the area is a trapezoid:
          <latex>
          W_{by} = \frac{1}{2}(3P_0 + P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          The isothermal area is not something AP Physics 2 asks you to compute, and you
          are not expected to. Comparing it with the trapezoid is the skill being tested.

          The second choice is a trap that catches people who are thinking about the
          diagram as a picture of a journey through space. Path length on a pressure
          volume diagram means nothing at all. The axes are a pressure and a volume, not
          two directions, so a longer squiggle is not more work. Only the area beneath
          counts.

          The first choice has the right instinct about isothermal processes and applies
          it in the wrong direction. Holding the temperature constant does keep the
          pressure higher than an insulated expansion would, and it is still below the
          straight line, which starts and ends at the same pressures and takes the direct
          route between them.

          The last choice returns to the equality that keeps being offered in this bank.
          The same volume change between the same two states does not mean the same work.
        on_correct: |
          Correct. Above the other curve over the same range of volumes is the only
          comparison you needed.
        on_incorrect: |
          Both paths start and finish at the same pressures and cover the same volumes.
          Between those ends, which path is higher on the diagram, and what does the
          height of a path have to do with the work?

- multiple_choice:
    id: q4
    title: Ranking the Work Done Along Three Paths
    points: 3
    text: |
      The figure shows three processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>.

      In process I the gas is compressed at the constant pressure <latex>P_0</latex> and
      its pressure is then raised at constant volume. Process II follows the straight
      line shown. In process III the pressure is raised first at constant volume and the
      gas is then compressed at the constant pressure <latex>3P_0</latex>.

      Rank the three processes by the work done on the gas, from greatest to least.
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          III, then II, then I
        correct: true
    - answer:
        text: |
          I, then II, then III
        correct: false
    - answer:
        text: |
          II, then III, then I
        correct: false
    - answer:
        text: |
          All three are the same, because all three take the gas from state A to state B.
        correct: false
    feedback:
        general: |
          Every one of these is an area under a path, and all three are shapes you can
          find without any trouble.

          Process I does its compressing at <latex>P_0</latex>, and its vertical leg
          sweeps no area:
          <latex>
          W_{on} = P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          Process II is a straight line, so the area under it is a trapezoid:
          <latex>
          W_{on} = \frac{1}{2}(P_0 + 3P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          Process III does its compressing at <latex>3P_0</latex>, after the pressure has
          already been raised:
          <latex>
          W_{on} = 3P_0 (3V_0 - V_0) = 6 P_0 V_0
          </latex>
          So the ranking is III, then II, then I, and the straight line lands exactly
          halfway between the other two, which makes sense, since its average pressure
          over the compression is the average of <latex>P_0</latex> and
          <latex>3P_0</latex>.

          The last choice is the one to be sure about. All three do have the same change
          in internal energy, which is zero here, because states A and B have the same
          product of pressure and volume and therefore the same temperature. That is a
          statement about internal energy and it says nothing about the work. Three paths
          between one pair of states can move any amount of energy as work, and here they
          differ by a factor of three from end to end.

          There is a useful way to see the ranking without computing anything. Ask at
          what pressure each process does its squeezing. Process I squeezes while the gas
          is at its lowest pressure, process III waits until the gas is at its highest,
          and process II is somewhere between the two the whole way. The gas pushes back
          harder at higher pressure, so squeezing it late costs more.
        on_correct: |
          Correct. Three areas, three numbers, and a ranking that follows the pressure at
          which each process does its compressing.
        on_incorrect: |
          Two of these three paths have a leg that contributes nothing at all to the
          work. Which leg is that, and at what pressure does each process actually change
          its volume?

- multiple_choice:
    id: q5
    title: Ranking Three Paths When Two of Them Tie
    points: 3
    text: |
      The figure shows three processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>.

      In process I the gas is compressed at the constant pressure <latex>P_0</latex> to
      <latex>2V_0</latex>, its pressure is then raised at constant volume to
      <latex>3P_0</latex>, and it is then compressed at the constant pressure
      <latex>3P_0</latex> to <latex>V_0</latex>. Process II follows the straight line
      shown. In process III the gas is compressed at the constant pressure
      <latex>P_0</latex> all the way to <latex>V_0</latex> and its pressure is then
      raised at constant volume.

      Rank the three processes by the work done on the gas, from greatest to least.
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          I and II are equal, and both are greater than III.
        correct: true
    - answer:
        text: |
          I, then II, then III
        correct: false
    - answer:
        text: |
          II, then I, then III
        correct: false
    - answer:
        text: |
          All three are the same, because all three take the gas from state A to state B.
        correct: false
    feedback:
        general: |
          Process I is two rectangles with a vertical leg between them that sweeps no
          area. The first compression covers a volume <latex>V_0</latex> at pressure
          <latex>P_0</latex>, and the second covers a volume <latex>V_0</latex> at
          pressure <latex>3P_0</latex>:
          <latex>
          W_{on} = P_0 (3V_0 - 2V_0) + 3P_0 (2V_0 - V_0) = P_0 V_0 + 3 P_0 V_0
          = 4 P_0 V_0
          </latex>
          Process II is the trapezoid under the straight line:
          <latex>
          W_{on} = \frac{1}{2}(P_0 + 3P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          the same number. Process III does all of its compressing at the low pressure:
          <latex>
          W_{on} = P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          So processes I and II tie, and both take twice the work of process III.

          The tie is not a coincidence, and it is worth seeing why. The staircase of
          process I hangs below the straight line for the first half of the compression
          and rises above it for the second half, and here the two pieces are the same
          size, so what it gives up early it takes back later. Sketch the line across the
          two rectangles and you can see the piece that sticks out above matching the
          gap left below.

          Ties are worth taking seriously in a ranking question. Two different paths can
          move exactly the same energy as work, and that does not make them the same
          process. The gas passes through completely different states along the way, and
          the amounts transferred by heating during the individual legs are not the same
          either.

          The last choice is the same overreach as always. Equal endpoints force the
          change in internal energy to match, and they leave the work free. Here two of
          the three paths happen to agree and the third does not, which could not happen
          if endpoints settled the work.
        on_correct: |
          Correct, including the tie. Two paths can carry the same work without being
          anything like the same process.
        on_incorrect: |
          Work each of the three areas out as rectangles and a trapezoid before ranking
          anything. Is a ranking question obliged to give you three different answers?

- multiple_choice:
    id: q6
    title: Comparing the Energy Transferred by Heating Along Two Paths
    points: 3
    text: |
      The figure shows two processes, each taking the same fixed amount of monatomic
      ideal gas from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>.

      In Process 1 the gas is held at a constant temperature throughout the compression.
      In Process 2 the gas is first compressed at the constant pressure
      <latex>P_0</latex> until its volume reaches <latex>V_0</latex>, and its pressure is
      then raised to <latex>3P_0</latex> while the volume is held fixed.

      Over the whole path from A to B, which process transfers more energy by heating,
      in magnitude?
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          Neither transfers any energy by heating overall, because the gas ends at the
          temperature it started at.
        correct: false
    - answer:
        text: |
          They transfer the same amount, because the energy transferred by heating
          depends only on the initial and the final state.
        correct: false
    - answer:
        text: |
          Process 1, because the two states are at the same temperature, so the change in
          internal energy is zero along either path and the energy transferred by heating
          has to match the work in size.
        correct: true
    - answer:
        text: |
          Process 2, because energy has to be transferred into the gas during its constant
          volume leg in order to raise its pressure.
        correct: false
    feedback:
        general: |
          Start by checking the endpoints:
          <latex>
          (P_0)(3V_0) = (3P_0)(V_0) = 3 P_0 V_0
          </latex>
          The product of pressure and volume is the same at A and at B, so the two states
          are at the same temperature and every path between them has
          <latex>\Delta U = 0</latex>. The first law then says
          <latex>
          Q = \Delta U + W_{by} = W_{by}
          </latex>
          so along either path the energy transferred by heating is equal in size to the
          work, and the ranking of the heating is the ranking of the work. More work is
          done on the gas in Process 1, so more energy leaves it by heating in Process 1.
          Both are outward, since the gas is being compressed and cannot store what is
          being pushed into it.

          The first choice makes the mistake this unit keeps setting up. Ending at the
          starting temperature means the internal energy change is zero, and it does not
          mean nothing was transferred. It means the transfers cancelled.

          The second choice hands work and heating a property they do not have. Only the
          internal energy change is fixed by the endpoints.

          The last choice is more interesting than it looks, because its premise is
          correct. Along the constant volume leg of Process 2 the pressure rises with the
          volume fixed, so the temperature rises, and with no work being done the energy
          for that has to come in by heating. Follow the whole path and the accounting
          works out like this. During the constant pressure compression the internal
          energy falls by <latex>3 P_0 V_0</latex> while <latex>2 P_0 V_0</latex> of work
          goes in, so <latex>5 P_0 V_0</latex> leaves by heating. During the constant
          volume leg the internal energy climbs back by <latex>3 P_0 V_0</latex> with no
          work at all, so <latex>3 P_0 V_0</latex> comes in by heating. The net is
          <latex>2 P_0 V_0</latex> leaving, exactly matching the work done on the gas, as
          it must. Energy really does go in during that leg, and more went out earlier.
        on_correct: |
          Correct. With the internal energy change pinned at zero, heating and work are
          locked together and you can rank one by ranking the other.
        on_incorrect: |
          Work out the product of pressure and volume at state A and at state B before
          anything else. What does that comparison fix, and what does the first law then
          leave the heating equal to?

- multiple_choice:
    id: q7
    title: Out Along One Path and Back Along the Other
    points: 3
    text: |
      The figure shows a fixed amount of monatomic ideal gas taken around a complete
      cycle. Starting from state A, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, the gas is compressed at constant pressure to
      <latex>V_0</latex> and its pressure is then raised at constant volume to
      <latex>3P_0</latex>, reaching state B. It is then expanded at the constant pressure
      <latex>3P_0</latex> back to <latex>3V_0</latex>, and its pressure is lowered at
      constant volume until it is back at state A.

      What is the net work done over the complete cycle?
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          The gas does <latex>4 P_0 V_0</latex> of net work on the surroundings.
        correct: true
    - answer:
        text: |
          The surroundings do <latex>4 P_0 V_0</latex> of net work on the gas.
        correct: false
    - answer:
        text: |
          No net work is done, because the gas ends in the state it started in.
        correct: false
    - answer:
        text: |
          The gas does <latex>8 P_0 V_0</latex> of net work on the surroundings.
        correct: false
    feedback:
        general: |
          Only the two horizontal legs do any work, so take those and add them with their
          signs.

          Going out, the gas is compressed at <latex>P_0</latex>, so the surroundings do
          <latex>
          P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          of work on the gas. Coming back, the gas expands at <latex>3P_0</latex>, so the
          gas does
          <latex>
          3P_0 (3V_0 - V_0) = 6 P_0 V_0
          </latex>
          of work on the surroundings. Six out and two in leaves a net
          <latex>4 P_0 V_0</latex> done by the gas on its surroundings. Adding the two
          sizes to get <latex>8 P_0 V_0</latex> ignores the fact that they point in
          opposite directions.

          The shortcut is the enclosed area. The loop is a rectangle
          <latex>2V_0</latex> wide and <latex>2P_0</latex> tall, so the net work is
          <latex>
          (2V_0)(2P_0) = 4 P_0 V_0
          </latex>
          and the direction around the loop gives the sign. This one runs clockwise,
          compressing at low pressure and expanding at high pressure, and a clockwise loop
          does net work on the surroundings. That is what an engine does.

          Now connect this back to the comparisons earlier in this bank. The two halves of
          this cycle are the two paths between A and B that were compared before, one
          taken forwards and one taken backwards. The net work around the loop,
          <latex>4 P_0 V_0</latex>, is exactly the amount by which those two paths
          differed. That is the general result worth carrying away. The gap between two
          paths between the same two states is the area enclosed when you run out along
          one and back along the other, and if work were path independent every cycle
          would enclose nothing and no engine would ever run.

          The third choice is the familiar one. Returning to the starting state forces
          the change in internal energy to zero, and it forces nothing about the work.
          Since <latex>\Delta U = 0</latex> over the cycle, the first law says
          <latex>4 P_0 V_0</latex> of energy must have come into the gas by heating to pay
          for the work it did.
        on_correct: |
          Correct, and the connection is worth keeping. The net work around a loop is the
          difference between the two paths that make it up.
        on_incorrect: |
          Two of these four legs do no work at all. Take the other two with their
          directions rather than their sizes, and ask what a gas being compressed at low
          pressure and expanded at high pressure comes out with.
