bank_info:
    title: First Law Quantities from a Pressure Volume Diagram
    bank_id: APP2-THM-FLPV-081826
    description: |-
      Isomorphic calculation problems for AP Physics 2, College Board Unit 9 Topic 9.4.

      A fixed amount of monatomic ideal gas is taken along a path drawn on a pressure
      volume diagram, and you are asked for one of the three first law quantities: the
      work, the change in internal energy, or the energy transferred by heating. Every
      answer is a multiple of the product of the axis units, so no calculator is needed.
      Work out all three quantities even when the question only asks for one, because
      the first law ties them together and the one you were asked for is usually the one
      you cannot get directly.

      Teaching notes: the target idea is the first law used as a bookkeeping statement,
      with work read as the area under the path and the internal energy of a monatomic
      ideal gas read as three halves of the product of pressure and volume. Signs carry
      most of the difficulty, so the questions ask for quantities with a stated
      direction rather than for a bare number. The common errors are dropping the area
      when the volume does not change, treating internal energy as path dependent,
      treating work as path independent, subtracting the work instead of adding it, and
      concluding that a closed cycle transfers no energy because it returns to its
      starting state. APP2-THM-PVGRPH-081726 covers reading a pressure volume diagram
      before any energy accounting is done.
    date created: 08-18-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-FLT-1 # Apply the first law of thermodynamics to relate energy transferred by heating, work done, and change in internal energy
        - THM-FLT-2 # Find the work done during a process from the area under a pressure volume diagram, including its sign
        - THM-FLT-3 # Relate the internal energy of a monatomic ideal gas to the product of pressure and volume
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted as a worked reference example from the owner's outline: a
            straight line on a pressure volume diagram from V_0, P_0 to 3V_0, 3P_0, with
            the student asked for the energy transferred to the gas by heating. All
            three first law quantities are needed to get there, so q1 sets out the
            method the rest of the bank reuses. Answers are multiples of P_0 V_0 and the
            distractors are the intermediate results: the work alone, the internal
            energy change alone, and the two combined with the wrong sign.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution
            rather than the numbers: q2 runs q1's line backwards, so the same area is
            now work done on the gas and every quantity flips sign; q3 is an isobaric
            expansion and asks for the internal energy change, with the misconception
            that constant pressure means constant temperature offered as a choice; q4 is
            isochoric and asks for the work, which is zero, with the area to the left of
            the line offered as the trap; q5 reaches q1's final state through a corner,
            so the internal energy change matches q1 while the work and the heating do
            not, which is the path dependence question; q6 is a closed counterclockwise
            cycle, so the internal energy change is zero while 4 P_0 V_0 leaves the gas
            by heating, with "no transfer, because it returns to its initial state"
            offered as the trap; q7 is a straight line between two states of equal PV
            product, so the internal energy is unchanged although the process is not
            isothermal and the gas is hotter halfway along.)
        - figure prompt: |
            (Every question in this bank takes a pressure volume diagram generated by
            Scripts/make_figures.py. Axes are in units of V_0 and P_0 with labelled
            ticks and a grid, because every answer comes from reading coordinates and
            computing an area. Straight segments only, since AP Physics 2 is algebra
            based and an area has to be a rectangle or a trapezoid. States are lettered
            in visiting order with an arrowhead at the midpoint of each segment.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-18-2026) Bank created with q1. First bank in Topic 9.4.
        - update 2: (08-18-2026) Added isomorphs q2-q7 (reversed path, isobaric expansion, isochoric process, two-leg path to the same final state, closed cycle, line between two states of equal PV product).
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-18-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Energy Added Along a Straight Line to Triple Pressure and Volume
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas. The gas is taken from state A, at pressure <latex>P_0</latex> and volume
      <latex>V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>3V_0</latex>, along the straight line shown.

      How much energy is transferred to the gas by heating during this process?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          <latex>4 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>8 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>12 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>16 P_0 V_0</latex>
        correct: true
    feedback:
        general: |
          There is no equation that hands you the energy transferred by heating
          directly. You get it from the other two quantities, so work those out first.
          This three step method is the one every question in this bank uses.

          Start with the work. The work done by the gas on its surroundings is the area
          under the path, and the path here is a straight line, so that area is a
          trapezoid:
          <latex>
          W_{by} = \frac{1}{2}(P_0 + 3P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          The gas expands, so the gas does this work on the surroundings rather than
          receiving it.

          Next the internal energy. For a monatomic ideal gas the internal energy is
          <latex>
          U = \frac{3}{2} n R T
          </latex>
          and the ideal gas law says <latex>nRT = PV</latex>, so the internal energy of
          the gas is three halves of the product of its pressure and its volume. That is
          worth committing to memory, because it turns a temperature calculation into
          something you can read off the axes:
          <latex>
          \Delta U = \frac{3}{2}(P_B V_B - P_A V_A)
          = \frac{3}{2}(9 P_0 V_0 - P_0 V_0) = 12 P_0 V_0
          </latex>

          Now the first law does the bookkeeping. Energy put into the gas by heating has
          two places to go, into the internal energy of the gas or out again as work done
          on the surroundings:
          <latex>
          Q = \Delta U + W_{by} = 12 P_0 V_0 + 4 P_0 V_0 = 16 P_0 V_0
          </latex>

          Look at the three wrong choices, because each one is a real stopping point on
          the way. <latex>4 P_0 V_0</latex> is the work by itself, and
          <latex>12 P_0 V_0</latex> is the internal energy change by itself. Neither is
          the whole story, since the gas both warmed up and pushed its surroundings back.
          <latex>8 P_0 V_0</latex> is what you get by subtracting the work instead of
          adding it, which is the single easiest slip to make here.

          A note on how you may have seen the first law written. Your equation sheet
          gives it as <latex>\Delta U = Q + W</latex>, where <latex>W</latex> is the work
          done on the gas by the surroundings, which is the negative of the work the gas
          does on them. Both forms say the same thing. Use whichever you were taught,
          and decide the sign by asking whether the gas expanded or was compressed rather
          than by trusting the symbol.
        on_correct: |
          Correct. You needed the area and the internal energy change before the first
          law could give you anything, and that order works for every question in this
          set.
        on_incorrect: |
          The energy transferred by heating is not something you can read off the diagram
          on its own. What two quantities does the first law connect it to, and which one
          of those is the area under the path?

- multiple_choice:
    id: q2
    title: The Same Straight Line Run Backwards
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas. The gas is taken from state A, at pressure <latex>3P_0</latex> and volume
      <latex>3V_0</latex>, to state B, at pressure <latex>P_0</latex> and volume
      <latex>V_0</latex>, along the straight line shown.

      How much work is done during this process, and on what?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          The gas does <latex>4 P_0 V_0</latex> of work on the surroundings.
        correct: false
    - answer:
        text: |
          The surroundings do <latex>4 P_0 V_0</latex> of work on the gas.
        correct: true
    - answer:
        text: |
          The surroundings do <latex>2 P_0 V_0</latex> of work on the gas.
        correct: false
    - answer:
        text: |
          The surroundings do <latex>12 P_0 V_0</latex> of work on the gas.
        correct: false
    feedback:
        general: |
          The area under this path is the same trapezoid as before, since it is the same
          line:
          <latex>
          \frac{1}{2}(P_0 + 3P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          What has changed is the direction of travel. The gas is compressed from
          <latex>3V_0</latex> down to <latex>V_0</latex>, so the surroundings push the
          piston in and do work on the gas rather than receiving work from it. The
          magnitude comes from the area and the direction comes from whether the volume
          grew or shrank.

          This is the safest habit to build for the whole topic. Find the size of the
          area first and settle the sign afterwards by asking one question: did the gas
          expand, or was it squeezed? A gas that expands pushes its surroundings back and
          does work on them. A gas that is compressed has work done on it. The formula
          will not tell you which happened, and the arrow on the diagram will.

          The other two wrong choices come from taking a number that belongs to something
          else. <latex>2 P_0 V_0</latex> is the rectangle you get by using only the lower
          pressure, which would be right if the pressure held at <latex>P_0</latex>
          throughout, and here it does not. <latex>12 P_0 V_0</latex> is the size of the
          change in internal energy for this process, not the work.

          For completeness, all three quantities flip sign relative to the forward
          process. The internal energy falls by <latex>12 P_0 V_0</latex>, the
          surroundings do <latex>4 P_0 V_0</latex> of work on the gas, and
          <latex>16 P_0 V_0</latex> of energy leaves the gas by heating.
        on_correct: |
          Correct, and you kept the sign straight. The area only ever gives you the size
          of the work.
        on_incorrect: |
          The area under this line is the same as it was when the gas went the other way
          along it. What is different about this process, and what does that difference
          decide?

- multiple_choice:
    id: q3
    title: Internal Energy Change During an Expansion at Constant Pressure
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas. The gas is taken from state A, at pressure <latex>P_0</latex> and volume
      <latex>V_0</latex>, to state B, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>.

      What is the change in the internal energy of the gas during this process?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          It does not change, because the pressure is constant.
        correct: false
    - answer:
        text: |
          It increases by <latex>2 P_0 V_0</latex>.
        correct: false
    - answer:
        text: |
          It increases by <latex>3 P_0 V_0</latex>.
        correct: true
    - answer:
        text: |
          It increases by <latex>5 P_0 V_0</latex>.
        correct: false
    feedback:
        general: |
          The internal energy of a monatomic ideal gas is three halves of the product of
          its pressure and its volume, so only the endpoints matter:
          <latex>
          \Delta U = \frac{3}{2}(P_B V_B - P_A V_A)
          = \frac{3}{2}(3 P_0 V_0 - P_0 V_0) = 3 P_0 V_0
          </latex>
          The gas triples in volume at constant pressure, so its temperature triples too,
          and its internal energy rises with it.

          The first choice is the one worth spending time on. A constant pressure does not
          mean a constant temperature, and internal energy tracks temperature. With the
          pressure held fixed and the volume tripling, the ideal gas law forces the
          absolute temperature to triple as well. Something has to keep the pressure up
          while the gas expands, and that something is heating.

          The other two wrong answers are the neighbouring quantities.
          <latex>2 P_0 V_0</latex> is the work the gas does on its surroundings, the
          rectangular area under the path:
          <latex>
          W_{by} = P_0 (3V_0 - V_0) = 2 P_0 V_0
          </latex>
          and <latex>5 P_0 V_0</latex> is the energy transferred into the gas by heating,
          <latex>
          Q = \Delta U + W_{by} = 3 P_0 V_0 + 2 P_0 V_0 = 5 P_0 V_0
          </latex>
          Notice how that splits. Of the five units of energy put in, three stay in the
          gas as internal energy and two leave again as work done on the surroundings.
          Being able to say where the energy went is what the first law is for.
        on_correct: |
          Correct. Constant pressure with a changing volume still means a changing
          temperature, and internal energy follows the temperature.
        on_incorrect: |
          Internal energy depends on the temperature of the gas. What does the ideal gas
          law say happens to the temperature when the pressure holds steady and the
          volume triples?

- multiple_choice:
    id: q4
    title: Work Done When the Volume Cannot Change
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas sealed in a rigid container. The gas is taken from state A, at pressure
      <latex>P_0</latex> and volume <latex>V_0</latex>, to state B, at pressure
      <latex>3P_0</latex> and volume <latex>V_0</latex>.

      How much work is done during this process, and on what?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          No work is done, by the gas or on it.
        correct: true
    - answer:
        text: |
          The gas does <latex>2 P_0 V_0</latex> of work on the surroundings.
        correct: false
    - answer:
        text: |
          The surroundings do <latex>2 P_0 V_0</latex> of work on the gas.
        correct: false
    - answer:
        text: |
          The gas does <latex>3 P_0 V_0</latex> of work on the surroundings.
        correct: false
    feedback:
        general: |
          The work is the area under the path, and a vertical line has no area under it.
          The volume never changes, so the answer is zero.

          It helps to think about what work means here rather than about the diagram.
          Work is done when a force moves something through a distance, and for a gas
          that means the walls of the container have to move. The container is rigid, so
          nothing moves and no work is done in either direction. Pressure alone does not
          do work, however high it climbs.

          The <latex>2 P_0 V_0</latex> choices come from multiplying the volume by the
          change in pressure:
          <latex>
          V_0 (3P_0 - P_0) = 2 P_0 V_0
          </latex>
          That is the area to the left of the line rather than the area under it, and it
          is not the work. If you find yourself computing an area on a pressure volume
          diagram, check that you are sweeping across a change in volume.

          Since no work is done, the first law becomes very short. Everything transferred
          into the gas by heating stays there as internal energy:
          <latex>
          Q = \Delta U = \frac{3}{2}(3 P_0 V_0 - P_0 V_0) = 3 P_0 V_0
          </latex>
          which is the origin of the last wrong choice. That number is real, and it is
          the energy added by heating, not work.
        on_correct: |
          Correct. A rigid container takes work out of the first law entirely and leaves
          heating and internal energy to balance each other.
        on_incorrect: |
          Work requires something to move through a distance. What part of this apparatus
          would have to move for the gas to do work, and does the diagram show it moving?

- multiple_choice:
    id: q5
    title: Reaching the Same Final State by a Different Path
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas. The gas is taken from state A, at pressure <latex>P_0</latex> and volume
      <latex>V_0</latex>, to state B, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>, and then to state C, at pressure <latex>3P_0</latex> and
      volume <latex>3V_0</latex>.

      How much energy is transferred to the gas by heating over the whole path from A to
      C?
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          <latex>6 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>12 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>16 P_0 V_0</latex>
        correct: false
    - answer:
        text: |
          <latex>18 P_0 V_0</latex>
        correct: true
    feedback:
        general: |
          Take the two legs separately and add them up.

          From A to B the volume does not change, so no work is done. From B to C the gas
          expands at constant pressure, and the area under that leg is a rectangle:
          <latex>
          W_{by} = 3P_0 (3V_0 - V_0) = 6 P_0 V_0
          </latex>
          so the gas does <latex>6 P_0 V_0</latex> of work on its surroundings over the
          whole path.

          The internal energy change needs only the two endpoints:
          <latex>
          \Delta U = \frac{3}{2}(9 P_0 V_0 - P_0 V_0) = 12 P_0 V_0
          </latex>
          and the first law finishes it:
          <latex>
          Q = \Delta U + W_{by} = 12 P_0 V_0 + 6 P_0 V_0 = 18 P_0 V_0
          </latex>

          Now compare this with the straight line between the same two states. The
          internal energy change is <latex>12 P_0 V_0</latex> in both, because A and C
          are the same two states either way and internal energy depends only on where
          the gas is, never on how it got there. The work is not the same. It was
          <latex>4 P_0 V_0</latex> along the straight line and it is
          <latex>6 P_0 V_0</latex> here, because this path does all of its expanding at
          the higher pressure, which means pushing the surroundings back harder the whole
          way. The energy transferred by heating differs by exactly the same amount,
          <latex>16 P_0 V_0</latex> against <latex>18 P_0 V_0</latex>, which is why
          <latex>16 P_0 V_0</latex> is offered as a choice.

          That distinction is the heart of this topic. Internal energy is a property of
          the state the gas is in. Work and heating are not properties of a state at all,
          they are amounts of energy moved during a journey, and different journeys
          between the same two states move different amounts.
        on_correct: |
          Correct, and the comparison with the straight line path is worth holding on to.
          Same endpoints, same internal energy change, different work and different
          heating.
        on_incorrect: |
          The straight line between these same two states is worked out elsewhere in this
          set. Which of the three first law quantities should come out the same as it did
          there, and which should not?

- multiple_choice:
    id: q6
    title: Net Energy Transferred Over a Complete Cycle
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas taken around a complete cycle. From state A, at pressure <latex>P_0</latex> and
      volume <latex>V_0</latex>, the gas expands at constant pressure to state B at
      <latex>3V_0</latex>. Its pressure then rises to <latex>3P_0</latex> at state C, it
      is compressed at constant pressure to state D at <latex>V_0</latex>, and its
      pressure then falls back to <latex>P_0</latex>, returning it to state A.

      What is the net energy transferred by heating over the complete cycle?
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          No energy is transferred by heating over the cycle, because the gas ends in the
          state it started in.
        correct: false
    - answer:
        text: |
          <latex>4 P_0 V_0</latex> is transferred into the gas.
        correct: false
    - answer:
        text: |
          <latex>4 P_0 V_0</latex> is transferred out of the gas.
        correct: true
    - answer:
        text: |
          <latex>8 P_0 V_0</latex> is transferred out of the gas.
        correct: false
    feedback:
        general: |
          A complete cycle ends where it began, so the gas finishes at the pressure and
          volume it started at, and the internal energy is back to its starting value:
          <latex>
          \Delta U = 0
          </latex>
          That much of the first choice is correct reasoning. It then goes one step too
          far. An internal energy that does not change means the heating and the work
          have to cancel each other, not that both are zero.

          Add the work up leg by leg. From A to B the gas expands at <latex>P_0</latex>,
          so it does <latex>2 P_0 V_0</latex> of work on the surroundings. From B to C the
          volume is fixed and no work is done. From C to D the gas is compressed at
          <latex>3P_0</latex>, so the surroundings do
          <latex>
          3P_0 (2V_0) = 6 P_0 V_0
          </latex>
          of work on the gas. From D to A the volume is fixed again. The gas gave out two
          units of work and had six put in, so over the cycle the surroundings do
          <latex>4 P_0 V_0</latex> of net work on the gas.

          There is a shortcut worth knowing. The net work over a closed cycle is the area
          enclosed by the loop, here a rectangle of
          <latex>
          (2V_0)(2P_0) = 4 P_0 V_0
          </latex>
          and the direction around the loop gives the sign. This cycle runs
          counterclockwise, expanding at low pressure and compressing at high pressure,
          so work goes into the gas. A clockwise loop is the other way round and is what
          an engine does.

          Now the first law, with the internal energy change equal to zero:
          <latex>
          Q = \Delta U + W_{by} = 0 + (-4 P_0 V_0) = -4 P_0 V_0
          </latex>
          The negative sign means the transfer runs outward, so
          <latex>4 P_0 V_0</latex> of energy leaves the gas by heating over the cycle.
          Work goes in, an equal amount of energy comes out by heating, and the gas
          itself is unchanged at the end of it. That is a refrigerator in outline.
        on_correct: |
          Correct, including the direction. Returning to the starting state fixes the
          internal energy change at zero and it leaves the heating and the work free to
          be large.
        on_incorrect: |
          Something in this cycle really does come back to zero. Which of the three first
          law quantities is it, and does the first law then require the other two to be
          zero as well?

- multiple_choice:
    id: q7
    title: A Straight Line Between Two States at the Same Temperature
    points: 3
    text: |
      The figure shows a pressure volume diagram for a fixed amount of monatomic ideal
      gas. The gas is taken from state A, at pressure <latex>3P_0</latex> and volume
      <latex>V_0</latex>, to state B, at pressure <latex>P_0</latex> and volume
      <latex>3V_0</latex>, along the straight line shown.

      What is the change in the internal energy of the gas between state A and state B?
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          It is unchanged.
        correct: true
    - answer:
        text: |
          It increases by <latex>4 P_0 V_0</latex>.
        correct: false
    - answer:
        text: |
          It decreases by <latex>4 P_0 V_0</latex>.
        correct: false
    - answer:
        text: |
          It decreases by <latex>2 P_0 V_0</latex>, because the pressure falls from
          <latex>3P_0</latex> to <latex>P_0</latex>.
        correct: false
    feedback:
        general: |
          Compare the product of pressure and volume at the two ends. At state A it is
          <latex>3P_0 V_0</latex>, and at state B it is
          <latex>
          P_0 (3V_0) = 3 P_0 V_0
          </latex>
          The same product means the same temperature, and for a monatomic ideal gas
          the internal energy is three halves of that product, so
          <latex>
          \Delta U = \frac{3}{2}(3 P_0 V_0 - 3 P_0 V_0) = 0
          </latex>
          The gas ends at the temperature it started at. That is why the falling pressure
          on its own settles nothing: the volume rose by exactly as much as the pressure
          fell.

          Be careful about what this does and does not say. The two endpoints are at the
          same temperature, and the process between them is not an isothermal one. Follow
          the line to the halfway point, at <latex>2V_0</latex> and <latex>2P_0</latex>,
          where the product is
          <latex>
          4 P_0 V_0
          </latex>
          The gas is hotter in the middle than at either end. It warms up and then cools
          back down, and only the two ends match. A straight line on this diagram is not
          an isotherm, and a question asking about the endpoints does not care.

          The energy accounting still has plenty in it. The area under the line is a
          trapezoid,
          <latex>
          W_{by} = \frac{1}{2}(3P_0 + P_0)(3V_0 - V_0) = 4 P_0 V_0
          </latex>
          and with no change in internal energy the first law gives
          <latex>
          Q = \Delta U + W_{by} = 0 + 4 P_0 V_0 = 4 P_0 V_0
          </latex>
          so <latex>4 P_0 V_0</latex> of energy is transferred into the gas by heating
          and every bit of it leaves again as work done on the surroundings. That number
          is where both of the middle choices come from. Energy passed straight through
          the gas without any of it staying behind.
        on_correct: |
          Correct. The pressure fell and the volume rose in exactly compensating amounts,
          so the gas came out at the temperature it went in at.
        on_incorrect: |
          Internal energy is fixed by the state the gas is in, not by one of its two
          coordinates. What can you compute at state A and at state B that would tell you
          whether the temperature changed?
