bank_info:
    title: Uniform Gas Pressure on Container Walls
    bank_id: APP2-THM-UNIPRES-080926
    description: |-
      Isomorphic conceptual problems for AP Physics 2, College Board Unit 9
      Topic 9.1.

      You are shown a closed container whose surfaces have different areas, and asked
      to compare the pressure the gas inside pushes on each one. Read carefully
      whether a question is asking you about pressure or about total force, because
      the two do not answer the same way.

      Teaching notes: the target idea is that the pressure of a gas in equilibrium is
      the same at every wall and does not depend on the area it acts on. Area sets the
      total force, not the pressure. The common misconception is to conflate pressure
      with force, and so to reason that the larger surface must feel the greater
      pressure, or to invert that and pick the smaller one.
    date created: 08-09-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-KTTP-3 # Explain gas pressure as the result of molecular collisions with the walls
        - THM-KTTP-4 # Distinguish pressure from force; recognize pressure as uniform throughout a gas in equilibrium
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 authored directly by Michael Baker — no LLM generation.)
        - prompt 2: |
            (q2-q4 authored directly by Michael Baker as isomorphs of q1. Each
            varies the container geometry and the area ratio, and q2/q4 switch
            the quantity asked for from pressure to total force so the solution
            requires applying F = PA rather than only recognizing that pressure
            is uniform.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-09-2026) Michael Baker authored the source question q1.
        - update 2: (08-09-2026) Added isomorphs q2-q4 (box/force, flask/neck, force ratio).
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-09-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Pressure on the Top and Side of a Closed Cylinder
    points: 1
    text: |
      A closed cylindrical container is filled with a monatomic ideal gas at
      room temperature. The radius of the circular top surface of the container
      is <latex>r</latex> and the height of the cylindrical side of the container
      is <latex>2r</latex>, as indicated in the figure. Which of the following
      statements about the pressure exerted by the gas on the top and side of
      the container is correct?
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: The gas exerts a greater pressure on the top than on the side.
        correct: false
    - answer:
        text: The gas exerts zero pressure on the top and side.
        correct: false
    - answer:
        text: The gas exerts the same nonzero pressure on the top and the side.
        correct: true
    - answer:
        text: The gas exerts a greater pressure on the side than on the top.
        correct: false
    feedback:
        general: |
          The pressure of an ideal gas in equilibrium is the same throughout the
          gas, so the pressure at the container walls is the same everywhere.
          Pressure is force per unit area, so the larger side surface does
          experience a larger total force, but the pressure (the force per unit
          area) is identical on both surfaces.
        on_correct: |
          Correct. The pressure of an ideal gas is the same throughout the gas,
          so the pressure at the container walls is the same everywhere.
        on_incorrect: |
          Read the question again and note exactly which quantity it asks you to
          compare. Does a larger area change the pressure a sealed gas exerts on it, or
          does it change something else?

- multiple_choice:
    id: q2
    title: Total Force on Two Faces of a Sealed Box
    points: 1
    text: |
      A sealed rectangular box is filled with a monatomic ideal gas at room
      temperature. The area of the bottom face of the box is <latex>A</latex>
      and the area of one of the side faces is <latex>3A</latex>, as indicated
      in the figure. Which of the following statements about the total force
      exerted by the gas on the bottom face and on that side face is correct?
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: The gas exerts the same total force on both faces.
        correct: false
    - answer:
        text: |
          The gas exerts three times as much total force on the side face as on
          the bottom face.
        correct: true
    - answer:
        text: |
          The gas exerts three times as much total force on the bottom face as
          on the side face.
        correct: false
    - answer:
        text: The gas exerts zero total force on both faces.
        correct: false
    feedback:
        general: |
          The pressure is the same everywhere in the gas, but force is pressure
          times area: <latex>F = PA</latex>. The side face has three times the
          area of the bottom face, so it experiences three times the total
          force even though the pressure on it is identical.
        on_correct: |
          Correct. Equal pressure over triple the area gives triple the force.
        on_incorrect: |
          This question asks about total force rather than pressure. What relationship
          connects those two, and what part does the area play in it?

- multiple_choice:
    id: q3
    title: Pressure in a Flask with a Narrow Neck
    points: 1
    text: |
      A sealed glass flask consists of a wide spherical bulb joined to a narrow
      cylindrical neck, and is filled with a monatomic ideal gas at room
      temperature. The inner wall area of the bulb is <latex>5A</latex> and the
      inner wall area of the neck is <latex>A</latex>, as indicated in the
      figure. Which of the following statements about the pressure exerted by
      the gas on the bulb wall and on the neck wall is correct?
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: The gas exerts a greater pressure on the neck wall than on the bulb wall.
        correct: false
    - answer:
        text: The gas exerts a greater pressure on the bulb wall than on the neck wall.
        correct: false
    - answer:
        text: The gas exerts the same nonzero pressure on both walls.
        correct: true
    - answer:
        text: |
          The gas exerts pressure on the bulb wall only, because the neck is too
          narrow for the molecules to strike it.
        correct: false
    feedback:
        general: |
          A gas in equilibrium has the same pressure throughout, regardless of
          the shape of the container or how narrow any part of it is. Narrowing
          a channel raises the speed of a flowing fluid, but this gas is not
          flowing. It is sealed in a container and sitting in equilibrium, so the
          pressure at the neck wall equals the pressure at the bulb wall.
        on_correct: |
          Correct. Container shape does not affect the pressure of a gas in
          equilibrium.
        on_incorrect: |
          Is anything actually flowing in this flask? Think about what a sealed gas
          sitting in equilibrium is doing, and what that means for the pressure from one
          place to another.

- multiple_choice:
    id: q4
    title: Force on the Larger Face Given the Force on the Smaller
    points: 1
    text: |
      A sealed container of monatomic ideal gas has one face of area
      <latex>A</latex> and a second face of area <latex>4A</latex>, as
      indicated in the figure. The gas exerts a total force of magnitude
      <latex>F</latex> on the smaller face. What is the magnitude of the total
      force the gas exerts on the larger face?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: <latex>F/4</latex>
        correct: false
    - answer:
        text: <latex>F</latex>
        correct: false
    - answer:
        text: <latex>2F</latex>
        correct: false
    - answer:
        text: <latex>4F</latex>
        correct: true
    feedback:
        general: |
          The pressure is the same on both faces, so
          <latex>P = F/A</latex> on the smaller face and the same
          <latex>P</latex> acts on the larger face. Then
          <latex>
          F_{large} = P(4A) = \frac{F}{A}(4A) = 4F
          </latex>
        on_correct: |
          Correct. Equal pressure acting over four times the area gives four
          times the force.
        on_incorrect: |
          What do you already know about the pressure on the two faces, and what
          relationship connects the pressure on a face to the total force on it?

