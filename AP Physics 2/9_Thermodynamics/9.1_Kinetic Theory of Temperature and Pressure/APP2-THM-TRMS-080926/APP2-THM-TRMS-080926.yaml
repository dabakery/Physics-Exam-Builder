bank_info:
    title: Scaling of Kinetic Energy and RMS Speed with Temperature
    bank_id: APP2-THM-TRMS-080926
    description: |-
      Isomorphic conceptual problems for AP Physics 2, College Board Unit 9
      Topic 9.1. The absolute temperature of a sealed ideal gas is changed by a
      known factor and students state how the average translational kinetic
      energy and the root-mean-square speed each respond.

      The target idea is the difference in scaling between the two quantities:
      <latex>K_{avg} \propto T</latex> but
      <latex>v_{rms} \propto \sqrt{T}</latex>. The common error is to assume
      both scale the same way.
    date created: 08-09-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-KTTP-1 # Relate average translational kinetic energy to absolute temperature
        - THM-KTTP-2 # Relate molecular speed distribution to temperature and molar mass
    generation prompts:
        - prompt 1: |
            (q1 drafted as a worked reference example. Further isomorphs should
            vary the scaling factor — halved, tripled, quadrupled — and should
            sometimes ask for the temperature change required to produce a
            stated change in v_rms, which reverses the direction of the
            reasoning.)
        - prompt 2: |
            (q2-q6 authored as isomorphs of q1. Each changes the direction or
            the entry point of the reasoning rather than only the scaling
            factor: q2 starts from a stated change in v_rms and works back to
            T; q3 scales T downward so the root is taken of a fraction; q4 and
            q5 read a Maxwell-Boltzmann distribution off a figure, q4 comparing
            two temperatures for one gas and q5 comparing two gases at one
            temperature; q6 enters through K_avg instead of T. Figures are
            generated by Scripts/make_figures.py.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-09-2026) Bank created; q1 moved here from the initial template scaffold.
        - update 2: (08-14-2026) Added isomorphs q2-q6 (reverse from v_rms, halving, two Maxwell-Boltzmann figure questions, entry through K_avg) and Scripts/make_figures.py.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-09-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Effect of Doubling Absolute Temperature
    points: 2
    text: |
      An ideal gas is sealed in a rigid container. The absolute temperature of
      the gas is doubled. What happens to the average translational kinetic
      energy of the molecules, and to their root-mean-square speed?
    answers:
    - answer:
        text: |
          The average kinetic energy doubles and the rms speed increases by a
          factor of <latex>\sqrt{2}</latex>.
        correct: true
    - answer:
        text: Both the average kinetic energy and the rms speed double.
        correct: false
    - answer:
        text: |
          The average kinetic energy increases by a factor of
          <latex>\sqrt{2}</latex> and the rms speed doubles.
        correct: false
    - answer:
        text: |
          The average kinetic energy doubles and the rms speed is unchanged,
          because the container is rigid.
        correct: false
    feedback:
        general: |
          Average translational kinetic energy is directly proportional to
          absolute temperature,
          <latex>K_{avg} = \frac{3}{2} k_B T</latex>, so doubling
          <latex>T</latex> doubles it. The root-mean-square speed follows
          <latex>
          v_{rms} = \sqrt{\frac{3 k_B T}{m}}
          </latex>
          so it grows as <latex>\sqrt{T}</latex> and increases by a factor of
          <latex>\sqrt{2}</latex>. A rigid container fixes the volume, not the
          molecular speeds.
        on_correct: |
          Correct. Kinetic energy scales with <latex>T</latex>, speed with
          <latex>\sqrt{T}</latex>.
        on_incorrect: |
          The two quantities do not scale the same way — compare
          <latex>K_{avg} \propto T</latex> with
          <latex>v_{rms} \propto \sqrt{T}</latex>.

- multiple_choice:
    id: q2
    title: Temperature Change Needed to Double the RMS Speed
    points: 2
    text: |
      An ideal gas is sealed in a rigid container. You want to double the
      root-mean-square speed of its molecules. By what factor must the absolute
      temperature of the gas be changed, and what happens to the average
      translational kinetic energy of the molecules?
    answers:
    - answer:
        text: |
          The absolute temperature must be multiplied by <latex>4</latex>, and
          the average kinetic energy is multiplied by <latex>4</latex>.
        correct: true
    - answer:
        text: |
          The absolute temperature must be multiplied by <latex>2</latex>, and
          the average kinetic energy is multiplied by <latex>2</latex>.
        correct: false
    - answer:
        text: |
          The absolute temperature must be multiplied by <latex>2</latex>, and
          the average kinetic energy is multiplied by <latex>4</latex>.
        correct: false
    - answer:
        text: |
          The absolute temperature must be multiplied by
          <latex>\sqrt{2}</latex>, and the average kinetic energy is multiplied
          by <latex>2</latex>.
        correct: false
    feedback:
        general: |
          This is the same relationship as before, read in the other direction.
          Since
          <latex>
          v_{rms} = \sqrt{\frac{3 k_B T}{m}}
          </latex>
          the speed depends on the square root of the temperature, so the
          temperature depends on the square of the speed. Doubling
          <latex>v_{rms}</latex> therefore requires multiplying the absolute
          temperature by <latex>2^2 = 4</latex>. Average kinetic energy is
          directly proportional to absolute temperature, so it is multiplied by
          <latex>4</latex> as well.
        on_correct: |
          Correct. Squaring the speed factor gives the temperature factor.
        on_incorrect: |
          Work backwards from <latex>v_{rms} \propto \sqrt{T}</latex>. If the
          speed grows by a factor, the temperature grows by the square of that
          factor.

- multiple_choice:
    id: q3
    title: Effect of Halving Absolute Temperature
    points: 2
    text: |
      An ideal gas is sealed in a rigid container. The absolute temperature of
      the gas is reduced to half its original value. What happens to the
      average translational kinetic energy of the molecules, and to their
      root-mean-square speed?
    answers:
    - answer:
        text: |
          The average kinetic energy is halved and the rms speed decreases by a
          factor of <latex>\sqrt{2}</latex>.
        correct: true
    - answer:
        text: Both the average kinetic energy and the rms speed are halved.
        correct: false
    - answer:
        text: |
          The average kinetic energy decreases by a factor of
          <latex>\sqrt{2}</latex> and the rms speed is halved.
        correct: false
    - answer:
        text: |
          The average kinetic energy is halved and the rms speed is unchanged,
          because the mass of the molecules has not changed.
        correct: false
    feedback:
        general: |
          The scaling works the same way going down as it does going up.
          Average translational kinetic energy is directly proportional to
          absolute temperature, <latex>K_{avg} = \frac{3}{2} k_B T</latex>, so
          halving <latex>T</latex> halves it. The root-mean-square speed follows
          <latex>
          v_{rms} = \sqrt{\frac{3 k_B T}{m}}
          </latex>
          so it changes by a factor of <latex>\sqrt{1/2}</latex>, which means it
          drops to about <latex>71</latex> percent of its original value rather
          than to half. The mass of the molecules does appear in the speed
          relationship, but it has not changed here, so it cannot keep the speed
          constant.
        on_correct: |
          Correct. The speed falls by <latex>\sqrt{2}</latex> while the energy
          falls by <latex>2</latex>.
        on_incorrect: |
          Take the square root of the temperature factor to get the speed
          factor. Half the temperature gives <latex>\sqrt{1/2}</latex> of the
          speed, not half.

- multiple_choice:
    id: q4
    title: Reading Two Temperatures from a Speed Distribution
    points: 2
    text: |
      The figure shows the distribution of molecular speeds for a fixed sample
      of an ideal gas at two different temperatures, labeled A and B. Use the
      speeds at which the two curves peak to compare the two conditions. Which
      of the following statements is correct?
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          The absolute temperature of B is <latex>4</latex> times that of A, and
          the average translational kinetic energy of B is <latex>4</latex>
          times that of A.
        correct: true
    - answer:
        text: |
          The absolute temperature of B is <latex>2</latex> times that of A, and
          the average translational kinetic energy of B is <latex>2</latex>
          times that of A.
        correct: false
    - answer:
        text: |
          The absolute temperature of B is <latex>4</latex> times that of A, and
          the average translational kinetic energy of B is <latex>2</latex>
          times that of A.
        correct: false
    - answer:
        text: |
          The absolute temperature of B is <latex>\sqrt{2}</latex> times that of
          A, and the average translational kinetic energy of B is
          <latex>\sqrt{2}</latex> times that of A.
        correct: false
    feedback:
        general: |
          Curve A peaks at about <latex>400</latex> m/s and curve B peaks at
          about <latex>800</latex> m/s, so the molecular speeds in B are larger
          by a factor of <latex>2</latex>. Molecular speed scales with the
          square root of absolute temperature, so the temperature factor is the
          square of the speed factor:
          <latex>
          \frac{T_B}{T_A} = 2^2 = 4
          </latex>
          Average translational kinetic energy is directly proportional to
          absolute temperature, so it is also <latex>4</latex> times larger in
          B. Notice that curve B is both shifted right and flattened. The area
          under each curve is the same, because the sample contains the same
          molecules in both cases, so spreading the speeds over a wider range
          has to lower the peak.
        on_correct: |
          Correct. A speed ratio of <latex>2</latex> read off the graph means a
          temperature ratio of <latex>4</latex>.
        on_incorrect: |
          Read the peak speeds off the horizontal axis first, then remember that
          the temperature ratio is the square of the speed ratio.

- multiple_choice:
    id: q5
    title: Comparing Two Gases at the Same Temperature
    points: 2
    text: |
      The figure shows the distribution of molecular speeds for two different
      ideal gases, labeled X and Y. The two samples are held at the same
      temperature and contain the same number of molecules. Which of the
      following statements is correct?
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          Gas Y has the larger molar mass, and the two gases have the same
          average translational kinetic energy.
        correct: true
    - answer:
        text: |
          Gas X has the larger molar mass, and the two gases have the same
          average translational kinetic energy.
        correct: false
    - answer:
        text: |
          Gas Y has the larger molar mass, and gas Y has the larger average
          translational kinetic energy.
        correct: false
    - answer:
        text: |
          Gas X has the larger molar mass, and gas X has the larger average
          translational kinetic energy, because its molecules are moving faster.
        correct: false
    feedback:
        general: |
          Both gases are at the same temperature, so
          <latex>K_{avg} = \frac{3}{2} k_B T</latex> gives them the same average
          translational kinetic energy. There is no mass term in that
          relationship at all. The mass shows up in the speed:
          <latex>
          v_{rms} = \sqrt{\frac{3 k_B T}{m}}
          </latex>
          so at a fixed temperature the more massive molecules are the slower
          ones. Gas Y peaks at the lower speed, which makes Y the heavier gas.
          The two effects balance, since a larger mass paired with a smaller
          speed leaves <latex>\frac{1}{2} m v^2</latex> unchanged.
        on_correct: |
          Correct. At a fixed temperature the heavier gas is slower, and both
          gases still have the same average kinetic energy.
        on_incorrect: |
          Moving faster does not mean carrying more kinetic energy here, because
          the two gases have different molecular masses. At the same
          temperature, the average kinetic energy is the same and only the
          speeds differ.

- multiple_choice:
    id: q6
    title: RMS Speed After the Average Kinetic Energy Triples
    points: 2
    text: |
      An ideal gas is sealed in a rigid container. The average translational
      kinetic energy of its molecules is measured to be three times larger than
      it was earlier in the day. By what factor has the root-mean-square speed
      of the molecules changed?
    answers:
    - answer:
        text: It has increased by a factor of <latex>\sqrt{3}</latex>.
        correct: true
    - answer:
        text: It has increased by a factor of <latex>3</latex>.
        correct: false
    - answer:
        text: It has increased by a factor of <latex>9</latex>.
        correct: false
    - answer:
        text: |
          It has not changed, because the container is rigid and the mass of the
          molecules is the same.
        correct: false
    feedback:
        general: |
          You can go straight from the energy to the speed without finding the
          temperature at all. Average translational kinetic energy is
          <latex>
          K_{avg} = \frac{1}{2} m v_{rms}^2
          </latex>
          so the energy is proportional to the square of the speed, and the
          speed is proportional to the square root of the energy. Tripling
          <latex>K_{avg}</latex> multiplies <latex>v_{rms}</latex> by
          <latex>\sqrt{3}</latex>, which is about <latex>1.7</latex>. The
          temperature has tripled as well, and going through
          <latex>v_{rms} \propto \sqrt{T}</latex> gives the same answer.
        on_correct: |
          Correct. Speed goes as the square root of the energy.
        on_incorrect: |
          Start from <latex>K_{avg} = \frac{1}{2} m v_{rms}^2</latex>. Since the
          energy depends on the speed squared, the speed changes by the square
          root of the energy factor.

# ── Notes for the next pass (delete once resolved) ────────────────────────────
#
# Isomorph design, for reference when extending the bank. Every variant holds
#   the same target idea (K_avg goes as T, v_rms goes as sqrt(T)) but changes
#   where the reasoning starts or which way it runs:
#     q1  T doubled                        — forward, T to both quantities
#     q2  v_rms doubled, find T            — reverse; square the speed factor
#     q3  T halved                         — downward; root of a fraction
#     q4  figure, one gas at two T         — read speed ratio off the axis
#     q5  figure, two gases at one T       — mass changes speed, not energy
#     q6  K_avg tripled, find v_rms        — enters through K, skips T entirely
#   q5 is the only one that exercises the molar-mass half of THM-KTTP-2; the
#   rest hold mass fixed. Distractor sets are kept parallel so difficulty stays
#   comparable, and each set contains one "nothing changes, the container is
#   rigid" option (q1, q3, q6) or its mass-based equivalent (q5).
#
# Figures come from Scripts/make_figures.py, which draws the real normalised
#   Maxwell-Boltzmann distribution. Equal areas are load-bearing in q4 and q5:
#   the hotter (or lighter) gas MUST peak lower as well as further right, and
#   q4's feedback points the student at exactly that. Do not replace these with
#   sketched curves of equal height.
