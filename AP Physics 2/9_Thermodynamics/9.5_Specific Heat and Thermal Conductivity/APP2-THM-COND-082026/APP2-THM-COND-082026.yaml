bank_info:
    title: Rate of Thermal Conduction Through a Rod
    bank_id: APP2-THM-COND-082026
    description: |-
      Isomorphic multiple choice problems for AP Physics 2, College Board Unit 9 Topic 9.5.

      A rod bridges a hot reservoir and a cold one, and every question is about how fast
      energy crosses it. The choices are spread far apart, so rough arithmetic will
      separate them, and several questions ask what happens to the transfer time when the
      rod is made thicker, shorter, or split in two. Most questions carry a figure drawn
      to scale. Watch for numbers in the problem that have nothing to do with the answer.

      Teaching notes: the target idea is that a steady conduction rate is set by the
      conductivity, the cross sectional area, the length and the temperature difference,
      and by nothing else about the rod. The cross section is where most of the damage
      happens, since the area goes as the square of the diameter and students reach for
      the diameter itself. q1 quotes a specific heat that plays no part in the answer,
      and q4 turns that red herring into the question, which is the pair worth teaching
      together. q7 is answered from the figure: the rod with the lowest conductivity of
      the four wins on geometry alone, and the other three trade conductivity against
      length in exactly compensating ways. The common errors the distractors are aimed at
      are using the diameter in place of the radius, scaling the area linearly with the
      diameter, inverting the proportionality between rate and length, and forgetting the
      second rod in q5. APP2-THM-SPHT-081826 and APP2-THM-ESTIM-082026 cover the specific
      heat half of Topic 9.5, and this bank is the conduction half.
    date created: 08-20-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-CON-1 # Relate the rate of conduction through an object to its conductivity, cross sectional area, length, and the temperature difference across it
        - THM-CON-2 # Predict how a transfer time changes when the geometry of the conducting path changes, including the square dependence on diameter
        - THM-CON-3 # Identify quantities that do not affect a steady state conduction rate, including the specific heat and the mass of the conductor
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted from the owner's outline: a thick metal rod bridging a hot and a
            cold reservoir, with the length, diameter, conductivity, specific heat and
            both reservoir temperatures given, and the student asked for the approximate
            time to move a stated amount of energy. The specific heat is deliberately
            unusable and is there to be recognised as such. The near distractor is the
            time that results from using the diameter where the radius belongs, which is
            a factor of four away, and the remaining two choices are decades off.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1, all built on the same rod and the same
            pair of reservoirs so the comparisons stay clean. q2 doubles the diameter and
            asks for the new time, with the other three choices being the same time
            scaled by the three other ways of combining the square and the inverse; q3
            compares two rods that differ in conductivity, length and diameter at once,
            so the factors have to be combined rather than read off; q4 removes the
            arithmetic entirely and asks whether the specific heat changes the steady
            rate, pairing each direction with a justification; q5 replaces the rod with
            two rods of half the diameter, which halves the total area and doubles the
            time rather than reducing it, and offers the one thin rod's time as the
            distractor for a student who forgets the second; q6 runs the relationship
            backwards for the length needed to stretch the transfer to a stated time,
            with the inverted proportionality as the near distractor; q7 is answered from
            a four panel figure in which the rod of lowest conductivity wins on cross
            section alone and the other three are exactly tied.

            Figures are generated by Scripts/make_figures.py and are drawn to scale, at
            one units per metre factor applied to both length and diameter, because q7
            depends on seeing that a short fat rod beats a long thin one.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-20-2026) Bank created with q1-q7. First conduction bank in Topic 9.5.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-20-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Time to Move Energy Along a Metal Rod
    points: 2
    figure: figure_folder/q-1.png
    text: |
      A metal rod <latex>1.5</latex> m long and <latex>0.5</latex> m in diameter connects
      a hot reservoir at <latex>300</latex> K to a cold reservoir at <latex>50</latex> K,
      as shown. The metal has a thermal conductivity of <latex>500</latex> W/(m·K) and a
      specific heat of <latex>700</latex> J/(kg·K). The sides of the rod are insulated,
      and the reservoirs are large enough that their temperatures do not change.

      Which of the following is approximately equal to the time needed to transfer
      <latex>20</latex> kJ of energy from the hot reservoir to the cold one?
    answers:
    - answer:
        text: <latex>0.3</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>1.2</latex> s
        lock: true
        correct: true
    - answer:
        text: <latex>12</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>120</latex> s
        lock: true
        correct: false
    feedback:
        general: |
          Conduction along the rod delivers energy at a steady rate, so the time is the
          energy divided by that rate. The rate is
          <latex>
          \frac{Q}{\Delta t} = \frac{k A \Delta T}{L}
          </latex>
          where <latex>k</latex> is the thermal conductivity, <latex>A</latex> is the
          cross sectional area of the rod, <latex>L</latex> is its length, and
          <latex>\Delta T</latex> is the difference between the two reservoir
          temperatures.

          The cross section is the part to be careful with, because you were given a
          diameter and the area needs a radius:
          <latex>
          A = \pi r^2 = \pi (0.25)^2 \approx 0.2
          </latex>
          in square metres. Then
          <latex>
          \frac{Q}{\Delta t} \approx \frac{(500)(0.2)(250)}{1.5}
          = \frac{25000}{1.5} \approx 16700
          </latex>
          watts, and the time is
          <latex>
          \Delta t = \frac{20000}{16700} \approx 1.2
          </latex>
          seconds. The exact value is <latex>1.22</latex> s.

          The choice of <latex>0.3</latex> s is the answer you get by putting
          <latex>0.5</latex> straight into <latex>\pi r^2</latex> instead of halving it
          first. That mistake multiplies the area by four and divides the time by four,
          and it is the most common way to lose this question. Reading a diameter and
          needing a radius comes up often enough that it is worth a deliberate pause
          every time.

          The specific heat is in this problem and has no part in the answer. It tells
          you how much energy the metal of the rod itself absorbs as it warms up, which
          matters while the rod is settling into its steady state and matters not at all
          once it has settled. A problem will sometimes hand you a quantity you do not
          need, and recognising one is a real skill rather than a trick.

          One last thing worth noticing. A rate of <latex>16700</latex> W is roughly
          sixteen space heaters running through a single rod, which tells you that a
          half metre thick piece of metal is a spectacular thermal leak. It is why
          anything meant to stay cold is supported on thin pieces of poorly conducting
          material.
        on_correct: |
          Correct, and you halved the diameter before squaring it. That step is where
          this question is usually lost.
        on_incorrect: |
          Two numbers in this problem describe the shape of the rod, and one number in
          it does not belong in the answer at all. Which quantity does the rate depend on
          through the shape of the cross section, and is that the number you were handed?

- multiple_choice:
    id: q2
    title: Doubling the Diameter of the Rod
    points: 2
    text: |
      The rod of the previous situation is replaced by one made of the same metal, still
      <latex>1.5</latex> m long, connecting the same reservoirs at <latex>300</latex> K
      and <latex>50</latex> K, but now <latex>1.0</latex> m in diameter. The thermal
      conductivity is still <latex>500</latex> W/(m·K). The original rod moved
      <latex>20</latex> kJ in about <latex>1.2</latex> s.

      Which of the following is approximately equal to the time the new rod needs to
      transfer the same <latex>20</latex> kJ?
    answers:
    - answer:
        text: <latex>0.3</latex> s
        lock: true
        correct: true
    - answer:
        text: <latex>0.6</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>2.4</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>4.9</latex> s
        lock: true
        correct: false
    feedback:
        general: |
          You do not have to redo the calculation. Everything about this rod is the same
          except its cross section, so work with the ratio.

          The area of a circle goes as the square of the diameter,
          <latex>
          A = \pi r^2 = \frac{\pi d^2}{4}
          </latex>
          so doubling the diameter multiplies the area by four, not by two. The rate is
          proportional to the area, so the rate is four times larger, and the time to
          move a fixed amount of energy is four times smaller:
          <latex>
          \Delta t = \frac{1.2}{4} \approx 0.3
          </latex>
          seconds.

          Every choice offered here is the original <latex>1.2</latex> s combined with
          the diameter in one of the four available ways, which is why they are worth
          walking through. Getting <latex>0.6</latex> s means treating the area as
          proportional to the diameter itself and halving the time. Getting
          <latex>2.4</latex> s or <latex>4.9</latex> s means the proportionality was
          turned over, so a thicker rod came out slower. A thicker rod is a wider road,
          and more energy per second gets through it, so any answer larger than
          <latex>1.2</latex> s can be ruled out before the arithmetic starts.

          Squaring is what makes cross section such a powerful lever. Doubling the
          diameter of a pipe, a wire or a rod multiplies what it carries by four, and
          this is the same reason a slightly thicker copper wire in a circuit has so much
          less resistance than you would guess.
        on_correct: |
          Correct, and you caught the square. Doubling the diameter is worth a factor of
          four, not a factor of two.
        on_incorrect: |
          Start by deciding whether the new time should be longer or shorter than
          <latex>1.2</latex> s, because that alone removes two of these choices. Then ask
          what happens to the area of a circle when its diameter doubles.

- multiple_choice:
    id: q3
    title: Comparing Two Rods That Differ in Three Ways
    points: 2
    figure: figure_folder/q-3.png
    text: |
      Two rods connect the same hot reservoir at <latex>300</latex> K to the same cold
      reservoir at <latex>50</latex> K, one at a time, as shown. Rod A has a thermal
      conductivity of <latex>400</latex> W/(m·K), a length of <latex>2.0</latex> m and a
      diameter of <latex>0.4</latex> m. Rod B has a thermal conductivity of
      <latex>200</latex> W/(m·K), a length of <latex>1.0</latex> m and a diameter of
      <latex>0.2</latex> m.

      Which rod transfers energy at the greater rate, and by approximately what factor?
    answers:
    - answer:
        text: Rod A, by a factor of about <latex>4</latex>
        correct: true
    - answer:
        text: Rod A, by a factor of about <latex>2</latex>
        correct: false
    - answer:
        text: Rod B, by a factor of about <latex>2</latex>
        correct: false
    - answer:
        text: The two rods transfer energy at the same rate
        correct: false
    feedback:
        general: |
          Three things differ at once here, so take them one at a time and then multiply.
          The rate is
          <latex>
          \frac{Q}{\Delta t} = \frac{k A \Delta T}{L}
          </latex>
          and the temperature difference is the same for both rods, so it drops out of
          the comparison and only the three properties of the rod are left.

          Rod A has twice the conductivity of rod B, which helps it by a factor of two.
          Rod A is twice as long, which hurts it by a factor of two. Those two cancel
          exactly, and if the diameters had matched, the rods would have been tied. The
          diameter is what breaks the tie: rod A is twice as wide, so its cross section
          is four times larger, and
          <latex>
          \frac{(2)(4)}{2} = 4
          </latex>
          Rod A transfers energy about four times as fast.

          Running the numbers confirms it. Using
          <latex>
          \frac{kA}{L}
          </latex>
          as the figure of merit, rod A gives about <latex>25</latex> W/K and rod B gives
          about <latex>6.3</latex> W/K.

          The choice of a factor of two comes from treating the wider rod as twice the
          conductor rather than four times, which is the same square that q2 turns on.
          The choice of rod B usually comes from noticing that rod B is shorter and
          stopping there, and shortness genuinely does help, but it is the only one of
          the three factors working in rod B's favour and the other two outweigh it.
        on_correct: |
          Correct, and the way you got there matters. Two of the three differences
          cancelled and the cross section decided it.
        on_incorrect: |
          Three separate properties differ between these rods, and two of them work
          against each other. Have you taken all three into account, or did one of them
          settle the answer on its own?

- multiple_choice:
    id: q4
    title: Does the Specific Heat Change the Transfer Rate
    points: 2
    text: |
      Two rods have the same length, the same diameter and the same thermal
      conductivity, and each connects the same hot reservoir to the same cold reservoir.
      They are made of different materials, and the specific heat of rod 1 is twice the
      specific heat of rod 2. Both rods have been in place long enough to reach a steady
      state, so the temperature at every point along each rod has stopped changing.

      Which of the following correctly compares the rates at which the two rods transfer
      energy from the hot reservoir to the cold one?
    answers:
    - answer:
        text: |
          Rod 1 transfers energy at twice the rate, because each kilogram of it can hold
          twice as much energy per kelvin.
        correct: false
    - answer:
        text: |
          Rod 2 transfers energy at twice the rate, because it takes less energy to warm
          it and so more of the energy passes through.
        correct: false
    - answer:
        text: |
          The two rods transfer energy at the same rate, because a steady conduction rate
          depends on the conductivity, the cross section, the length and the temperature
          difference, and those are the same for both.
        correct: true
    - answer:
        text: |
          Rod 1 transfers energy at half the rate, because more of the energy entering it
          stays in the rod rather than reaching the cold reservoir.
        correct: false
    feedback:
        general: |
          Look at what the relationship for a steady conduction rate actually contains:
          <latex>
          \frac{Q}{\Delta t} = \frac{k A \Delta T}{L}
          </latex>
          There is a conductivity, a cross section, a length and a temperature
          difference, and there is no specific heat anywhere in it and no mass either.
          The two rods match on every quantity that appears, so they transfer energy at
          the same rate.

          It is worth being clear about what the specific heat does control, because the
          wrong choices here are not silly. While a rod is first put in place, its own
          temperature is still changing, and some of the energy entering the hot end is
          being absorbed by the metal itself rather than passing through. During that
          period the material with the larger specific heat does hold back more energy,
          and it does take longer to settle. So rod 1 really would reach its steady state
          more slowly.

          Once the steady state arrives, that stops. Every point along the rod now sits
          at a temperature that is no longer changing, so the rod is not absorbing any
          net energy, and whatever enters the hot end leaves the cold end. The question
          told you both rods had reached that state, which is what makes the specific
          heat irrelevant.

          This is the same specific heat that appeared in q1 and had nothing to do with
          the answer there either. A quantity that governs how something warms up is not
          automatically a quantity that governs how fast energy moves through it, and
          keeping those two questions apart is most of what Topic 9.5 is asking you to do.
        on_correct: |
          Correct, and your reason is the important half. Nothing in the steady rate
          refers to how much energy the rod itself can hold.
        on_incorrect: |
          Write down the relationship for a steady conduction rate and read off the list
          of quantities that appear in it. Is the specific heat one of them, and does the
          phrase "steady state" change what the rod is doing with the energy that enters
          it?

- multiple_choice:
    id: q5
    title: Replacing One Rod with Two Thinner Rods
    points: 2
    figure: figure_folder/q-5.png
    text: |
      The <latex>1.5</latex> m rod of <latex>0.5</latex> m diameter is removed and
      replaced by two rods of the same metal and the same length, each
      <latex>0.25</latex> m in diameter, connecting the same two reservoirs side by side
      as shown. The original rod moved <latex>20</latex> kJ in about <latex>1.2</latex> s.

      Which of the following is approximately equal to the time the two thinner rods
      together need to transfer the same <latex>20</latex> kJ?
    answers:
    - answer:
        text: <latex>0.6</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>1.2</latex> s
        lock: true
        correct: false
    - answer:
        text: <latex>2.4</latex> s
        lock: true
        correct: true
    - answer:
        text: <latex>4.9</latex> s
        lock: true
        correct: false
    feedback:
        general: |
          This one is worth slowing down for, because two rods sound like more and the
          answer is that they are less.

          Halving the diameter of a rod divides its cross section by four, since the area
          goes as the square of the diameter. So each thin rod carries a quarter of what
          the original carried, and two of them together carry
          <latex>
          (2)\left(\frac{1}{4}\right) = \frac{1}{2}
          </latex>
          of the original. Half the rate means twice the time:
          <latex>
          \Delta t = (2)(1.2) = 2.4
          </latex>
          seconds.

          You can see the same thing by adding areas. The original rod had a cross
          section of about <latex>0.20</latex> square metres. Each thin rod has about
          <latex>0.049</latex> square metres, so the two together come to about
          <latex>0.098</latex>, which is half of what was there before. Replacing one
          rod by two rods of half the diameter throws away half of the conducting path.

          The choice of <latex>1.2</latex> s comes from adding the diameters instead of
          the areas, since two rods of <latex>0.25</latex> m do add up to
          <latex>0.5</latex> m of diameter. Diameters are not what conducts. The choice
          of <latex>4.9</latex> s is the time for a single thin rod, so it is the right
          reasoning with the second rod left out. The choice of <latex>0.6</latex> s
          treats two rods as automatically twice as good, which would be true only if
          each of them matched the original.

          This is a useful shape of result to carry with you. Whenever a quantity depends
          on the square of a size, splitting something into smaller copies loses ground
          even when the count goes up, and you have to compare the areas rather than the
          number of pieces.
        on_correct: |
          Correct, and this is a genuinely surprising result the first time you meet it.
          Two rods of half the diameter add up to half the conducting path.
        on_incorrect: |
          Two rods are more pieces of metal, but that is not the quantity the rate
          depends on. What is the total of the thing that actually matters here, compared
          with what the single rod offered?

- multiple_choice:
    id: q6
    title: How Long a Rod Would Stretch the Transfer to Ten Seconds
    points: 2
    text: |
      A rod of the same metal, still <latex>0.5</latex> m in diameter and with a thermal
      conductivity of <latex>500</latex> W/(m·K), connects the same reservoirs at
      <latex>300</latex> K and <latex>50</latex> K. At <latex>1.5</latex> m long it moved
      <latex>20</latex> kJ in about <latex>1.2</latex> s.

      Which of the following is approximately equal to the length the rod would need in
      order to take <latex>10</latex> s to transfer the same <latex>20</latex> kJ?
    answers:
    - answer:
        text: <latex>0.18</latex> m
        lock: true
        correct: false
    - answer:
        text: <latex>1.2</latex> m
        lock: true
        correct: false
    - answer:
        text: <latex>12</latex> m
        lock: true
        correct: true
    - answer:
        text: <latex>120</latex> m
        lock: true
        correct: false
    feedback:
        general: |
          The length sits in the denominator of the rate, so a longer rod is a slower
          rod. Nothing else about this rod is changing, which means the time is directly
          proportional to the length and the whole question is a proportion.

          The transfer has to be stretched from <latex>1.2</latex> s to
          <latex>10</latex> s, a factor of about eight, so the rod has to be about eight
          times longer:
          <latex>
          L = (8)(1.5) = 12
          </latex>
          metres. Working it out from the rate instead gives the same thing. Ten seconds
          for <latex>20</latex> kJ is a rate of <latex>2000</latex> W, so
          <latex>
          L = \frac{k A \Delta T}{Q / \Delta t}
          = \frac{(500)(0.2)(250)}{2000} = \frac{25000}{2000} \approx 12
          </latex>
          in metres. The exact value is <latex>12.3</latex> m.

          The choice of <latex>0.18</latex> m is the proportion turned upside down, and
          it is worth naming because it is easy to write down without noticing. It says
          that shortening the rod to about a fifth of its length would slow the transfer,
          when a shorter rod gives the energy a shorter distance to cross and speeds it
          up. Before dividing anything, decide which way the answer has to go. You need
          the transfer slower, so you need the rod longer than <latex>1.5</latex> m, and
          that single check removes two of these four choices.

          Twelve metres of half metre thick metal is an absurd object, and that is part
          of the lesson. Length is a weak lever compared with cross section, because it
          enters to the first power while the diameter enters squared. If you wanted to
          slow this transfer down in a real laboratory you would change the material or
          thin the rod, not stretch it.
        on_correct: |
          Correct, and the proportion was the quick way in. Eight times the time needs
          about eight times the length.
        on_incorrect: |
          Decide first whether the rod has to get longer or shorter, and check your
          answer against that before anything else. Does energy cross a long path or a
          short path more quickly?

- multiple_choice:
    id: q7
    title: Choosing the Fastest of Four Rods
    points: 2
    figure: figure_folder/q-7.png
    text: |
      Four rods are shown, each of which can be used to connect the same hot reservoir at
      <latex>300</latex> K to the same cold reservoir at <latex>50</latex> K. The thermal
      conductivity, length and diameter of each rod are given in the figure, and the rods
      are drawn to scale.

      Which rod transfers <latex>20</latex> kJ from the hot reservoir to the cold one in
      the least time?
    answers:
    - answer:
        text: Rod I
        lock: true
        correct: false
    - answer:
        text: Rod II
        lock: true
        correct: false
    - answer:
        text: Rod III
        lock: true
        correct: true
    - answer:
        text: Rod IV
        lock: true
        correct: false
    feedback:
        general: |
          The rod that takes the least time is the rod with the greatest rate, and since
          all four bridge the same two reservoirs, the temperature difference is the same
          for every one of them. That leaves
          <latex>
          \frac{kA}{L}
          </latex>
          as the only thing to compare, and the area is
          <latex>
          A = \frac{\pi d^2}{4}
          </latex>
          so a rod's diameter counts twice over.

          Rod III wins, and it wins with the lowest conductivity of the four. Compare it
          with rod I, which is the same length. Rod III has half the conductivity, which
          costs it a factor of two, and twice the diameter, which gains it a factor of
          four, so it comes out twice as good.

          The other three are exactly tied, which is the part worth sitting with. Rod II
          has twice the conductivity of rod I and twice the length, and those cancel. Rod
          IV has four times the conductivity of rod I and four times the length, and
          those cancel too. All three have the same diameter, so nothing else separates
          them. Using
          <latex>
          \frac{kA}{L}
          </latex>
          the three of them come to about <latex>6.3</latex> W/K each and rod III comes
          to about <latex>12.6</latex> W/K.

          Rod IV is the trap, and the figure is what gives it away. It has by far the
          best material, eight times the conductivity of rod III, and it is still only
          half as good, because it is four times as long and half as wide. When you look
          at the picture, rod IV is a hairline stretched across the gap and rod III is
          short and stout, which is exactly what the numbers say.

          The lesson is that a material property and a geometry can be traded against
          each other, and a good material laid out badly loses to a poor material laid
          out well. It is the same reason a thick aluminum heat sink beats a thin copper
          one, even though copper is the better conductor.
        on_correct: |
          Correct, and notice that the winner has the worst material of the four. The
          shape of the path did that.
        on_incorrect: |
          The rod with the highest conductivity is not the answer here, so the material
          is not deciding this on its own. Which two features of the shape of a rod also
          enter its rate, and does either of them count more heavily than the other?
