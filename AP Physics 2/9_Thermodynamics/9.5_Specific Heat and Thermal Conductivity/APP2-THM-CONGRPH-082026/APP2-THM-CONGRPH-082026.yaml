bank_info:
    title: Graphs of the Thermal Conduction Rate
    bank_id: APP2-THM-CONGRPH-082026
    description: |-
      Isomorphic multiple choice problems for AP Physics 2, College Board Unit 9 Topic 9.5.

      Every question here is a graph of the rate of energy transfer along a rod against
      one of the quantities that sets it. Some show four graphs and ask which one matches
      the situation described, some show one graph and ask how it would change if the rod
      were altered, and one asks what to plot in order to straighten a curve. The
      relationship behind all of them is the same, so the work is deciding which quantity
      sits on top, which sits underneath, and which is squared.

      Teaching notes: the target idea is that a relationship you can write down has a
      shape, and reading that shape off a graph is the same skill as rearranging the
      relationship. The three shapes on offer are proportional for area, temperature
      difference and conductivity, inverse for length, and square for diameter. The pair
      worth teaching together is q1 and q5, which differ only in whether the horizontal
      axis carries the area or the diameter, and which therefore have different correct
      shapes. q3 and q4 are the transformation questions and are answered by comparing
      slopes against the grid rather than by calculating. q6 is a linearisation, which is
      the form the AP exam usually asks this in and is also how a conductivity gets
      measured in a laboratory. The common errors the distractors are aimed at are giving
      a proportional graph a nonzero intercept, drawing the inverse relationship as a
      falling straight line, scaling with diameter rather than diameter squared, and
      inverting a proportionality so that a longer rod looks faster. APP2-THM-COND-082026
      is the companion bank that asks the same physics numerically.
    date created: 08-20-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-CGR-1 # Identify the graph shape that matches a proportional, inverse, or square relationship taken from the conduction rate equation
        - THM-CGR-2 # Predict how a graph of conduction rate changes when the geometry of the rod is changed
        - THM-CGR-3 # Choose a horizontal axis variable that linearises measured conduction data, and interpret the slope of a conduction graph
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted from the owner's outline: a rod between two fixed reservoirs whose
            cross sectional area is varied, with four candidate graphs of transfer rate
            against area. The correct shape is a straight line through the origin, and the
            distractors are the square shape that belongs to a diameter axis, a straight
            line with a nonzero intercept, and the inverse shape that belongs to a length
            axis. Every distractor is therefore the correct answer to one of the other
            questions in this bank, which is what keeps the set honest.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1, all built on the same rod and the same
            pair of reservoirs. q2 varies the length, so the correct shape is the inverse
            one and the tempting distractor is a falling straight line; q3 shows one
            measured line and doubles the length, so the slope halves and the line stays
            through the origin; q4 shows one measured line and doubles the diameter, so
            the slope quadruples, and all four choices are the original slope scaled by
            one of the four available factors; q5 varies the diameter rather than the
            area, so the correct shape is the square one and the proportional graph from
            q1 becomes the distractor; q6 gives measured data with a curved shape and asks
            what to plot to straighten it, which is the linearisation form the AP exam
            prefers; q7 shows two rods on one pair of axes and asks for a ratio of
            diameters, so the slope ratio has to be read off the grid and then a square
            root taken, with the unrooted slope ratio as the near distractor.

            Figures are generated by Scripts/make_figures.py. The correct panel is not
            always in the same position: II, IV, III, I, IV for q1 to q5.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-20-2026) Bank created with q1-q7. First graph bank in Topic 9.5.
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-20-2026
    authors:
        - Michael Baker

questions:

- multiple_choice:
    id: q1
    title: Transfer Rate Against Cross Sectional Area
    points: 2
    figure: figure_folder/q-1.png
    text: |
      A rod connects a hot reservoir to a cold reservoir, and both reservoir temperatures
      are held fixed. The experiment is repeated with several rods made of the same metal
      and cut to the same length but with different cross sectional areas, and the rate at
      which energy travels along the rod is measured each time.

      Which graph shows how the rate of energy transfer depends on the cross sectional
      area of the rod?
    answers:
    - answer:
        text: Graph I
        lock: true
        correct: false
    - answer:
        text: Graph II
        lock: true
        correct: true
    - answer:
        text: Graph III
        lock: true
        correct: false
    - answer:
        text: Graph IV
        lock: true
        correct: false
    feedback:
        general: |
          Write the relationship down and then look at what is being held fixed:
          <latex>
          \frac{Q}{\Delta t} = \frac{k A \Delta T}{L}
          </latex>
          The conductivity, the length and the temperature difference are all the same
          from one rod to the next, so gather them together and the whole relationship
          reads
          <latex>
          \frac{Q}{\Delta t} = \left(\frac{k \Delta T}{L}\right) A
          </latex>
          That is a constant multiplied by <latex>A</latex>, which is a straight line
          through the origin with the bracket as its slope. Graph II.

          The origin matters as much as the straightness. A rod of no cross section is no
          rod at all, so the rate has to be zero when the area is zero, and graph III
          fails on exactly that point. It has the right straightness and the wrong
          intercept, and it claims that a rod of zero thickness still carries energy.
          When you are checking a proportional relationship on a graph, check both
          things: a straight line and a line that passes through the origin.

          Graph I curves upward, which is the shape of a square relationship. It is not
          wrong about conduction, it is answering a different question, and you will meet
          it again in this set when the horizontal axis carries the diameter instead of
          the area. Graph IV falls away as an inverse curve, which is what the length
          does, since the length is the one quantity in the relationship that sits
          underneath.

          A quick physical check is worth having. Widening the road lets more traffic
          through, in direct proportion to how much wider you made it, and doubling the
          cross section of the rod doubles the rate.
        on_correct: |
          Correct, and you checked the intercept as well as the shape. Both are part of
          what proportional means.
        on_incorrect: |
          Look at the relationship and sort its quantities into the ones being held fixed
          and the one being varied. Once the fixed ones are gathered into a single
          constant, what kind of relationship is left between the two quantities on these
          axes?

- multiple_choice:
    id: q2
    title: Transfer Rate Against Length
    points: 2
    figure: figure_folder/q-2.png
    text: |
      A rod connects a hot reservoir to a cold reservoir, and both reservoir temperatures
      are held fixed. The experiment is repeated with several rods made of the same metal
      and having the same cross sectional area but different lengths, and the rate at
      which energy travels along the rod is measured each time.

      Which graph shows how the rate of energy transfer depends on the length of the rod?
    answers:
    - answer:
        text: Graph I
        lock: true
        correct: false
    - answer:
        text: Graph II
        lock: true
        correct: false
    - answer:
        text: Graph III
        lock: true
        correct: false
    - answer:
        text: Graph IV
        lock: true
        correct: true
    feedback:
        general: |
          The length is the one quantity in
          <latex>
          \frac{Q}{\Delta t} = \frac{k A \Delta T}{L}
          </latex>
          that sits in the denominator, and everything else is being held fixed, so
          <latex>
          \frac{Q}{\Delta t} = \left(k A \Delta T\right) \frac{1}{L}
          </latex>
          The rate is inversely proportional to the length, which is the falling curve of
          graph IV.

          Two features identify an inverse curve and both are visible here. It falls
          steeply at small values and then flattens, and it never actually reaches zero,
          it only gets closer. Doubling the length halves the rate, doubling it again
          halves the rate once more, and no finite length ever shuts the transfer off
          completely.

          Graph I is the one worth arguing with, because falling is the right direction
          and it is easy to accept a falling straight line without asking what it claims.
          Follow that line to where it crosses the horizontal axis. It says there is a
          particular length at which the rate becomes exactly zero, and beyond that a
          longer rod would carry energy backwards, from the cold reservoir to the hot
          one. Nothing in the physics allows that. A straight line and an inverse curve
          are different claims, and this is a good habit to build: extend a line to its
          intercepts and ask whether what it says there could be true.

          Graphs II and III both rise, so they say a longer rod moves energy faster. The
          rod is the path the energy has to cross, and a longer path is a slower one.
        on_correct: |
          Correct. The length sits underneath, and that is what makes the curve fall away
          without ever reaching zero.
        on_incorrect: |
          Decide first whether the rate should rise or fall as the rod gets longer, which
          removes half of these graphs. Then follow the graph you chose out to the right
          and ask whether a rod could ever be long enough to stop the transfer completely.

- multiple_choice:
    id: q3
    title: How the Graph Changes When the Rod Is Made Longer
    points: 2
    figure: figure_folder/q-3.png
    text: |
      The dashed line repeated in each graph shows how the rate of energy transfer along
      a particular rod depends on the temperature difference between the two reservoirs.
      The rod is then replaced by one made of the same metal, with the same cross section,
      but twice as long, and the measurements are repeated.

      In which graph does the solid line show the new measurements?
    answers:
    - answer:
        text: Graph I
        lock: true
        correct: false
    - answer:
        text: Graph II
        lock: true
        correct: false
    - answer:
        text: Graph III
        lock: true
        correct: true
    - answer:
        text: Graph IV
        lock: true
        correct: false
    feedback:
        general: |
          Two questions settle this, and they are worth asking in this order. Does the
          shape change, and does the slope change?

          The shape does not change. With the rod fixed and the temperature difference
          varied,
          <latex>
          \frac{Q}{\Delta t} = \left(\frac{k A}{L}\right) \Delta T
          </latex>
          is proportional no matter what the rod is made of or how long it is, so the new
          measurements still lie on a straight line through the origin. That already
          removes graph IV, which bends over, and graph II, which is straight but crosses
          the vertical axis below the origin.

          The slope does change. The slope is the bracket, and the new rod has twice the
          length, so the slope is halved. Graph III shows a line through the origin at
          half the steepness of the dashed one, which you can confirm against the grid.

          Graph I doubles the slope instead, and it is the most common wrong choice
          because doubling something in the problem and doubling something on the graph
          feels like a match. The length is in the denominator, so doubling it makes the
          slope smaller. Whenever a quantity is doubled, find where it sits in the
          relationship before deciding which way the graph moves.

          Graph II deserves a moment because it is a specific misunderstanding rather
          than a careless answer. Sliding the line down keeps the slope and subtracts a
          constant, which would mean the rod carries no energy at all until the
          temperature difference exceeds some threshold, and carries energy from cold to
          hot below it. There is no threshold. Any temperature difference at all, however
          small, drives some transfer.
        on_correct: |
          Correct, and you kept the line through the origin. A longer rod is a slower rod
          at every temperature difference, including very small ones.
        on_incorrect: |
          Ask two separate questions about the new line. Does the shape of the
          relationship change when only the length changes, and where in the relationship
          does the length sit?

- multiple_choice:
    id: q4
    title: How the Graph Changes When the Rod Is Made Thicker
    points: 2
    figure: figure_folder/q-4.png
    text: |
      The dashed line repeated in each graph shows how the rate of energy transfer along
      a particular rod depends on the temperature difference between the two reservoirs.
      The rod is then replaced by one made of the same metal, of the same length, but
      with twice the diameter, and the measurements are repeated.

      In which graph does the solid line show the new measurements?
    answers:
    - answer:
        text: Graph I
        lock: true
        correct: true
    - answer:
        text: Graph II
        lock: true
        correct: false
    - answer:
        text: Graph III
        lock: true
        correct: false
    - answer:
        text: Graph IV
        lock: true
        correct: false
    feedback:
        general: |
          The line stays straight and stays through the origin, for the same reason as in
          the previous question, so the whole answer is in the slope:
          <latex>
          \frac{Q}{\Delta t} = \left(\frac{k A}{L}\right) \Delta T
          </latex>
          Only the cross section changes, and the cross section is
          <latex>
          A = \frac{\pi d^2}{4}
          </latex>
          so doubling the diameter multiplies the area by four, not by two. The slope is
          four times larger, which is graph I.

          Check it against the grid rather than trusting your eye. At a temperature
          difference of <latex>2</latex> K the dashed line sits at <latex>1</latex> W, and
          the solid line in graph I sits at <latex>4</latex> W. That is the factor of four.
          Graph II sits at <latex>2</latex> W, so it is only twice as steep, and graphs
          III and IV are shallower than the original, which would mean a thicker rod
          carries less.

          Graph II is the answer to give if you scale the area with the diameter itself,
          and it is the single most common mistake in this topic. The diameter is a
          length across the rod and the area covers the whole face, so widening the rod
          buys you room in two directions at once. That is what the square is recording.

          It is worth noticing how much stronger this lever is than the one in the
          previous question. Doubling the length cost a factor of two and doubling the
          diameter gained a factor of four, and the two are not symmetric because one
          quantity is squared and the other is not.
        on_correct: |
          Correct, and you caught the square. Reading the two lines against the grid at
          the same temperature difference is the quickest way to confirm a factor like
          this.
        on_incorrect: |
          The graph is telling you about a rate and the problem is telling you about a
          diameter, so something has to connect the two. Which property of the rod
          appears in the relationship, and how is it related to the diameter?

- multiple_choice:
    id: q5
    title: Transfer Rate Against Diameter
    points: 2
    figure: figure_folder/q-5.png
    text: |
      A rod connects a hot reservoir to a cold reservoir, and both reservoir temperatures
      are held fixed. The experiment is repeated with several rods made of the same metal
      and cut to the same length but with different diameters, and the rate at which
      energy travels along the rod is measured each time.

      Which graph shows how the rate of energy transfer depends on the diameter of the
      rod?
    answers:
    - answer:
        text: Graph I
        lock: true
        correct: false
    - answer:
        text: Graph II
        lock: true
        correct: false
    - answer:
        text: Graph III
        lock: true
        correct: false
    - answer:
        text: Graph IV
        lock: true
        correct: true
    feedback:
        general: |
          Compare this with the first question in the set, because the situation is the
          same and only the horizontal axis has changed.

          The rate is proportional to the cross sectional area, and the area is
          proportional to the square of the diameter:
          <latex>
          \frac{Q}{\Delta t} \propto A = \frac{\pi d^2}{4} \propto d^2
          </latex>
          So against the diameter the rate goes as the square, which is the curve that
          starts flat at the origin and steepens, graph IV.

          Graph I is the trap, and it is a good trap. It is the correct answer when the
          horizontal axis carries the area, which is what q1 asked, and a student who
          remembers "the graph is a straight line" without remembering what it was a
          straight line against will pick it here. The lesson is that a relationship does
          not have one shape, it has a shape with respect to a particular variable, and
          the axis label is part of the question.

          Graph III is a square root shape, rising quickly and then flattening. That is
          how the diameter depends on the area, which is the same relationship read
          backwards, so it is the answer to a question nobody asked. Graph II falls, and
          nothing about a thicker rod should reduce the rate.

          Notice what the shape of graph IV tells you physically. Down at small diameters
          the curve is nearly flat, so making a thin rod slightly thicker barely helps.
          Up at large diameters the same small increase in diameter buys a large increase
          in rate. That is why heat sinks and cooking pans are built with generous cross
          sections rather than long paths.
        on_correct: |
          Correct, and you noticed the axis. The same physics gives a different shape
          against the diameter than it does against the area.
        on_incorrect: |
          Read the label on the horizontal axis carefully and compare it with the quantity
          that actually appears in the relationship. Are those the same quantity, and if
          not, how is one related to the other?

- multiple_choice:
    id: q6
    title: Straightening a Curved Set of Measurements
    points: 2
    figure: figure_folder/q-6.png
    text: |
      The graph shows measurements of the rate of energy transfer along a rod as its
      length is varied, with the metal, the cross section and both reservoir temperatures
      held fixed.

      A student wants to replot these measurements so that they fall on a straight line
      through the origin, keeping the rate of energy transfer on the vertical axis. Which
      quantity should be plotted on the horizontal axis?
    answers:
    - answer:
        text: <latex>L^2</latex>
        correct: false
    - answer:
        text: <latex>\sqrt{L}</latex>
        correct: false
    - answer:
        text: <latex>1/L</latex>
        correct: true
    - answer:
        text: <latex>1/L^2</latex>
        correct: false
    feedback:
        general: |
          Start from the relationship and separate what is fixed from what is varying:
          <latex>
          \frac{Q}{\Delta t} = \left(k A \Delta T\right) \frac{1}{L}
          </latex>
          Everything in the bracket is held constant in this experiment, so the rate is a
          constant multiplied by <latex>1/L</latex>. Compare that with the equation of a
          straight line through the origin,
          <latex>
          y = m x
          </latex>
          and the match is exact when <latex>y</latex> is the rate and <latex>x</latex>
          is <latex>1/L</latex>. Plotting the rate against <latex>1/L</latex> gives a
          straight line whose slope is <latex>k A \Delta T</latex>.

          The general method is worth more than this one answer. Whenever measurements
          come out curved, write the relationship so that the quantity you varied appears
          once, then plot the rate against whatever combination of that quantity is
          sitting there. If the relationship had gone as the square of the length you
          would plot against <latex>L^2</latex>, and if it had gone as an inverse square
          you would plot against <latex>1/L^2</latex>. Both of those are offered here and
          both are honest guesses, but neither matches this relationship, where the length
          appears once and underneath.

          Why bother straightening a curve at all? Two reasons, and both are practical. A
          straight line is easy to judge by eye, so it is easy to see whether the
          measurements really follow the relationship you expected or drift away from it
          at one end. And the slope of a straight line carries information you can
          extract. Here the slope is <latex>k A \Delta T</latex>, so a student who has
          measured the cross section and the temperature difference can divide them out
          and be left with the thermal conductivity of the metal. That is how a
          conductivity actually gets measured, and it is the reason the AP exam asks
          questions in this shape so often.
        on_correct: |
          Correct, and the slope of that plot is worth knowing too. It comes out as the
          conductivity multiplied by the area and the temperature difference.
        on_incorrect: |
          Rearrange the relationship so that the length appears exactly once, then set it
          beside the equation of a straight line through the origin. Which part of your
          rearranged relationship is sitting where the horizontal axis variable sits?

- multiple_choice:
    id: q7
    title: Comparing the Slopes of Two Rods
    points: 2
    figure: figure_folder/q-7.png
    text: |
      The graph shows the rate of energy transfer against the temperature difference
      between the reservoirs for two rods, X and Y. The two rods are made of the same
      metal and have the same length.

      The diameter of rod X is approximately how many times the diameter of rod Y?
    answers:
    - answer:
        text: <latex>2</latex>
        lock: true
        correct: true
    - answer:
        text: <latex>4</latex>
        lock: true
        correct: false
    - answer:
        text: <latex>8</latex>
        lock: true
        correct: false
    - answer:
        text: <latex>16</latex>
        lock: true
        correct: false
    feedback:
        general: |
          Read the slopes off the grid first. At a temperature difference of
          <latex>4</latex> K, rod X is transferring <latex>4</latex> W and rod Y is
          transferring <latex>1</latex> W, so the slopes are <latex>1</latex> W/K and
          <latex>0.25</latex> W/K. Rod X has four times the slope of rod Y.

          Now turn that into a statement about the rods. The slope of each line is
          <latex>
          \frac{kA}{L}
          </latex>
          and the two rods share a metal and a length, so <latex>k</latex> and
          <latex>L</latex> are the same for both and the slopes differ only through the
          cross sectional area. Rod X has four times the area of rod Y.

          The last step is the one to be careful with. Area goes as the square of the
          diameter, so four times the area is not four times the diameter:
          <latex>
          \frac{d_X}{d_Y} = \sqrt{\frac{A_X}{A_Y}} = \sqrt{4} = 2
          </latex>
          Rod X is about twice as wide as rod Y.

          The choice of <latex>4</latex> is the slope ratio itself, reported one step
          early. It is the right reading of the graph and the right comparison of areas,
          and it stops just before the question that was actually asked. Reading the
          question again after you finish a calculation catches this kind of thing, and
          it is worth doing every time. The choice of <latex>16</latex> squares the ratio
          instead of taking its square root, which is the same relationship applied
          backwards.

          One thing this graph shows nicely is that both lines pass through the origin.
          No temperature difference means no transfer, for either rod, whatever they are
          made of and however they are shaped. The rods differ in how steeply they respond,
          not in whether they respond.
        on_correct: |
          Correct, and you took the square root at the end. The graph compares areas, and
          the question asked about diameters.
        on_incorrect: |
          You can read the ratio of the two slopes straight off the grid, so start there
          and decide what that ratio tells you about. Is the quantity the slope compares
          the same quantity the question asked about?
