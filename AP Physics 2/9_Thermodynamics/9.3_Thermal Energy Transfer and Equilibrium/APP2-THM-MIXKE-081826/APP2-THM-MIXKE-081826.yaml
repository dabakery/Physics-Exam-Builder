bank_info:
    title: Average Kinetic Energy When Three Gases Mix
    bank_id: APP2-THM-MIXKE-081826
    description: |-
      Isomorphic reasoning problems for AP Physics 2, College Board Unit 9 Topic 9.3.

      Three gases at three different temperatures sit in a rigid insulated container,
      separated by two removable barriers. The barriers come out, the gases mix, and you
      are asked what has to be true about the average kinetic energy of the atoms once
      everything settles. Some of these can be answered for all three gases and some
      cannot, so read what you are given about the amount of each gas before you commit
      to an answer.

      Teaching notes: the target idea is that the mixture ends at a single temperature
      lying somewhere between the coldest and the hottest starting temperature, so the
      coldest gas has to warm and the hottest has to cool, while the middle gas can go
      either way unless the amounts are given. The second idea is that one temperature
      means one average translational kinetic energy per particle for every species in
      the mixture, whatever its atomic mass. The common errors are ranking final kinetic
      energy by atomic mass, reading equal kinetic energy as equal speed, assuming the
      middle gas must cool because two of the three are hotter than it, and taking the
      final temperature to be the plain average of the three. APP2-THM-ETDIR-081826
      handles the two-sample version of the direction question, and
      APP2-THM-AVGKE-080926 establishes the link between temperature and average
      kinetic energy per particle.
    date created: 08-18-2026
    status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives:
        - THM-TET-1 # Predict the direction of thermal energy transfer between objects in thermal contact from their temperatures
        - THM-TET-2 # Justify the direction of energy transfer using average kinetic energy per particle rather than mass, speed, or total energy
        - THM-TET-3 # Recognize that samples in thermal equilibrium share one temperature and therefore one average translational kinetic energy per particle
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            (q1 drafted as a worked reference example from the owner's outline: three
            gases in a rigid insulated container behind two removable barriers, with
            atomic mass falling from A to C and temperature rising from A to C. The
            barriers are removed and the gases mix. The student selects every statement
            that must be true about the average kinetic energy of each gas afterwards.
            Gas A must gain and gas C must lose, gas B is indeterminate because the
            amounts of gas are withheld, and all three finish with the same average
            translational kinetic energy per atom. The distractors offer the middle gas
            as determinate, rank final kinetic energy by atomic mass, and read equal
            kinetic energy as equal speed. Multiple answers rather than multiple choice,
            because the useful skill here is separating what is settled from what is
            not.)
        - prompt 2: |
            (q2-q7 authored as isomorphs of q1. Each changes something in the solution
            rather than the nouns: q2 reverses the temperature ordering while leaving
            the mass ordering alone, so the answers flip and a mass-based rule gives the
            same answer to both questions and is wrong on one of them; q3 supplies equal
            amounts, so the middle gas becomes determinate and warms; q4 makes the cold
            gas three times as plentiful, so the final temperature falls well below the
            plain average of the three and the middle gas cools instead; q5 places the
            final temperature exactly on the middle gas, which therefore does not change
            at all, with a distractor claiming it exchanged no energy; q6 switches the
            question from kinetic energy to speed, names real gases so the molar masses
            can be used, and is the one question in the bank where atomic mass legitimately
            decides something; q7 removes the barriers one at a time, so the middle gas
            overshoots to 650 K before settling at 500 K, and the two-stage route lands on
            the same final temperature as the one-stage route.)
        - figure prompt: |
            (Every question in this bank shows the same apparatus, generated by
            Scripts/make_figures.py: a rigid insulated box divided into three chambers
            by two dashed removable barriers, each chamber labelled with its gas and its
            given data, with circle size showing relative atomic mass. Where the amounts
            of gas are withheld the chambers all show the same number of circles and the
            caption says the amounts are not shown, so the figure cannot imply an answer
            the question deliberately leaves open. q7 removes the barriers in a stated
            order, so its two barriers carry their own labels rather than the shared one.)
        - formatting prompt: "../../../../Templates/YAML_formatting_prompt.md"
    updates:
        - update 1: (08-18-2026) Bank created with q1. Second bank in Topic 9.3.
        - update 2: (08-18-2026) Added isomorphs q2-q7 (reversed temperature ordering, equal amounts given, cold gas in excess, final temperature landing on the middle gas, speed ranking with named gases, barriers removed one at a time).
    generation details:
            model: Claude Opus 5
            version: claude-opus-5
            last updated: 08-18-2026
    authors:
        - Michael Baker

questions:

- multiple_answers:
    id: q1
    title: Three Gases Mixed with the Amounts Unknown
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Gas A has
      the most massive atoms and gas C the least massive, so
      <latex>m_A > m_B > m_C</latex>. Gas C starts at the highest temperature and gas A
      at the lowest, so <latex>T_C > T_B > T_A</latex>. How much of each gas is present
      is not given.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-1.png
    answers:
    - answer:
        text: |
          The average kinetic energy of the atoms of gas A is greater than it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is less than it was before the
          barriers were removed.
        correct: false
    - answer:
        text: |
          The average kinetic energy of the atoms of gas C is less than it was before the
          barriers were removed.
        correct: true
    - answer:
        text: |
          All three gases end with the same average translational kinetic energy per
          atom.
        correct: true
    - answer:
        text: |
          The atoms of gas A end with a greater average kinetic energy than the atoms of
          gas C, because the atoms of gas A are more massive.
        correct: false
    - answer:
        text: |
          The atoms of all three gases end with the same average speed.
        correct: false
    feedback:
        general: |
          Start with what the container guarantees. Nothing enters or leaves and nothing
          outside is pushed on, so the total internal energy of the three gases together
          is the same after mixing as it was before. The gases exchange energy among
          themselves until they all sit at one final temperature, and that final
          temperature has to land somewhere between the coldest starting temperature and
          the hottest one. Nothing can end up colder than the coldest gas started or
          hotter than the hottest gas started.

          That settles two of the three gases immediately. Gas A started at the lowest
          temperature, so the final temperature is above where gas A began and its atoms
          end up with more average kinetic energy than they started with. Gas C started
          at the highest temperature, so the final temperature is below where gas C
          began and its atoms end up with less. Those two are certain no matter how much
          of each gas is in the container.

          Gas B is the interesting one, and the honest answer is that you cannot tell.
          For monatomic ideal gases the final temperature is the average of the starting
          temperatures weighted by the number of moles,
          <latex>
          T_f = \frac{n_A T_A + n_B T_B + n_C T_C}{n_A + n_B + n_C}
          </latex>
          and the problem never tells you the amounts. Try it with numbers. Suppose the
          three gases start at <latex>200</latex> K, <latex>300</latex> K and
          <latex>600</latex> K. With one mole of each, the final temperature is
          <latex>
          T_f = \frac{200 + 300 + 600}{3} = 367
          </latex>
          in kelvin, and gas B warms up. Now keep the same temperatures but make it eight
          moles of A, one of B and one of C:
          <latex>
          T_f = \frac{(8)(200) + 300 + 600}{10} = 250
          </latex>
          in kelvin, and gas B cools down instead. Same temperature ordering, opposite
          outcome for the middle gas, so a statement about gas B cannot be one that must
          be true. Notice also that neither answer is the plain average of the three
          starting temperatures unless the amounts happen to be equal.

          Now for what happens to the three gases relative to one another. They are mixed
          together at one temperature, and
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          depends on the absolute temperature and on nothing else, so every atom in the
          container, whichever gas it belongs to, has the same average translational
          kinetic energy at the end. The atomic masses do not enter this at all, which is
          why ranking the final kinetic energies by mass fails.

          Equal average kinetic energy is not equal average speed, and this is the
          distinction worth holding on to. Writing the kinetic energy out,
          <latex>
          \frac{1}{2} m v^2
          </latex>
          shows that a heavier atom reaches the same energy at a lower speed. The heavy
          gas A atoms end up slowest and the light gas C atoms end up fastest, even
          though every atom in the mixture averages the same kinetic energy.
        on_correct: |
          Correct on all three, and the one you left out is the point of the question.
          Knowing which gas you cannot make a statement about is worth as much here as
          knowing the two you can.
        on_incorrect: |
          The final temperature has to sit somewhere between the coldest and the hottest
          starting temperature, and the problem never tells you how much of each gas is
          present. Which of your selections would still hold if the container turned out
          to be almost entirely gas A?

- multiple_answers:
    id: q2
    title: Three Gases Mixed with the Heaviest Gas the Hottest
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Gas A has
      the most massive atoms and gas C the least massive, so
      <latex>m_A > m_B > m_C</latex>. This time gas A starts at the highest temperature
      and gas C at the lowest, so <latex>T_A > T_B > T_C</latex>. How much of each gas
      is present is not given.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-2.png
    answers:
    - answer:
        text: |
          The average kinetic energy of the atoms of gas C is greater than it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas A is less than it was before the
          barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is greater than it was before
          the barriers were removed.
        correct: false
    - answer:
        text: |
          All three gases end with the same average translational kinetic energy per
          atom.
        correct: true
    - answer:
        text: |
          The atoms of gas A end with a greater average kinetic energy than the atoms of
          gas C, because the atoms of gas A are more massive.
        correct: false
    - answer:
        text: |
          The atoms of all three gases end with the same average speed.
        correct: false
    feedback:
        general: |
          The container settles at one final temperature, and that temperature has to
          land between the coldest starting temperature and the hottest one. Here gas C
          is the coldest, so gas C warms, and gas A is the hottest, so gas A cools. Both
          are certain whatever the amounts of gas turn out to be.

          Gas B cannot be settled. The final temperature is the average of the starting
          temperatures weighted by the number of moles,
          <latex>
          T_f = \frac{n_A T_A + n_B T_B + n_C T_C}{n_A + n_B + n_C}
          </latex>
          and with the amounts unknown it can land above or below where gas B started.

          Set this next to the version where the light gas was the hot one. The masses
          are ordered exactly the same way in both, and the answers come out opposite,
          because the temperatures are what changed. If you decided this one by looking
          at which atoms were heaviest, you would have given the same answer to both
          questions, and one of them would be wrong.

          At the end everything in the container is at one temperature, and
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          holds for every atom in it regardless of which gas it belongs to, so the
          average translational kinetic energy per atom is the same for all three gases.
          The average speeds are not, since a heavier atom needs less speed to carry the
          same kinetic energy. The heavy gas A atoms end up slowest even though they are
          the ones that started hottest.
        on_correct: |
          Correct. The mass ordering is identical to the other version of this setup and
          the answers came out reversed, which is the sign that you read the right thing.
        on_incorrect: |
          Compare this with the version where the lightest gas started hottest. What did
          you change in your reasoning between the two, and what did the problem actually
          change?

- multiple_answers:
    id: q3
    title: Equal Amounts of Three Gases with the Temperatures Given
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Each chamber
      holds <latex>2.0</latex> moles of gas. Gas A starts at <latex>200</latex> K, gas B
      at <latex>300</latex> K, and gas C at <latex>700</latex> K.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-3.png
    answers:
    - answer:
        text: |
          The final temperature of the mixture is <latex>300</latex> K, the middle of the
          three starting temperatures.
        correct: false
    - answer:
        text: |
          The final temperature of the mixture is <latex>400</latex> K.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is greater than it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is unchanged, because gas B
          started at the middle temperature of the three.
        correct: false
    - answer:
        text: |
          The average kinetic energy of the atoms of gas C is less than it was before the
          barriers were removed.
        correct: true
    - answer:
        text: |
          The atoms of gas A end with the same average speed as the atoms of gas C.
        correct: false
    feedback:
        general: |
          This time the amounts are given, so gas B stops being a guess and becomes a
          calculation.

          No energy enters or leaves and nothing outside is pushed on, so the total
          internal energy of the three gases together is unchanged. For monatomic ideal
          gases that gives
          <latex>
          n_A T_A + n_B T_B + n_C T_C = (n_A + n_B + n_C) T_f
          </latex>
          and with equal amounts in every chamber the mole counts divide out, leaving the
          plain average of the three starting temperatures:
          <latex>
          T_f = \frac{200 + 300 + 700}{3} = 400
          </latex>
          in kelvin.

          Now every gas can be checked against that one number. Gas A rises from
          <latex>200</latex> K to <latex>400</latex> K and gains kinetic energy per atom.
          Gas B rises from <latex>300</latex> K to <latex>400</latex> K, so it gains too.
          Gas C falls from <latex>700</latex> K to <latex>400</latex> K and loses.

          Two of the choices are worth naming as traps. The middle of the three starting
          temperatures is <latex>300</latex> K, and that is not where the mixture ends
          up, because <latex>700</latex> K sits much further above <latex>300</latex> K
          than <latex>200</latex> K sits below it. Starting in the middle also does not
          protect gas B from changing. It only means gas B could have gone either way
          before you did the arithmetic.

          The equal amounts are what make the final temperature the plain average here.
          That shortcut is not general, and the next question in this bank is built to
          show you where it fails.

          The average speeds are not equal at the end, since gas A has the heavier atoms
          and a heavier atom carries the same kinetic energy at a lower speed.
        on_correct: |
          Correct, and notice how much more the numbers told you than the orderings did.
          With the amounts given, all three gases can be pinned down.
        on_incorrect: |
          The amounts of gas are given this time, which was the missing piece in the
          earlier version of this setup. What can you now work out that you could not
          work out before, and what would you check each gas against once you have it?

- multiple_answers:
    id: q4
    title: More of the Cold Gas Than of the Others
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. The first
      chamber holds <latex>6.0</latex> moles of gas A at <latex>250</latex> K, the second
      holds <latex>2.0</latex> moles of gas B at <latex>400</latex> K, and the third
      holds <latex>2.0</latex> moles of gas C at <latex>700</latex> K.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-4.png
    answers:
    - answer:
        text: |
          The final temperature of the mixture is <latex>450</latex> K, the average of the
          three starting temperatures.
        correct: false
    - answer:
        text: |
          The final temperature of the mixture is <latex>370</latex> K.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas A is greater than it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is less than it was before the
          barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is greater than it was before
          the barriers were removed, because gas B started at neither the hottest nor the
          coldest temperature.
        correct: false
    - answer:
        text: |
          The atoms of gas A end with the greatest average kinetic energy of the three
          gases, because there is more of gas A than of the other two.
        correct: false
    feedback:
        general: |
          The amounts are not equal here, so the final temperature is not the plain
          average of the three starting temperatures. Each gas counts in proportion to
          how much of it there is:
          <latex>
          T_f = \frac{n_A T_A + n_B T_B + n_C T_C}{n_A + n_B + n_C}
          = \frac{(6.0)(250) + (2.0)(400) + (2.0)(700)}{10.0}
          </latex>
          which works out to
          <latex>
          T_f = \frac{1500 + 800 + 1400}{10.0} = 370
          </latex>
          in kelvin. The plain average of <latex>250</latex> K, <latex>400</latex> K and
          <latex>700</latex> K is <latex>450</latex> K, and the true answer sits well
          below it because three quarters of the gas in the container starts at the
          coldest temperature. There is simply more cold gas to warm up than there is hot
          gas to cool down.

          Check each gas against <latex>370</latex> K. Gas A climbs from
          <latex>250</latex> K, so its atoms gain kinetic energy. Gas C drops from
          <latex>700</latex> K, so its atoms lose. Gas B started at <latex>400</latex> K,
          which is above the final temperature, so gas B cools even though it began
          between the other two. That is the whole point of this question. Starting in
          the middle tells you nothing on its own, and here it goes the opposite way from
          the equal-amounts version of this setup, where gas B warmed.

          The last choice mixes up two different ideas. Having more of a gas gives it more
          influence over where the final temperature lands, and it does not give its atoms
          any more kinetic energy each. At the end all three gases share one temperature,
          so
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          is the same for every atom in the container.
        on_correct: |
          Correct, and gas B cooling is the result worth remembering. Where a gas starts
          relative to the others does not decide which way it goes.
        on_incorrect: |
          The amounts are not equal in this one. What does that do to the way each
          starting temperature counts toward the final temperature, and where does the
          answer land compared with the plain average of the three?

- multiple_answers:
    id: q5
    title: A Gas That Ends Exactly Where It Started
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Each chamber
      holds <latex>3.0</latex> moles of gas. Gas A starts at <latex>250</latex> K, gas B
      at <latex>400</latex> K, and gas C at <latex>550</latex> K.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-5.png
    answers:
    - answer:
        text: |
          The final temperature of the mixture is <latex>400</latex> K.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas A is greater than it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is the same as it was before
          the barriers were removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B is greater than it was before
          the barriers were removed.
        correct: false
    - answer:
        text: |
          Gas B exchanges no energy with the other two gases, since its temperature does
          not change.
        correct: false
    - answer:
        text: |
          The atoms of gas C end with a greater average kinetic energy than the atoms of
          gas B, because gas C started hotter.
        correct: false
    feedback:
        general: |
          The amounts are equal again, so the final temperature is the plain average of
          the three starting temperatures:
          <latex>
          T_f = \frac{250 + 400 + 550}{3} = 400
          </latex>
          in kelvin. Gas B started at <latex>400</latex> K, so gas B ends exactly where it
          began and the average kinetic energy of its atoms is unchanged. Gas A warms from
          <latex>250</latex> K and gas C cools from <latex>550</latex> K, both by
          <latex>150</latex> K.

          A quantity that does not change is a real answer, and it is one students tend to
          rule out by reflex because it feels like nothing happened. Plenty happened.

          That is also why the claim that gas B exchanges no energy is wrong, and it is
          worth being careful here. Gas B is in contact with gas A, which is colder, and
          with gas C, which is hotter. Energy moves from gas B into gas A, and energy
          moves from gas C into gas B. Those two transfers happen to be equal, so gas B
          ends at the temperature it started at. The net change is zero and the traffic
          is not.

          The final choice fails for the reason that runs through this whole bank. Once
          the mixture is at one temperature, every atom in it averages the same
          translational kinetic energy,
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          no matter which gas it belongs to or how hot that gas used to be. Where a gas
          started tells you which way it moved, and it does not tell you where it ended
          up relative to the others, because they all end up in the same place.
        on_correct: |
          Correct. Gas B came out where it went in, and it did that by giving away exactly
          as much energy as it took in rather than by sitting the process out.
        on_incorrect: |
          Work out the final temperature first and then compare it with each starting
          value. Is a gas whose temperature does not change necessarily a gas that
          exchanged nothing with its neighbors?

- multiple_answers:
    id: q6
    title: Speeds in the Mixture After the Barriers Come Out
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Gas A is
      argon, with a molar mass of <latex>40</latex> g/mol, and starts at
      <latex>250</latex> K. Gas B is neon, at <latex>20</latex> g/mol, and starts at
      <latex>350</latex> K. Gas C is helium, at <latex>4</latex> g/mol, and starts at
      <latex>500</latex> K. How much of each gas is present is not given.

      Both barriers are removed and the three gases mix. No energy enters or leaves the
      container. After the mixture has reached thermal equilibrium, which of the
      following must be true? Select all that apply.
    figure: figure_folder/q-6.png
    answers:
    - answer:
        text: |
          Every atom in the mixture has the same average translational kinetic energy,
          whichever of the three gases it belongs to.
        correct: true
    - answer:
        text: |
          The helium atoms have the greatest average speed of the three gases.
        correct: true
    - answer:
        text: |
          The argon atoms have the smallest average speed of the three gases.
        correct: true
    - answer:
        text: |
          The three gases end with the same average atomic speed, since they end at the
          same temperature.
        correct: false
    - answer:
        text: |
          The helium atoms end with the greatest average kinetic energy, since they are
          the fastest atoms in the mixture.
        correct: false
    - answer:
        text: |
          The argon atoms end with the greatest average kinetic energy, since they are the
          most massive atoms in the mixture.
        correct: false
    feedback:
        general: |
          The mixture ends at one temperature somewhere between <latex>250</latex> K and
          <latex>500</latex> K. You cannot say exactly where without knowing the amounts,
          and for this question you do not need to.

          One temperature means one average translational kinetic energy per atom,
          <latex>
          K_{avg} = \frac{3}{2} k_B T
          </latex>
          which holds for the argon, the neon and the helium alike. Mass is nowhere in
          that expression.

          Speed is a different matter, because mass does appear there:
          <latex>
          v_{rms} = \sqrt{\frac{3 R T}{M}}
          </latex>
          With the same final temperature for all three, the ranking of the speeds is
          decided entirely by the molar masses. Helium is the lightest, so its atoms are
          the fastest, and argon is the heaviest, so its atoms are the slowest. The ratio
          is worth seeing:
          <latex>
          \frac{v_{He}}{v_{Ar}} = \sqrt{\frac{40}{4}} = 3.2
          </latex>
          so a helium atom in this mixture averages about three times the speed of an
          argon atom while carrying the same kinetic energy.

          This is the one place in this bank where the atomic masses genuinely matter, and
          it is worth being precise about what they decide. They do not decide which gas
          gains energy, which gas loses it, or how much kinetic energy an atom ends up
          with. They decide how fast an atom has to move to carry that energy.

          Notice also that the starting temperatures play no part in the speed ranking.
          Helium starts hottest and ends fastest, but it would end fastest even if it had
          started as the coldest of the three, because after mixing there is only one
          temperature left to share.
        on_correct: |
          Correct on all three. You kept kinetic energy and speed apart, which is the
          distinction this question is built on.
        on_incorrect: |
          Two quantities are being asked about here and only one of them is the same for
          all three gases at the end. Which is which, and what does the mass of an atom
          appear in?

- multiple_answers:
    id: q7
    title: Removing the Barriers One at a Time
    points: 3
    text: |
      Three monatomic ideal gases sit in a rigid, insulated container that is divided
      into three chambers by two removable barriers, as shown in the figure. Each chamber
      holds <latex>2.0</latex> moles of gas. Gas A starts at <latex>200</latex> K, gas B
      at <latex>400</latex> K, and gas C at <latex>900</latex> K.

      This time the barriers are removed one at a time. The barrier between gas B and gas
      C is removed first, and those two gases are allowed to mix and reach equilibrium.
      The barrier between gas A and the rest is then removed, and the whole container is
      allowed to reach equilibrium. No energy enters or leaves the container at any
      point. Which of the following must be true? Select all that apply.
    figure: figure_folder/q-7.png
    answers:
    - answer:
        text: |
          After the first barrier is removed and gases B and C reach equilibrium with each
          other, they are at <latex>500</latex> K.
        correct: false
    - answer:
        text: |
          The final temperature of the whole container is <latex>500</latex> K, the same
          as it would have been if both barriers had been removed at the same moment.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B ends greater than it was before
          any barrier was removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas C ends less than it was before
          any barrier was removed.
        correct: true
    - answer:
        text: |
          The average kinetic energy of the atoms of gas B rises and then does not change
          again.
        correct: false
    - answer:
        text: |
          The final temperature is higher than it would have been if both barriers had
          been removed at the same moment, because the energy is transferred in two
          stages.
        correct: false
    feedback:
        general: |
          Take the two stages in order. When the first barrier comes out, gas B and gas C
          mix on their own. Equal amounts, so their common temperature is the average of
          the two:
          <latex>
          T_{BC} = \frac{400 + 900}{2} = 650
          </latex>
          in kelvin. Gas A is still sealed off at <latex>200</latex> K and has taken no
          part yet.

          Now the second barrier comes out. There are <latex>4.0</latex> moles at
          <latex>650</latex> K meeting <latex>2.0</latex> moles at <latex>200</latex> K,
          so
          <latex>
          T_f = \frac{(4.0)(650) + (2.0)(200)}{6.0} = \frac{2600 + 400}{6.0} = 500
          </latex>
          in kelvin.

          Compare that with removing both barriers at once. The three chambers hold equal
          amounts, so the final temperature would be the plain average,
          <latex>
          \frac{200 + 400 + 900}{3} = 500
          </latex>
          in kelvin, which is the same answer. That is not a coincidence. No energy enters
          or leaves the container in either version, and no work is done on anything
          outside it, so the total internal energy at the end is the same total it started
          with however the gases got there. The order of mixing changes the path and not
          the destination.

          Follow gas B through the whole process, because it is the one that does
          something interesting. It starts at <latex>400</latex> K, rises to
          <latex>650</latex> K while mixing with the hot gas C, and then falls back to
          <latex>500</latex> K once the cold gas A joins in. It ends warmer than it
          started, so the average kinetic energy of its atoms is up on where it began, and
          it does not simply rise and stay put. If you are asked what happened to a gas,
          check the end state against the start rather than assuming a change carries
          straight through.

          Gas C falls from <latex>900</latex> K to <latex>650</latex> K and then to
          <latex>500</latex> K, so it loses kinetic energy at both stages. Gas A sits
          untouched at <latex>200</latex> K until the second barrier comes out and then
          climbs to <latex>500</latex> K.
        on_correct: |
          Correct, including the point that the two-stage route lands in the same place as
          the one-stage route. That is worth trusting, because it saves you the
          intermediate step whenever the question only asks where things end up.
        on_incorrect: |
          Work the two stages through in order and write down a temperature after each
          one. Does gas B finish at the temperature it reached in the first stage, and
          does the total energy in the container depend on when the barriers came out?
